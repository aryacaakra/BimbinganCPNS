{id:'pilar',h:`<h4>Empat konsensus dasar berbangsa dan bernegara</h4><table><tr><th>Konsensus</th><th>Kedudukan</th><th>Implementasi nyata</th></tr>
<tr><td><b>Pancasila</b></td><td>Dasar negara, ideologi, dan sumber segala sumber hukum</td><td>Kebijakan publik diuji kesesuaiannya dengan nilai Pancasila; pendidikan karakter</td></tr>
<tr><td><b>UUD NRI 1945</b></td><td>Konstitusi atau hukum dasar tertulis tertinggi</td><td>Menaati hukum; menggunakan hak konstitusional seperti uji materi di MK, pengaduan, dan pemilu</td></tr>
<tr><td><b>NKRI</b></td><td>Bentuk negara kesatuan berbentuk republik yang tidak dapat diubah (Pasal 37 ayat 5)</td><td>Otonomi daerah tetap dalam bingkai NKRI; tuntutan daerah disalurkan lewat dialog, bukan separatisme</td></tr>
<tr><td><b>Bhinneka Tunggal Ika</b></td><td>Semboyan pemersatu dalam keberagaman</td><td>Kebijakan inklusif; tidak ada warga kelas dua; perayaan budaya lintas daerah</td></tr></table>
<h4>Prinsip penyelenggaraan negara yang sering diuji</h4><ul class="tips">
<li><b>Negara hukum</b> (Pasal 1 ayat 3): semua orang sama di depan hukum, kekuasaan dibatasi hukum, dan sengketa diselesaikan lewat jalur hukum, bukan main hakim sendiri.</li>
<li><b>Demokrasi Pancasila</b>: kedaulatan rakyat yang mengutamakan musyawarah, menghormati suara terbanyak, tetap melindungi minoritas, serta menyeimbangkan hak dan kewajiban.</li>
<li><b>Hak dan kewajiban seimbang</b>: warga berhak atas pelayanan, pendidikan, dan kebebasan berpendapat (Pasal 27–34), sekaligus wajib menaati hukum, membayar pajak, menghormati hak orang lain, dan ikut membela negara.</li>
<li><b>Sistem presidensial</b>: Presiden adalah kepala negara dan kepala pemerintahan, dipilih langsung, dan tidak bertanggung jawab kepada DPR, tetapi diawasi melalui mekanisme <i>checks and balances</i>.</li></ul>
<h4>Integrasi nasional</h4><p>Integrasi nasional adalah proses menyatukan berbagai unsur bangsa yang beragam menjadi satu kesatuan yang utuh dan serasi.</p>
<ul class="tips"><li><b>Integrasi vertikal</b>: menyatukan pemerintah dan rakyat, misalnya lewat kebijakan yang adil, pelayanan yang merata, dan partisipasi publik.</li><li><b>Integrasi horizontal</b>: menyatukan antarkelompok masyarakat (suku, agama, daerah, golongan), misalnya lewat dialog lintas iman, pertukaran pelajar, atau kerja sama ekonomi lokal–pendatang.</li>
<li><b>Faktor pendorong</b>: sejarah perjuangan bersama, Pancasila, bahasa Indonesia, simbol negara, keadilan pembangunan, dan pendidikan.</li>
<li><b>Faktor penghambat</b>: ketimpangan ekonomi antarwilayah, primordialisme, etnosentrisme, hoaks/SARA, radikalisme, separatisme, serta korupsi yang menurunkan kepercayaan publik.</li></ul>
<div class="note"><b>Pola soal:</b> konflik lokal–pendatang, tuntutan daerah, atau penolakan fasilitas umum hampir selalu dijawab dengan <b>dialog + regulasi yang adil + program inklusif</b> yang melibatkan semua pihak. Opsi “usir”, “batasi kelompok tertentu”, atau “abaikan” termasuk pengecoh.</div>`},
{id:'nasionalisme',h:`<h4>Pengertian</h4><p>Nasionalisme adalah sikap cinta dan kesetiaan kepada bangsa dan negara yang diwujudkan dengan menjaga persatuan, kehormatan, dan kemajuan bangsa. Nasionalisme Indonesia adalah <b>nasionalisme Pancasila</b>: cinta tanah air tanpa merendahkan bangsa lain, dan bersatu tanpa menghapus keberagaman.</p>
<h4>Nasionalisme sehat vs sempit</h4><table><tr><th>Nasionalisme sehat (dituju)</th><th>Bentuk menyimpang (dihindari)</th></tr>
<tr><td>Bangga pada bangsa sambil objektif mengakui kekurangan dan optimis memperbaikinya</td><td><b>Chauvinisme</b>: menganggap bangsa sendiri paling unggul dan merendahkan bangsa lain</td></tr>
<tr><td>Menghargai budaya daerah sebagai kekayaan nasional</td><td><b>Etnosentrisme/primordialisme</b>: mengukur semua hal dari budaya suku sendiri dan mengutamakan kelompok asal</td></tr>
<tr><td>Terbuka pada pergaulan global dengan identitas yang kuat</td><td><b>Kosmopolitanisme ekstrem</b>: mengagungkan budaya asing dan merendahkan bangsa sendiri</td></tr>
<tr><td>Menyelesaikan perbedaan lewat dialog</td><td>Fanatisme dan anti-dialog, termasuk menyerang pribadi karena beda pilihan politik</td></tr></table>
<h4>Wujud nasionalisme dalam keseharian</h4><ul class="tips">
<li><b>Pribadi</b>: belajar atau bekerja sungguh-sungguh untuk berprestasi, memakai produk dalam negeri, dan menghormati simbol negara.</li>
<li><b>Sosial</b>: bergaul lintas suku dan agama, menegur candaan SARA secara sopan, dan ikut kegiatan sosial.</li>
<li><b>Digital</b>: memverifikasi informasi sebelum membagikan, tidak ikut merundung atlet atau tokoh yang gagal, serta mempromosikan budaya dan sejarah bangsa secara kreatif.</li>
<li><b>Global</b>: saat ditanya tentang Indonesia di luar negeri, jelaskan keunggulan dan tantangannya secara <b>seimbang dan optimis</b>, tanpa menutupi masalah maupun menjelekkan bangsa sendiri.</li>
<li><b>Peringatan hari besar nasional</b>: kegiatan yang bernilai edukatif dan bermanfaat sosial lebih bermakna daripada sekadar simbolik.</li></ul>
<div class="note"><b>Pola soal:</b> jawaban terbaik biasanya <b>aktif, edukatif, dan inklusif</b>, misalnya menegur dengan sopan, mengarahkan diskusi kembali ke gagasan, atau mengecek sumber resmi. Opsi yang <b>membalas, membiarkan, menghindari, atau melarang total</b> umumnya salah.</div>`},
{id:'bhinneka',h:`<h4>Makna Bhinneka Tunggal Ika</h4><p>Semboyan ini berasal dari Kakawin <b>Sutasoma</b> karya <b>Mpu Tantular</b> pada masa Majapahit dan berarti “berbeda-beda, tetapi tetap satu”. Semboyan ini tertulis pada pita yang dicengkeram Garuda Pancasila (Pasal 36A UUD 1945). Substansinya: keberagaman adalah <b>kekayaan yang dikelola</b>, bukan ancaman yang harus diseragamkan.</p>
<h4>Asas dan prinsip yang terkandung</h4><table><tr><th>Didukung (sejalan)</th><th>Bertentangan</th></tr>
<tr><td><b>Inklusif</b>: semua golongan dilibatkan dan diterima</td><td><b>Eksklusif</b>: menutup diri dan hanya mengakui kelompok sendiri</td></tr>
<tr><td><b>Toleransi</b>: menghormati keyakinan dan kebiasaan orang lain</td><td>Intoleransi, diskriminasi, dan prasangka</td></tr>
<tr><td><b>Kesetaraan</b>: tidak ada warga kelas dua</td><td>Dominasi mayoritas atau tirani minoritas</td></tr>
<tr><td><b>Konvergen</b>: perbedaan dipertemukan pada titik kesamaan</td><td>Divergen: perbedaan dipertajam hingga memecah belah</td></tr>
<tr><td>Musyawarah, gotong royong, dan saling percaya</td><td>Sektarian dan formalistis (persatuan hanya di permukaan)</td></tr></table>
<h4>Praktik kebhinekaan sehari-hari</h4><ul class="tips">
<li>Rapat lintas daerah memakai bahasa Indonesia agar semua terlibat, tetapi bahasa daerah tetap dihargai dalam ranahnya.</li>
<li>Panitia acara kantor melibatkan pegawai dari beragam latar belakang, dan menu serta waktu kegiatan memperhatikan keberagaman.</li>
<li>Menolak stereotip, misalnya “orang suku X pasti …”, dalam percakapan maupun media sosial.</li>
<li>Membantu kegiatan hari besar agama lain sebagai bentuk toleransi, tanpa ikut dalam ritual ibadahnya.</li></ul>
<h4>Wawasan Nusantara</h4><ul class="tips"><li>Cara pandang bangsa Indonesia tentang diri dan lingkungannya dengan mengutamakan persatuan dan kesatuan wilayah serta bangsa.</li><li>Berakar pada <b>Deklarasi Djuanda 1957</b> (konsep negara kepulauan) dan diakui dalam <b>UNCLOS 1982</b>, yang diratifikasi melalui UU 17/1985.</li><li>Mewujudkan nusantara sebagai satu kesatuan politik, ekonomi, sosial budaya, dan pertahanan keamanan.</li></ul>
<h4>Simbol negara (UU 24/2009)</h4><p>Bendera Sang Merah Putih, Bahasa Indonesia, lambang Garuda Pancasila, dan lagu kebangsaan Indonesia Raya.</p>`},

<div class="note">Untuk soal tanggal, hafalkan pasangan <b>tanggal – peristiwa – peringatan</b> karena pengecohnya biasanya tanggal yang berdekatan.</div>`},
{id:'integritas',h:`<h4>Substansi integritas</h4><p>Integritas berarti <b>satunya kata dan perbuatan</b>: konsisten bertindak jujur dan taat aturan, termasuk ketika tidak diawasi, ada tekanan atasan, atau ada godaan keuntungan pribadi. Bagi ASN, integritas adalah syarat kepercayaan publik.</p>
<h4>Sembilan nilai integritas (KPK) dan contoh perilakunya</h4><table><tr><th>Nilai</th><th>Contoh perilaku ASN</th></tr>
<tr><td>Jujur</td><td>Melaporkan data apa adanya, termasuk capaian yang belum memenuhi target</td></tr>
<tr><td>Peduli</td><td>Peka terhadap kesulitan pengguna layanan dan rekan kerja</td></tr>
<tr><td>Mandiri</td><td>Tidak bergantung pada “orang dalam” atau titipan</td></tr>
<tr><td>Disiplin</td><td>Hadir sesuai jam kerja dan tidak memanipulasi presensi</td></tr>
<tr><td>Tanggung jawab</td><td>Mengakui kesalahan dan memperbaikinya, bukan menyalahkan orang lain</td></tr>
<tr><td>Kerja keras</td><td>Menuntaskan tugas dengan kualitas terbaik</td></tr>
<tr><td>Sederhana</td><td>Tidak pamer kemewahan dan tidak memakai fasilitas negara untuk kepentingan pribadi</td></tr>
<tr><td>Berani</td><td>Menolak suap, melaporkan pelanggaran, dan menyampaikan kebenaran kepada atasan</td></tr>
<tr><td>Adil</td><td>Memperlakukan semua pihak setara, misalnya dalam pengadaan atau penyaluran bantuan</td></tr></table>
<p class="mut" style="font-size:13px">Contoh pemetaan soal: budaya “Asal Bapak Senang” (melaporkan hal yang bagus-bagus saja) melanggar nilai <b>berani dan jujur</b>.</p>
<h4>Nilai dasar ASN “BerAKHLAK” (UU 20/2023)</h4><p><b>B</b>erorientasi pelayanan · <b>A</b>kuntabel · <b>K</b>ompeten · <b>H</b>armonis · <b>L</b>oyal · <b>A</b>daptif · <b>K</b>olaboratif.</p>
<h4>Konsep kunci</h4><ul class="tips">
<li><b>Gratifikasi</b>: pemberian dalam arti luas (uang, barang, diskon, tiket, dan sebagainya). Gratifikasi yang berhubungan dengan jabatan dianggap suap (Pasal 12B UU Tipikor) dan wajib dilaporkan ke KPK paling lambat <b>30 hari kerja</b> (Pasal 12C).</li>
<li><b>Konflik kepentingan</b>: kepentingan pribadi, keluarga, atau kelompok berpotensi memengaruhi keputusan jabatan. Langkah yang tepat: <b>ungkapkan, laporkan, dan mundur dari proses</b> pengambilan keputusan terkait.</li>
<li><b>Whistleblowing</b>: melaporkan pelanggaran melalui saluran resmi (atasan, inspektorat, WBS, atau KPK) dengan bukti, bukan menyebarkannya di grup atau media sosial.</li>
<li><b>Loyalitas</b> berarti setia pada negara dan aturan, bukan pada perintah atasan yang melanggar hukum.</li></ul>
<div class="note"><b>Pola soal:</b> jawaban benar memuat unsur <b>jujur + taat prosedur + solusi</b>, misalnya “menyampaikan kondisi sebenarnya disertai analisis dan rekomendasi” atau “menjalankan proses sesuai aturan, mendokumentasikan tekanan, lalu melapor”. Opsi yang menerima hadiah, mengubah data, menutupi pelanggaran demi pertemanan, atau mundur tanpa penjelasan termasuk pengecoh.</div>`},
{id:'belanegara',h:`<h4>Dasar hukum</h4><ul class="tips"><li>Pasal 27 ayat (3) UUD 1945: hak dan kewajiban ikut serta dalam upaya pembelaan negara.</li><li>Pasal 30 ayat (1): hak dan kewajiban ikut serta dalam usaha pertahanan dan keamanan negara.</li><li>UU 3/2002 tentang Pertahanan Negara dan UU 23/2019 tentang Pengelolaan Sumber Daya Nasional untuk Pertahanan Negara.</li></ul>
<h4>Lima nilai dasar bela negara dan indikatornya</h4><table><tr><th>Nilai</th><th>Indikator perilaku</th></tr>
<tr><td>Cinta tanah air</td><td>Menjaga lingkungan, bangga dan memakai produk dalam negeri, serta menjaga nama baik bangsa</td></tr>
<tr><td>Sadar berbangsa dan bernegara</td><td>Taat hukum, membayar pajak, menggunakan hak pilih, dan berorganisasi secara positif</td></tr>
<tr><td>Setia pada Pancasila sebagai ideologi negara</td><td>Menolak ideologi yang bertentangan dan mengamalkan Pancasila dalam keseharian</td></tr>
<tr><td>Rela berkorban untuk bangsa dan negara</td><td>Menyumbangkan waktu, tenaga, dan pikiran untuk kepentingan umum, misalnya menjadi relawan bencana</td></tr>
<tr><td>Kemampuan awal bela negara</td><td>Menjaga kesehatan fisik dan mental, disiplin, ulet, serta terus belajar</td></tr></table>
<h4>Ancaman yang dihadapi</h4><ul class="tips"><li><b>Militer</b>: agresi, pelanggaran wilayah, pemberontakan bersenjata, dan terorisme bersenjata.</li><li><b>Nonmiliter</b>: ideologi radikal, krisis ekonomi, narkoba, hoaks dan disinformasi, serangan siber, kebocoran data pribadi, bencana, dan pandemi.</li><li><b>Hibrida</b>: gabungan keduanya, misalnya propaganda daring yang disertai aksi kekerasan.</li></ul>
<h4>Bela negara di era modern</h4><ul class="tips">
<li><b>Pelajar/mahasiswa</b>: belajar sungguh-sungguh, berprestasi, dan meluruskan informasi keliru tentang Indonesia secara santun dan berbasis fakta.</li>
<li><b>ASN/pekerja</b>: bekerja profesional, menolak korupsi, menjaga kerahasiaan data negara, dan berinovasi melayani publik.</li>
<li><b>Warga digital</b>: memverifikasi informasi, melaporkan hoaks, dan menjaga data pribadi dengan membaca kebijakan privasi serta membatasi izin aplikasi.</li>
<li><b>Masyarakat</b>: kerja bakti, menjaga lingkungan, menjadi relawan atau donatur melalui lembaga resmi saat terjadi bencana.</li>
<li><b>Menanggapi kritik asing</b>: jelaskan fakta dan upaya yang telah dilakukan sambil <b>menerima masukan yang konstruktif</b>. Membantah semua kritik bukan sikap bela negara yang dewasa.</li></ul>
<div class="note">Bela negara <b>bukan hanya angkat senjata</b>. Sebagian besar soal menguji bela negara nonfisik yang <b>aktif, rasional, objektif, dan bermanfaat</b>. Hari Bela Negara diperingati setiap 19 Desember (PDRI 1948).</div>`},
{id:'bahasa',h:`<h4>Kedudukan dan fungsi</h4><table><tr><th>Kedudukan</th><th>Dasar</th><th>Fungsi</th></tr>
<tr><td>Bahasa nasional (persatuan)</td><td>Sumpah Pemuda 1928</td><td>Lambang kebanggaan dan identitas nasional, alat pemersatu, serta alat komunikasi antardaerah dan antarbudaya</td></tr>
<tr><td>Bahasa negara (resmi)</td><td>Pasal 36 UUD 1945; UU 24/2009</td><td>Bahasa resmi kenegaraan, pengantar pendidikan, bahasa dokumen resmi, serta pengembangan ilmu pengetahuan dan teknologi</td></tr></table>
<p>Bahasa Indonesia dan bahasa daerah tidak saling meniadakan. Bahasa daerah adalah identitas budaya yang wajib dilestarikan, sedangkan bahasa Indonesia menjadi jembatan di forum bersama.</p>
<h4>Huruf kapital (EYD)</h4><table><tr><th>Kaidah</th><th>Benar</th><th>Salah</th></tr>
<tr><td>Nama geografi diikuti nama diri</td><td>Pulau Flores, Kepulauan Nusa Tenggara, Kota Semarang</td><td>pulau flores</td></tr>
<tr><td>Nama suku dan bahasa: hanya nama dirinya yang kapital</td><td>suku Sasak, bahasa Sasak, bahasa Indonesia</td><td>Suku Sasak, Bahasa indonesia</td></tr>
<tr><td>Nama resmi negara, dokumen, dan semboyan</td><td>Pancasila, Undang-Undang Dasar 1945, Negara Kesatuan Republik Indonesia, Bhinneka Tunggal Ika</td><td>pancasila, bhinneka tunggal ika</td></tr>
<tr><td>Jabatan diikuti nama orang, instansi, atau tempat</td><td>Gubernur Jawa Tengah, Bupati Bangka</td><td>gubernur Jawa Tengah</td></tr>
<tr><td>Nama hari, bulan, tahun, hari raya, dan peristiwa sejarah</td><td>Senin, Agustus, Iduladha, Proklamasi Kemerdekaan</td><td>senin, idul adha</td></tr></table>
<h4>Kalimat efektif</h4><ul class="tips"><li><b>Hemat</b>: hindari pengulangan makna, misalnya <i>para peserta-peserta</i> → <i>para peserta</i>, atau <i>agar supaya</i> → <i>agar</i>.</li><li><b>Logis</b>: <i>Waktu dan tempat kami persilakan</i> → <i>Bapak/Ibu kami persilakan</i>.</li><li><b>Padu</b>: tidak menyisipkan kata di antara predikat dan objek, misalnya <i>membicarakan tentang</i> → <i>membicarakan</i>.</li><li><b>Paralel</b>: bentuk kata dalam rincian setara, misalnya <i>pengumpulan, pengolahan, dan penyajian</i>, bukan <i>pengumpulan, mengolah, dan disajikan</i>.</li><li><b>Subjek jelas</b>: kata depan tidak boleh mengawali subjek, misalnya <i>Bagi peserta wajib hadir</i> → <i>Peserta wajib hadir</i>. Frasa pelaku sebagai subjek perlu dinominalkan, misalnya <i>ikut serta badan usaha</i> → <i>keikutsertaan badan usaha</i>.</li></ul>
<h4>Kata baku dan kata penghubung</h4><table><tr><th>Baku</th><th>Tidak baku</th><th>Baku</th><th>Tidak baku</th></tr>
<tr><td>analisis</td><td>analisa</td><td>risiko</td><td>resiko</td></tr><tr><td>praktik</td><td>praktek</td><td>nasihat</td><td>nasehat</td></tr>
<tr><td>apotek</td><td>apotik</td><td>izin</td><td>ijin</td></tr><tr><td>kualitas</td><td>kwalitas</td><td>objek</td><td>obyek</td></tr>
<tr><td>sistem</td><td>sistim</td><td>aktivitas</td><td>aktifitas</td></tr><tr><td>jadwal</td><td>jadual</td><td>kuitansi</td><td>kwitansi</td></tr></table>
<ul class="tips"><li><b>dan</b> menyatakan penambahan; <b>tetapi</b> menyatakan pertentangan di dalam satu kalimat; <b>namun</b> menyatakan pertentangan antarkalimat dan diikuti koma (<i>Namun, …</i>).</li><li>Kata depan <b>di/ke/dari</b> ditulis terpisah (<i>di kantor</i>), sedangkan awalan <b>di-</b> ditulis serangkai (<i>dikirim</i>). Gabungan kata berimbuhan awal dan akhir ditulis serangkai (<i>pertanggungjawaban</i>).</li><li><b>Gagasan utama</b> adalah inti yang dijelaskan seluruh kalimat atau paragraf. <b>Simpulan</b> tidak boleh menambahkan informasi yang tidak ada di teks.</li></ul>`}

TIU:[
{id:'umum',t:'Kisi-kisi 10 tipe soal & rumus cepat TIU',h:`<p>TIU terdiri dari 35 soal (benar = 5, salah/kosong = 0, maksimal 175, <i>passing grade</i> 80). Berdasarkan acuan KepmenPANRB 321/2024, TIU terbagi dalam tiga kelompok dengan <b>10 tipe soal</b>:</p>
<table><tr><th>Kelompok</th><th>Tipe soal</th><th>Kunci berpikir</th></tr>
<tr><td>Verbal</td><td>Analogi, silogisme, analitis</td><td>Kalimat jembatan; hanya percaya premis; ubah narasi menjadi diagram atau tabel</td></tr>
<tr><td>Numerik</td><td>Berhitung, deret angka, perbandingan kuantitatif, soal cerita</td><td>Cari jalan pendek; urutan cek pola; tentukan hubungan sebelum rumus</td></tr>
<tr><td>Figural</td><td>Analogi, ketidaksamaan, serial</td><td>Pisahkan unsur: arah → jumlah → posisi → arsiran → bentuk</td></tr></table>
<h4>Rumus cepat numerik</h4><table><tr><th>Trik</th><th>Contoh</th></tr>
<tr><td>Persen → pecahan</td><td>12,5% × 640 = 640 ÷ 8 = 80. 15% = 10% + 5%: 15% × 360 = 36 + 18 = 54.</td></tr>
<tr><td>Sederhanakan dulu</td><td>36/48 = 3/4, sehingga P = 36/48 dan Q = 3/4 berarti P = Q.</td></tr>
<tr><td>Cek angka satuan</td><td>243 × 127 → 3 × 7 = 21, jadi hasil berakhiran 1. Coret opsi lain.</td></tr>
<tr><td>Taksiran</td><td>49,8 × 19,9 ≈ 50 × 20 = 1.000. Hanya dipakai bila opsi berjauhan, bukan 495/498/501.</td></tr>
<tr><td>Senilai atau berbalik nilai?</td><td>6 orang × 12 hari = 9 orang × a, sehingga a = 8 hari (pekerja naik, waktu turun).</td></tr>
<tr><td>Segitiga s–v–t</td><td>s = v × t; v = s ÷ t; t = s ÷ v. Berpapasan: t = jarak ÷ (v₁ + v₂).</td></tr>
<tr><td>Rata-rata lewat total</td><td>8 siswa rata-rata 75 → total 600. Ditambah nilai 84 → 684 ÷ 9 = 76.</td></tr>
<tr><td>Umur: selisih tetap</td><td>Selisih umur dua orang tidak pernah berubah. Gunakan itu sebagai jangkar persamaan.</td></tr>
<tr><td>Perbandingan kuantitatif</td><td>P = 25% × 480 = 120; Q = 30% × 400 = 120 → P = Q. Kadang cukup membandingkan selisih, misalnya 49 × 21 vs 50 × 20.</td></tr></table>
<h4>Urutan mengecek pola deret</h4><ol><li><b>Selisih</b> (+4, +6, +8 … → selisih bertingkat)</li><li><b>Kali/bagi</b> (×2, ×3)</li><li><b>Kuadrat/kubik</b> (4, 9, 16, 25 → 2², 3², …)</li><li><b>Dua jalur</b>: pisahkan posisi ganjil dan genap (2, 5, 4, 6, 6, 7, 8, 8 → ganjil +2, genap +1)</li><li><b>Operasi bergantian</b>: 3, 6, 8, 16, 18, 36 → ×2, +2, ×2, +2 …</li></ol>
<h4>Angka yang sebaiknya dihafal</h4><table><tr><td>1/3 ≈ 33,3%</td><td>1/6 ≈ 16,7%</td><td>1/8 = 12,5%</td><td>3/8 = 37,5%</td><td>5/8 = 62,5%</td></tr>
<tr><td>11² = 121</td><td>12² = 144</td><td>13² = 169</td><td>14² = 196</td><td>15² = 225</td></tr><tr><td>16² = 256</td><td>17² = 289</td><td>18² = 324</td><td>19² = 361</td><td>20² = 400</td></tr></table>
<h4>Prioritas penguasaan</h4><table><tr><th>Prioritas</th><th>Materi</th></tr><tr><td>Sangat penting</td><td>Persen–pecahan, perbandingan, jarak–kecepatan–waktu</td></tr><tr><td>Penting</td><td>Rata-rata, umur, pola deret</td></tr><tr><td>Sangat berguna</td><td>Eliminasi angka satuan, taksiran</td></tr><tr><td>Berbasis pola</td><td>Silogisme, analogi, figural</td></tr></table>
<h4>Strategi waktu</h4><ul class="tips"><li>Semua soal TIU bernilai sama (5). Jangan terpaku pada satu soal. Kerjakan dalam tiga putaran: <b>soal cepat → soal sedang → soal sulit</b>.</li><li>Eliminasi sering lebih cepat daripada menghitung tuntas: buang opsi negatif, ganjil/genap yang tidak mungkin, atau yang jauh dari taksiran.</li></ul>
<h4>Diagnosis belajar</h4><table><tr><th>Kondisi</th><th>Tindakan</th></tr><tr><td>Belum paham konsep (misalnya silogisme sering salah)</td><td>Kembali ke materi konsep</td></tr><tr><td>Sudah paham tetapi lambat (deret, analogi, figural)</td><td>Perbanyak latihan berulang (<i>drill</i>)</td></tr><tr><td>Cepat tetapi sering salah</td><td>Latih ketelitian dan cek ulang</td></tr></table>
<p><b>Contoh jadwal 7 hari:</b> (1) analogi dan silogisme · (2) analitis · (3) berhitung dan perbandingan kuantitatif · (4) deret · (5) soal cerita · (6) figural · (7) campuran dan evaluasi. Minggu berikutnya, tambah porsi topik yang penguasaannya masih rendah di halaman <b>Progres Saya</b>.</p>`},
{id:'verbal',h:`<h4>Sinonim dan antonim</h4><ul class="tips"><li>Baca semua pilihan terlebih dahulu. Pengecoh biasanya kata yang berhubungan, tetapi tidak semakna.</li><li>Untuk antonim, cari lawan yang paling tepat (<i>nisbi</i> ⟷ <i>mutlak</i>, bukan <i>nyata</i>).</li></ul>
<table><tr><th>Kata</th><th>Sinonim</th><th>Antonim</th></tr>
<tr><td>Absurd</td><td>Mustahil, tidak masuk akal</td><td>Logis</td></tr><tr><td>Apriori</td><td>Berprasangka</td><td>Aposteriori</td></tr>
<tr><td>Eksplisit</td><td>Tersurat, gamblang</td><td>Implisit</td></tr><tr><td>Fiktif</td><td>Rekaan</td><td>Faktual</td></tr>
<tr><td>Konkret</td><td>Nyata</td><td>Abstrak</td></tr><tr><td>Mayor</td><td>Besar, utama</td><td>Minor</td></tr>
<tr><td>Prolog</td><td>Pendahuluan</td><td>Epilog</td></tr><tr><td>Sporadis</td><td>Sesekali</td><td>Kontinu</td></tr>
<tr><td>Statis</td><td>Tetap</td><td>Dinamis</td></tr><tr><td>Vertikal</td><td>Tegak lurus</td><td>Horizontal</td></tr></table>
<h4>Analogi</h4><p>Ubah hubungan kata menjadi <b>kalimat jembatan</b>, lalu uji kalimat itu pada setiap pilihan. Contoh: “Dokter <i>menggunakan</i> stetoskop” → “Tukang kayu <i>menggunakan</i> gergaji”.</p>
<p>Jenis hubungan yang umum: pelaku–alat, bahan–hasil, sebab–akibat, bagian–keseluruhan, tempat–fungsi, dan sinonim/antonim. Perhatikan juga <b>urutan</b>: <i>Padi : Beras</i> tidak sama dengan <i>Beras : Padi</i>.</p>`},
{id:'logika',h:`<h4>Pola penarikan kesimpulan</h4><table><tr><th>Pola</th><th>Premis</th><th>Kesimpulan</th></tr>
<tr><td>Modus ponens</td><td>p → q; p</td><td>q</td></tr><tr><td>Modus tollens</td><td>p → q; ~q</td><td>~p</td></tr>
<tr><td>Silogisme</td><td>p → q; q → r</td><td>p → r</td></tr>
<tr><td>Kategorik</td><td>Semua A adalah B; x adalah A</td><td>x adalah B</td></tr>
<tr><td>Kategorik</td><td>Semua A adalah B; sebagian C adalah A</td><td>Sebagian C adalah B</td></tr></table>
<h4>Ingkaran (negasi)</h4><table><tr><th>Pernyataan</th><th>Ingkaran</th></tr>
<tr><td>Semua A adalah B</td><td>Ada (beberapa) A yang bukan B</td></tr><tr><td>Ada A yang B</td><td>Semua A tidak B</td></tr>
<tr><td>p dan q</td><td>~p atau ~q</td></tr><tr><td>p atau q</td><td>~p dan ~q</td></tr><tr><td>Jika p maka q</td><td>p dan ~q</td></tr></table>
<div class="note">Kesetaraan: <b>p → q ≡ ~q → ~p ≡ ~p ∨ q</b>. Jebakan umum adalah menyimpulkan “jika ~p maka ~q” (inversi) atau “jika q maka p” (konversi). Keduanya <b>tidak sah</b>.</div>`},
{id:'analitis',h:`<h4>Strategi</h4><ul class="tips"><li>Ubah informasi menjadi <b>diagram</b>: garis urutan (tinggi/umur/finis), kotak posisi duduk, atau tabel benar–salah.</li><li>Mulailah dari informasi yang <b>pasti</b> (misalnya “B di ujung kiri”), lalu masukkan syarat yang membatasi.</li><li>Soal hari: tentukan dulu “hari ini”, lalu hitung maju atau mundur. Siklus 7 hari, jadi gunakan sisa bagi 7.</li><li>Jika dua kemungkinan masih terbuka, uji setiap pilihan jawaban terhadap semua syarat.</li></ul>
<div class="note">Contoh: “Lusa hari Sabtu” → hari ini Kamis. “100 hari lagi dari Senin” → 100 mod 7 = 2 → Rabu.</div>`},
{id:'numerik',h:`<h4>Pola deret</h4><ul class="tips"><li><b>Aritmetika</b>: selisih tetap (+5, +5, …).</li><li><b>Bertingkat</b>: selisihnya membentuk deret (+2, +4, +6, …).</li><li><b>Geometri</b>: rasio tetap (×2, ×3).</li><li><b>Selang-seling</b>: suku ganjil dan genap punya pola berbeda. Curigai pola ini jika deret naik-turun.</li><li><b>Campuran</b>: ×2 + 1, kuadrat (1, 4, 9, 16), atau Fibonacci (jumlah dua suku sebelumnya).</li></ul>
<h4>Rumus cepat</h4><table><tr><th>Topik</th><th>Rumus / trik</th></tr>
<tr><td>Kerja bersama</td><td>t = (a × b) / (a + b)</td></tr><tr><td>Kecepatan</td><td>v = s / t; berpapasan: t = jarak / (v₁ + v₂)</td></tr>
<tr><td>Diskon bertingkat</td><td>Harga × (1 − d₁) × (1 − d₂), bukan d₁ + d₂</td></tr><tr><td>Rata-rata gabungan</td><td>(n₁x̄₁ + n₂x̄₂) / (n₁ + n₂)</td></tr>
<tr><td>Bunga tunggal</td><td>M × r × (bulan/12)</td></tr><tr><td>Perbandingan</td><td>Bagian A = a/(a+b) × total</td></tr></table>
<h4>Pecahan ⟷ persen</h4><table><tr><td>1/2 = 50%</td><td>1/4 = 25%</td><td>1/5 = 20%</td><td>1/8 = 12,5%</td></tr><tr><td>1/3 ≈ 33,3%</td><td>1/6 ≈ 16,7%</td><td>3/8 = 37,5%</td><td>1/20 = 5%</td></tr></table>
<div class="note">Pada soal hitungan, perkirakan dulu besar jawabannya untuk mencoret pilihan yang jauh, lalu hitung pilihan yang tersisa.</div>`},
{id:'figural',h:`<p>Soal figural menguji kemampuan melihat <b>pola visual</b>. Kuncinya adalah memecah gambar menjadi <b>unsur</b> (bentuk, posisi, arah, jumlah, dan warna/arsiran), lalu mencari aturan perubahan <b>setiap unsur secara terpisah</b>.</p>
<h4>Tiga jenis soal figural</h4><table><tr><th>Jenis</th><th>Bentuk soal</th><th>Strategi</th></tr>
<tr><td><b>Serial gambar</b></td><td>Deret 4–5 gambar, lalu tentukan gambar berikutnya</td><td>Bandingkan gambar 1→2, 2→3, dan 3→4. Catat unsur yang berubah dan besar perubahannya.</td></tr>
<tr><td><b>Analogi gambar</b></td><td>A → B, maka C → ?</td><td>Rumuskan aturan A→B dalam satu kalimat (“dicerminkan kiri–kanan”), lalu terapkan pada C.</td></tr>
<tr><td><b>Ketidaksamaan</b></td><td>Pilih satu gambar yang berbeda</td><td>Cari aturan yang berlaku pada empat gambar. Jebakan klasik: empat gambar hasil rotasi dan satu gambar hasil pencerminan.</td></tr></table>
<h4>1. Rotasi (perputaran)</h4><p>Perhatikan <b>arah</b> (searah atau berlawanan jarum jam) dan <b>besar sudut</b> per langkah (45°, 90°, 135°, 180°). Contoh: panah berputar 90° searah jarum jam setiap langkah.</p>${figRow([0,90,180,270].map(a=>arrowSVG(a,48)),false)}
<p class="mut" style="font-size:13px">Tip: beri patokan “jam”. Panah ke atas = jam 12, ke kanan = jam 3. Jika langkahnya 135°, panah melompat sekitar 4½ jam. Rotasi 360° kembali ke posisi awal, jadi gunakan sisa bagi 360.</p>
<h4>2. Pencerminan (refleksi)</h4><p>Pencerminan terhadap sumbu vertikal menukar <b>kiri ⟷ kanan</b>; terhadap sumbu horizontal menukar <b>atas ⟷ bawah</b>. Bedanya dengan rotasi: gambar cermin tidak bisa diperoleh hanya dengan memutar.</p>
<div class="figrow">${glyphSVG('F','id',48)}<span class="mut">asli</span>${glyphSVG('F','h',48)}<span class="mut">cermin kiri–kanan</span>${glyphSVG('F','v',48)}<span class="mut">cermin atas–bawah</span>${glyphSVG('F','r180',48)}<span class="mut">rotasi 180°</span></div>
<p class="mut" style="font-size:13px">Tip membedakan rotasi dan cermin: pilih dua ciri (misalnya “kaki panjang” dan “cabang atas”), lalu telusuri urutannya searah jarum jam. Pada rotasi urutannya tetap; pada cermin urutannya terbalik. Ingat juga: cermin kiri–kanan lalu cermin atas–bawah = rotasi 180°.</p>
<h4>3. Perpindahan posisi</h4><p>Arsiran, titik, atau objek kecil berpindah 1 atau 2 petak, biasanya mengelilingi kotak. Jika ada <b>dua objek</b>, keduanya bisa bergerak dengan arah atau kecepatan berbeda, jadi lacak masing-masing.</p>${figRow([0,1,2,3].map(i=>quadSVG(i%4,(3-i+4)%4,48)),false)}
<p class="mut" style="font-size:13px">Contoh di atas: kotak arsir bergerak searah jarum jam, sedangkan lingkaran kuning bergerak berlawanan arah.</p>
<h4>4. Jumlah unsur</h4><p>Jumlah sisi, titik, garis, atau lengkungan bertambah atau berkurang mengikuti deret (+1, +2, ×2, atau selang-seling). Hitung dengan teliti dan perlakukan seperti deret angka.</p>${figRow([3,4,5,6].map((n,i)=>polySVG(n,i%2===0,48)),false)}
<p class="mut" style="font-size:13px">Contoh: sisi bertambah 1 (segitiga → segi-6), sedangkan arsiran berselang-seling hitam/putih. Gambar berikutnya: segi-7 hitam.</p>
<h4>5. Siklus dan selang-seling</h4><p>Bentuk atau warna berulang dengan periode tertentu. Jika periode bentuk 3 dan warna 2, kombinasi keduanya berulang setiap 6 gambar. Tentukan posisi gambar yang ditanya dengan sisa bagi.</p>${figRow([0,1,2,3,4].map(i=>shapeSVG(i%3,i%2===0,48)),false)}
<h4>6. Perubahan warna, ukuran, dan penambahan/pengurangan bagian</h4><ul class="tips"><li>Warna dapat bergantian (hitam → putih), berpindah ke bagian lain, atau dibalik (<i>inverse</i>).</li><li>Ukuran dapat membesar atau mengecil secara bertahap.</li><li>Pada analogi, bagian yang <b>sama</b> di A dan B bisa hilang, sedangkan bagian yang <b>berbeda</b> tetap. Perhatikan operasi “tumpuk” (<i>overlay</i>) gambar.</li></ul>
<h4>Checklist cepat (maks. 60 detik per soal)</h4><ol><li>Cek <b>jumlah</b> unsur: apakah bertambah atau berkurang?</li><li>Cek <b>arah</b>: apakah berotasi? Berapa derajat dan ke arah mana?</li><li>Cek <b>posisi</b>: apakah ada objek yang berpindah petak?</li><li>Cek <b>warna/arsiran</b>: bergantian, berpindah, atau dibalik?</li><li>Cek <b>cermin</b>: apakah ada bagian yang terbalik?</li><li>Gunakan pilihan jawaban untuk <b>eliminasi</b>: coret pilihan yang salah pada satu unsur yang paling mudah dicek dulu (misalnya jumlah), lalu bandingkan unsur berikutnya.</li></ol>
<div class="note">Di latihan dan simulasi tersedia tujuh tipe soal figural acak (rotasi, perpindahan dua objek, jumlah sisi + arsiran, jumlah titik + garis, siklus bentuk–warna, analogi cermin/rotasi, dan ketidaksamaan), sehingga soal selalu berganti setiap kali dikerjakan.</div>`}
],
TKP:[
{id:'umum',t:'Cara penilaian, kisi-kisi & rumus cepat TKP',h:`<p>TKP terdiri dari 45 soal. Setiap pilihan bernilai <b>1–5</b> dan soal yang tidak dijawab bernilai <b>0</b>, jadi <b>jangan biarkan kosong</b>. Nilai maksimal 225, dan <i>passing grade</i> formasi umum 166 (rata-rata sekitar 3,7 per soal). Dasar enam aspek TKP mengacu pada KepmenPANRB Nomor 321 Tahun 2024.</p>
<h4>Mengenali kompetensi yang diuji dari kata kunci soal</h4><table><tr><th>Aspek</th><th>Kata kunci dalam soal</th><th>Rumus pikir cepat</th></tr>
<tr><td>Pelayanan publik</td><td>warga, masyarakat, pengguna layanan, antrean, keluhan, informasi layanan</td><td>Dengarkan → jelaskan → bantu selesaikan</td></tr>
<tr><td>Jejaring kerja</td><td>rekan, tim, koordinasi, lintas unit, berbagi informasi</td><td>Komunikasi → kolaborasi → tetap bertanggung jawab</td></tr>
<tr><td>Sosial budaya</td><td>suku, agama, budaya, kebiasaan, daerah penempatan</td><td>Hargai → adaptasi → tetap profesional</td></tr>
<tr><td>TIK</td><td>aplikasi, sistem, data, email/tautan, digital</td><td>Manfaatkan → verifikasi → jaga keamanan</td></tr>
<tr><td>Profesionalisme</td><td>deadline, prioritas, kesalahan kerja, instruksi atasan, pelanggaran</td><td>Prioritaskan → selesaikan → bertanggung jawab</td></tr>
<tr><td>Anti radikalisme</td><td>intoleransi, ujaran kebencian, kekerasan, propaganda</td><td>Tolak → cegah → gunakan mekanisme yang tepat</td></tr></table>
<p class="mut" style="font-size:13px">Satu soal bisa menyentuh dua aspek, misalnya rekan dari daerah lain diejek tim (sosial budaya dan jejaring kerja). Fokuskan perhatian pada <b>masalah utama</b> dan respons yang paling tepat, bukan pada label aspeknya.</p>
<h4>Langkah 1 — Pecah soal: Masalah → Peran → Tindakan → Dampak</h4><ol><li><b>Masalahnya apa?</b> (misalnya layanan tertunda dan warga butuh kepastian)</li><li><b>Posisiku sebagai siapa, dan apa kewenanganku?</b></li><li><b>Tindakan apa yang bisa kulakukan?</b></li><li><b>Dampak apa yang diharapkan?</b></li></ol>
<h4>Langkah 2 — Metode 5 detik: coret opsi lemah</h4><table><tr><th>Ciri opsi lemah</th><th>Contoh kalimat</th></tr>
<tr><td>Pasif</td><td>“diam saja”, “menunggu”, “tidak ikut campur”</td></tr><tr><td>Melempar tanggung jawab</td><td>“meminta orang lain menangani semuanya”</td></tr>
<tr><td>Emosional</td><td>“menegur keras”, “membalas”, “mempermalukan”</td></tr><tr><td>Melanggar prosedur</td><td>“melewati aturan agar cepat selesai”</td></tr>
<tr><td>Terlalu ekstrem</td><td>eskalasi besar untuk masalah yang masih bisa diselesaikan biasa</td></tr></table>
<h4>Langkah 3 — Tersisa dua opsi bagus? Bandingkan dengan 5P</h4><table><tr><th>P</th><th>Pertanyaan uji</th></tr>
<tr><td><b>Penyelesaian</b></td><td>Apakah benar-benar menyelesaikan masalah, bukan sekadar menunda?</td></tr>
<tr><td><b>Peran</b></td><td>Apakah sesuai posisi dan kewenangan?</td></tr>
<tr><td><b>Profesional</b></td><td>Apakah tetap menjaga tanggung jawab dan aturan?</td></tr>
<tr><td><b>Proporsional</b></td><td>Apakah tingkat tindakan sesuai tingkat masalah?</td></tr>
<tr><td><b>Pengaruh</b></td><td>Apakah dampaknya baik bagi masyarakat, tim, dan organisasi?</td></tr></table>
<p class="mut" style="font-size:13px">5P adalah kerangka latihan, bukan kunci resmi BKN. Pilih tindakan yang <b>paling lengkap</b>, bukan yang paling manis bunyinya atau paling panjang kalimatnya.</p>
<h4>Sepuluh prinsip pembeda skor 5 dan skor 4</h4><table><tr><th>Prinsip</th><th>Penjelasan</th></tr>
<tr><td>Empati + tindakan > empati saja</td><td>“Meminta maaf dan meminta bersabar” kalah dari “mendengarkan, menjelaskan kendala, lalu membantu mencari alternatif”.</td></tr>
<tr><td>Aktif + sesuai kewenangan</td><td>Inisiatif lebih kuat daripada pasif, tetapi bukan dengan segala cara atau di luar wewenang.</td></tr>
<tr><td>Selesaikan → koordinasikan → eskalasi</td><td>“Lapor atasan” tidak selalu terbaik. Eskalasi tepat untuk pelanggaran serius, risiko hukum, konflik kepentingan, atau masalah di luar kewenangan.</td></tr>
<tr><td>Kecil → proporsional; serius → mekanisme resmi</td><td>Rekan lupa mengirim data cukup diingatkan. Manipulasi dokumen resmi wajib lewat jalur pelaporan, karena nasihat pribadi terlalu lemah.</td></tr>
<tr><td>Kolaboratif ≠ mengambil alih</td><td>Bantu bagian yang memungkinkan sambil menjaga tugas dan <i>deadline</i> sendiri.</td></tr>
<tr><td>Cepat + benar > cepat tetapi melanggar</td><td>Melewati verifikasi wajib demi antrean adalah jebakan.</td></tr>
<tr><td>Konflik: turunkan suhu dulu</td><td>Komunikasi langsung → cari akar masalah → solusi → eskalasi bila tidak selesai.</td></tr>
<tr><td>TIK: efisien saja tidak cukup</td><td>Tautan “URGENT” dari sumber tak dikenal diverifikasi dulu, bukan langsung dibuka.</td></tr>
<tr><td>Sosial budaya: adaptif, bukan ikut semua</td><td>Hargai kebiasaan setempat, sesuaikan cara komunikasi, tetapi tetap pada tugas dan aturan.</td></tr>
<tr><td>Profesional ≠ heroik</td><td>“Mengerjakan sendiri sampai larut malam” kalah dari mengatur prioritas, membagi tugas, dan menginformasikan risiko.</td></tr></table>
<h4>Catat pola kesalahanmu</h4><ul class="tips"><li><b>Terlalu pasif</b>: sering memilih “menunggu”.</li><li><b>Terlalu cepat eskalasi</b>: masalah kecil langsung dibawa ke atasan.</li><li><b>Terlalu individualis</b>: semua dikerjakan sendiri.</li><li><b>Terlalu membantu</b>: meninggalkan tanggung jawab sendiri.</li><li><b>Kurang solutif</b>: memilih yang sopan tetapi tidak menyelesaikan masalah.</li></ul>
<div class="note">Latih TKP <b>per aspek</b> dulu (misalnya hari ini pelayanan publik, besok profesionalisme), lalu uji dengan simulasi campuran. Di latihan, setiap jawaban menampilkan poin seluruh pilihan sehingga kamu bisa membandingkan alasannya.</div>`},
{id:'pelayanan',h:`<p>Menilai kemampuan memberikan layanan yang cepat, ramah, adil, dan tuntas.</p><ul class="tips"><li>Melayani hingga tuntas, bahkan di luar keadaan normal, selama tidak melanggar aturan.</li><li>Tidak membeda-bedakan pengguna layanan (antrean, kerabat pejabat, dan sebagainya).</li><li>Menghadapi keluhan dengan empati: dengarkan, minta maaf, jelaskan, beri solusi.</li><li>Mengakui dan memperbaiki kesalahan layanan secepatnya.</li></ul>`},
{id:'jejaring',h:`<p>Menilai kemampuan membangun dan memelihara hubungan kerja serta berkoordinasi lintas pihak.</p><ul class="tips"><li>Berinisiatif berkenalan dan membuka komunikasi.</li><li>Menerima keputusan bersama dan tetap mendukung pelaksanaannya.</li><li>Menjadi penengah dalam konflik dengan berfokus pada tujuan tim.</li><li>Memanfaatkan jaringan untuk menyelesaikan tugas melalui jalur resmi dan komunikasi langsung.</li></ul>`},
{id:'sosbud',h:`<p>Menilai kemampuan beradaptasi dan bekerja dalam masyarakat yang majemuk.</p><ul class="tips"><li>Mempelajari dan menghormati adat setempat.</li><li>Inklusif terhadap perbedaan suku, agama, gender, dan disabilitas.</li><li>Aktif mencegah diskriminasi dan ujaran SARA dengan cara yang santun.</li><li>Toleransi berarti membantu dan menghormati, tetapi <b>tidak</b> ikut dalam ritual ibadah agama lain.</li></ul>`},
{id:'tik',h:`<p>Menilai sikap terhadap pemanfaatan teknologi dalam pekerjaan.</p><ul class="tips"><li>Cepat mempelajari dan menggunakan sistem baru.</li><li>Mengusulkan digitalisasi atau otomatisasi untuk efisiensi.</li><li>Menjaga keamanan informasi: tidak membagikan kata sandi atau akun, waspada <i>phishing</i>, dan melindungi data pribadi.</li><li>Memverifikasi informasi sebelum membagikannya (anti-hoaks).</li></ul>`},
{id:'profesional',h:`<p>Menilai tanggung jawab, kualitas kerja, dan pengembangan diri.</p><ul class="tips"><li>Menyusun prioritas dan mengomunikasikannya.</li><li>Menerima kritik sebagai bahan perbaikan.</li><li>Mengakui kesalahan dan memperbaikinya secara transparan.</li><li>Antusias mengikuti pelatihan dan menerima tugas baru.</li><li>Bekerja tuntas dengan standar kualitas yang tinggi.</li></ul>`},
{id:'radikal',h:`<p>Menilai kesetiaan pada Pancasila, UUD 1945, NKRI, dan pemerintahan yang sah serta sikap terhadap paham kekerasan.</p><ul class="tips"><li>Menolak ajakan atau paham yang bertentangan dengan Pancasila.</li><li>Melaporkan melalui <b>jalur resmi</b> (RT/RW, aparat, kanal aduan), bukan main hakim sendiri.</li><li>Tidak menyebarkan konten radikal; laporkan dan imbangi dengan narasi moderat.</li><li>Melakukan pendekatan dialog kepada orang terdekat yang mulai terpapar.</li></ul>`}
]};

function inst(q){if(q.fx)return {s:q.s,t:q.t,q:q.q,o:q.o.slice(),a:q.a,p:q.p||'',lv:q.lv||1};const idx=shuffle([0,1,2,3,4]);const r={s:q.s,t:q.t,q:q.q,o:idx.map(i=>q.o[i]),p:q.p||'',lv:q.lv||1};if(q.s==='TKP'){r.w=idx.map(i=>5-i);r.p=(q.p?q.p+'<br>':'')+(TKP_TIP[q.t]||'')}else r.a=idx.indexOf(0);return r}
function pts(q,a){if(a==null)return 0;return q.s==='TKP'?q.w[a]:(a===q.a?5:0)}
const LVL={hots:'HOTS — sangat sulit',campur:'Campuran',std:'Standar'};
function pickLv(arr,n,lv){
 if(lv==='hots'){const by=k=>shuffle(arr.filter(q=>(q.lv||1)===k));return [...by(3),...by(2),...by(1)].slice(0,n)}
 if(lv==='std'){const a=shuffle(arr.filter(q=>(q.lv||1)<3));return [...a,...shuffle(arr.filter(q=>(q.lv||1)>=3))].slice(0,n)}
 return shuffle(arr).slice(0,n);
}
const genByLv=(lv,hard,norm)=>lv==='hots'?hard():lv==='std'?norm():(Math.random()<.5?hard():norm());
const figLv=lv=>genByLv(lv,genFigH,genFig);
const numLv=lv=>genByLv(lv,genNumH,genNum);
function composeTIU(n,lv='campur'){
 const f=n/35,nv=Math.round(9*f),nl=Math.round(8*f),nh=Math.round(4*f),nd=Math.round(4*f),nf=Math.round(8*f);
 const verbal=pickLv(TIU_H.filter(x=>x.t==='verbal'),nv,lv);
 const nalar=pickLv(TIU_H.filter(x=>x.t==='logika'||x.t==='analitis'),nl,lv);
 const num=[...pickLv(TIU_H.filter(x=>x.t==='numerik'),nh,lv),...Array.from({length:nd},()=>genByLv(lv,genDeretH,genDeret))];
 const cf=pickLv(TIU_H.filter(x=>x.t==='figural'),Math.floor(nf/2),lv);
 const fig=[...cf,...Array.from({length:nf-cf.length},()=>figLv(lv))];
 while(verbal.length+nalar.length+num.length+fig.length<n)num.push(genByLv(lv,genHitungH,()=>Math.random()<.5?genHitung():genHitung2()));
 return [...verbal,...nalar,...shuffle(num),...fig].slice(0,n);
}
function practicePool(s,topic,n,lv='hots'){
 if(s==='TIU'){
  if(topic==='all')return composeTIU(n,lv);
  if(topic==='figural'){const cf=pickLv(TIU_H.filter(x=>x.t==='figural'),Math.floor(n/2),lv);return shuffle([...cf,...Array.from({length:n-cf.length},()=>figLv(lv))])}
  if(topic==='numerik'){const out=pickLv(TIU_H.filter(x=>x.t==='numerik'),Math.ceil(n/3),lv);while(out.length<n)out.push(numLv(lv));return shuffle(out)}
  return pickLv(TIU_H.filter(x=>x.t===topic),n,lv);
 }
 const bank=s==='TWK'?TWK:TKP;return pickLv(topic==='all'?bank:bank.filter(x=>x.t===topic),n,lv);
}

/* Agregasi rekap peserta — fungsi yang sama dipakai di Code.gs */
function buildOverview(users,acts,sims){
 const map={};
 users.filter(u=>u.role==='peserta').forEach(u=>map[u.username]={username:u.username,nama:u.nama,instansi:u.instansi,aktif:u.aktif,dibuat:u.dibuat,login:u.login,materiSet:{},latSet:{},soal:0,skorLat:0,maksLat:0,sim:0,simFull:0,best:null,last:null,lulus:0,lastActive:u.login||0});
 acts.forEach(a=>{const p=map[a.username];if(!p)return;if(a.jenis==='materi')p.materiSet[a.subtes+'|'+a.topik]=1;else if(a.jenis==='latihan'){p.latSet[a.ket||a.waktu]=1;p.soal+=+a.n||0;p.skorLat+=+a.skor||0;p.maksLat+=+a.maks||0}p.lastActive=Math.max(p.lastActive||0,a.waktu||0)});
 sims.forEach(s=>{const p=map[s.username];if(!p)return;p.sim++;if(s.lulus)p.lulus++;if(s.mode==='full'){p.simFull++;if(p.best==null||s.total>p.best)p.best=s.total}if(!p.last||s.waktu>p.last.waktu)p.last={waktu:s.waktu,total:s.total,mode:s.mode,lulus:s.lulus,twk:s.twk,tiu:s.tiu,tkp:s.tkp};p.lastActive=Math.max(p.lastActive||0,s.waktu||0)});
 const list=Object.keys(map).map(k=>{const p=map[k];return {username:p.username,nama:p.nama,instansi:p.instansi,aktif:p.aktif,dibuat:p.dibuat,login:p.login,materi:Object.keys(p.materiSet).length,latihan:Object.keys(p.latSet).length,soal:p.soal,akurasi:p.maksLat?Math.round(p.skorLat/p.maksLat*100):null,sim:p.sim,best:p.best,last:p.last,lulus:p.lulus,lastActive:p.lastActive}});
 const now=Date.now(),own=s=>!!map[s.username];
 return {stats:{peserta:list.length,aktif7:list.filter(p=>p.lastActive&&now-p.lastActive<7*864e5).length,simulasi:sims.filter(own).length,lulus:sims.filter(s=>own(s)&&s.lulus).length,latihan:list.reduce((a,p)=>a+p.latihan,0)},peserta:list};
}

 const full=sims.filter(s=>s.mode==='full');const best=full.length?Math.max(...full.map(s=>s.total)):null;const lul=sims.filter(s=>s.lulus).length;
 const sorted=sims.slice().sort((a,b)=>b.waktu-a.waktu);
 const recent=[...acts.map(a=>({w:a.waktu,txt:a.jenis==='materi'?`Membaca materi <b>${TOPICS[a.subtes]?.[a.topik]||a.topik}</b> (${a.subtes})`:`Latihan <b>${TOPICS[a.subtes]?.[a.topik]||a.topik}</b> (${a.subtes}): ${a.skor}/${a.maks} poin, ${a.n} soal`})),...sims.map(s=>({w:s.waktu,txt:`Simulasi ${s.mode==='full'?'lengkap':'mini'}: total <b>${s.total}</b> · <span class="${s.lulus?'ok-t':'bad-t'}">${s.lulus?'Lolos PG':'Belum lolos PG'}</span>`}))].sort((a,b)=>b.w-a.w).slice(0,12);
 return `<div class="tiles">
  <div class="tile"><small>Materi dibaca</small><b>${read}</b> / ${totalTopik}<div class="bar"><i style="width:${read/totalTopik*100}%;background:var(--blue)"></i></div></div>
  <div class="tile"><small>Sesi latihan</small><b>${latSet.size}</b><small>${fmt(soal)} soal dikerjakan</small></div>
  <div class="tile"><small>Simulasi selesai</small><b>${sims.length}</b><small>${full.length} lengkap · ${sims.length-full.length} mini</small></div>
  <div class="tile"><small>Skor terbaik (lengkap)</small><b>${best??'–'}</b><small>dari 550</small></div>
  <div class="tile"><small>Lolos passing grade</small><b>${lul}</b><small>dari ${sims.length} simulasi</small></div>
 </div>
 <div class="sec card"><h3>Perkembangan nilai simulasi</h3>${simChart(sims)}</div>
 <div class="sec"><h3>Penguasaan per topik</h3><p class="mut" style="font-size:13px;margin-top:-4px">Gabungan hasil latihan dan simulasi. Target aman: TWK dan TIU ≥ 60%, TKP ≥ 78% (setara rata-rata 3,9 poin per soal).</p>
 <div class="grid3">${['TWK','TIU','TKP'].map(S=>`<div class="card sub-card ${S}"><h4 style="margin-bottom:10px"><span class="pill p-${S}">${S}</span> ${SNAME[S]}</h4>
 ${Object.entries(TOPICS[S]).map(([t,lbl])=>{const x=m[S+'|'+t]||{got:0,max:0,read:false};const p=x.max?Math.round(x.got/x.max*100):null;
  return `<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>${x.read?'<span class="chk" title="Materi sudah dibaca">✓</span>':'<span class="mut" title="Materi belum dibaca">○</span>'} ${lbl}</span><b>${p==null?'<span class="mut" style="font-weight:500">belum ada</span>':p+'%'}</b></div><div class="bar"><i style="width:${p||0}%;background:${p==null?'#cbd5e1':pctColor(p,S)}"></i></div>
  ${own&&(p==null||p<TARGET[S])?`<button class="mini-btn" style="margin-top:4px" onclick="startPractice('${S}','${t}',10)">Latih topik ini</button>`:''}</div>`}).join('')}</div>`).join('')}</div></div>
 <div class="sec"><h3>Riwayat simulasi</h3>${sorted.length?`<div class="tbl-wrap"><table><tr><th>Waktu</th><th>Mode</th><th>Tingkat</th><th>TWK</th><th>TIU</th><th>TKP</th><th>Total</th><th>Durasi</th><th>Status</th></tr>
 ${sorted.map(s=>`<tr><td>${dt(s.waktu)}</td><td>${s.mode==='full'?'Lengkap':'Mini'}${s.auto?' <span class="mut" style="font-size:11px">(waktu habis)</span>':''}</td><td>${s.level?(s.level==='HOTS'?'<span class="pill p-hots">HOTS</span>':esc(s.level)):'–'}</td><td class="${s.twk>=s.pg_twk?'ok-t':'bad-t'}">${s.twk}</td><td class="${s.tiu>=s.pg_tiu?'ok-t':'bad-t'}">${s.tiu}</td><td class="${s.tkp>=s.pg_tkp?'ok-t':'bad-t'}">${s.tkp}</td><td><b>${s.total}</b>/${s.mode==='full'?550:275}</td><td>${Math.round((+s.durasi||0)/60)} mnt</td><td class="${s.lulus?'ok-t':'bad-t'}">${s.lulus?'Lolos PG':'Belum lolos'}</td></tr>`).join('')}</table></div>`:'<div class="card mut">Belum ada simulasi yang diselesaikan.</div>'}</div>
 <div class="sec"><h3>Aktivitas terbaru</h3><div class="card">${recent.length?recent.map(r=>`<div style="display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px"><span class="mut" style="flex:0 0 130px;font-size:12px">${dt(r.w)}</span><span>${r.txt}</span></div>`).join(''):'<span class="mut">Belum ada aktivitas.</span>'}</div></div>`;
}
function vProgres(app){
 app.innerHTML=`<h1>Progres Belajar Saya</h1><div class="loading">Memuat progres…</div>`;
 getProg(true).then(p=>{if(VIEW!=='progres')return;app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div><h1>Progres Belajar Saya</h1><p class="mut" style="margin-top:-6px">Data tersimpan di server dan dapat dipantau oleh admin.</p></div>${store.get(uk('cpns_last'),null)?`<button class="btn ghost" onclick="go('hasil')">Hasil & pembahasan simulasi terakhir</button>`:''}</div>${progressHTML(p,true)}`})
 .catch(e=>{app.innerHTML=`<h1>Progres Belajar Saya</h1><div class="err">${esc(e.message)}</div>`});
}

/* ---------- Dashboard Admin ---------- */
let ADM=null,AQ='',AF='all';
function vAdmin(app){
 app.innerHTML=`<h1>Dashboard Admin</h1><div class="loading">Memuat data peserta…</div>`;
 api('adminOverview').then(r=>{ADM=r;if(VIEW==='admin')drawAdmin(app)}).catch(e=>{app.innerHTML=`<h1>Dashboard Admin</h1><div class="err">${esc(e.message)}</div>`});
}
function drawAdmin(app){
 const st=ADM.stats,q=AQ.toLowerCase();
 let rows=ADM.peserta.filter(p=>!q||(p.nama+' '+p.username+' '+p.instansi).toLowerCase().includes(q));
 if(AF==='lulus')rows=rows.filter(p=>p.last&&p.last.lulus);if(AF==='belum')rows=rows.filter(p=>p.sim&&!(p.last&&p.last.lulus));if(AF==='nosim')rows=rows.filter(p=>!p.sim);if(AF==='pasif')rows=rows.filter(p=>!p.lastActive||Date.now()-p.lastActive>7*864e5);
 rows.sort((a,b)=>(b.lastActive||0)-(a.lastActive||0));
 const totalTopik=Object.values(TOPICS).reduce((a,o)=>a+Object.keys(o).length,0);
 app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div><h1>Dashboard Admin</h1><p class="mut" style="margin-top:-6px">Pantau progres belajar dan hasil simulasi seluruh peserta.</p></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">${ADM.ssUrl?`<a class="btn ghost" href="${ADM.ssUrl}" target="_blank" rel="noopener">Buka Spreadsheet</a>`:''}<button class="btn ghost" onclick="vAdmin($('#app'))">↻ Muat ulang</button></div></div>
 <div class="tiles"><div class="tile"><small>Peserta terdaftar</small><b>${st.peserta}</b></div><div class="tile"><small>Aktif 7 hari terakhir</small><b>${st.aktif7}</b></div><div class="tile"><small>Sesi latihan</small><b>${fmt(st.latihan)}</b></div><div class="tile"><small>Simulasi selesai</small><b>${st.simulasi}</b></div><div class="tile"><small>Tingkat lolos PG</small><b>${st.simulasi?Math.round(st.lulus/st.simulasi*100)+'%':'–'}</b><small>${st.lulus} dari ${st.simulasi} simulasi</small></div></div>
 <div class="toolbar"><input class="inp" id="aq" placeholder="Cari nama, username, instansi…" value="${esc(AQ)}">
 <div class="chips" id="af">${[['all','Semua'],['lulus','Simulasi terakhir lolos'],['belum','Terakhir belum lolos'],['nosim','Belum simulasi'],['pasif','Tidak aktif >7 hari']].map(([k,l])=>`<button class="chip ${AF===k?'on':''}" data-v="${k}">${l}</button>`).join('')}</div>
 <button class="mini-btn" id="csvBtn" style="margin-left:auto">Salin CSV</button></div>
 <div class="tbl-wrap"><table><tr><th>Peserta</th><th>Materi</th><th>Latihan</th><th>Akurasi latihan</th><th>Simulasi</th><th>Terbaik</th><th>Simulasi terakhir</th><th>Terakhir aktif</th><th></th></tr>
 ${rows.length?rows.map(p=>`<tr><td><b>${esc(p.nama)}</b>${p.aktif?'':' <span class="badge b-off">nonaktif</span>'}<br><span class="mut" style="font-size:12px">@${esc(p.username)}${p.instansi&&p.instansi!=='-'?' · '+esc(p.instansi):''}</span></td>
 <td>${p.materi}/${totalTopik}</td><td>${p.latihan} sesi<br><span class="mut" style="font-size:12px">${fmt(p.soal)} soal</span></td><td>${p.akurasi==null?'–':p.akurasi+'%'}</td><td>${p.sim}</td><td>${p.best??'–'}</td>
 <td>${p.last?`<b>${p.last.total}</b> <span class="mut" style="font-size:12px">(${p.last.mode==='full'?'lengkap':'mini'})</span><br><span class="${p.last.lulus?'ok-t':'bad-t'}" style="font-size:12px">${p.last.lulus?'Lolos PG':'Belum lolos'}</span> <span class="mut" style="font-size:11px">${p.last.twk}/${p.last.tiu}/${p.last.tkp}</span>`:'<span class="mut">–</span>'}</td>
 <td style="font-size:12px">${dt(p.lastActive)}</td><td><button class="mini-btn" onclick="openPeserta('${p.username}')">Detail</button></td></tr>`).join(''):`<tr><td colspan="9" class="mut" style="text-align:center;padding:24px">Tidak ada peserta yang cocok.</td></tr>`}</table></div>
 <p class="mut" style="font-size:12px">Simulasi terakhir menampilkan nilai TWK/TIU/TKP. Akurasi latihan = total poin dibagi poin maksimal semua sesi latihan.</p>`;
 const aq=$('#aq');aq.oninput=()=>{AQ=aq.value;drawAdmin(app);const n=$('#aq');n.focus();n.setSelectionRange(n.value.length,n.value.length)};
 $('#af').onclick=e=>{const b=e.target.closest('.chip');if(b){AF=b.dataset.v;drawAdmin(app)}};
 $('#csvBtn').onclick=()=>{const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[['Nama','Username','Instansi','Aktif','Materi dibaca','Sesi latihan','Soal latihan','Akurasi latihan (%)','Jumlah simulasi','Skor terbaik','Simulasi terakhir - total','TWK','TIU','TKP','Status terakhir','Terakhir aktif'].map(c).join(','),...rows.map(p=>[p.nama,p.username,p.instansi,p.aktif?'Ya':'Tidak',p.materi,p.latihan,p.soal,p.akurasi,p.sim,p.best,p.last?.total,p.last?.twk,p.last?.tiu,p.last?.tkp,p.last?(p.last.lulus?'Lolos PG':'Belum lolos'):'',dt(p.lastActive)].map(c).join(','))].join('\n');
  navigator.clipboard.writeText(csv).then(()=>toast('CSV disalin. Tempelkan ke Excel/Google Sheets.')).catch(()=>modal(`<h3>Salin CSV</h3><textarea class="inp" style="height:220px;font-size:12px">${esc(csv)}</textarea><div class="act"><button class="btn" onclick="closeModal()">Tutup</button></div>`))};
}
function openPeserta(u){DETAIL=u;go('peserta')}
function vPeserta(app){
 app.innerHTML=`<button class="btn ghost" onclick="go('admin')">← Kembali ke Dashboard</button><div class="loading">Memuat detail peserta…</div>`;
 api('adminDetail',DETAIL).then(r=>{if(VIEW!=='peserta')return;const u=r.user;USERS=USERS||[];if(!USERS.find(x=>x.username===u.username))USERS.push(u);
  app.innerHTML=`<button class="btn ghost" onclick="go('admin')">← Kembali ke Dashboard</button>
  <div class="card" style="margin:14px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="logo" style="width:52px;height:52px;font-size:20px;border-radius:50%">${esc((u.nama||'?')[0].toUpperCase())}</div><div style="flex:1"><h2 style="margin:0">${esc(u.nama)} ${u.aktif?'':'<span class="badge b-off">nonaktif</span>'}</h2><div class="mut">@${esc(u.username)} · ${esc(u.instansi||'-')} · terdaftar ${dt(u.dibuat)} · login terakhir ${dt(u.login)}</div></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="mini-btn" onclick="editUser('${u.username}')">Edit</button><button class="mini-btn" onclick="resetPw('${u.username}')">Reset sandi</button><button class="mini-btn" onclick="toggleActive('${u.username}',${!u.aktif})">${u.aktif?'Nonaktifkan':'Aktifkan'}</button>${USER.role==='master'?`<button class="mini-btn" style="color:var(--red)" onclick="deleteUser('${u.username}')">Hapus</button>`:''}</div></div>
  ${progressHTML(r,false)}`}).catch(e=>{app.innerHTML+=`<div class="err">${esc(e.message)}</div>`});
}

/* ---------- Kelola Akun ---------- */
let USERS=null;
function vAkun(app){
 app.innerHTML=`<h1>Kelola Akun</h1><div class="loading">Memuat akun…</div>`;
 api('listUsers').then(r=>{USERS=r;if(VIEW==='akun')drawAkun(app)}).catch(e=>{app.innerHTML=`<h1>Kelola Akun</h1><div class="err">${esc(e.message)}</div>`});
}
function drawAkun(app){
 const master=USER.role==='master';
 const ord={master:0,admin:1,peserta:2};const list=USERS.slice().sort((a,b)=>ord[a.role]-ord[b.role]||a.nama.localeCompare(b.nama));
 app.innerHTML=`<h1>Kelola Akun</h1><p class="mut" style="margin-top:-6px">${master?'Sebagai master admin (super admin), Anda dapat membuat, mengedit, mengubah peran, mereset sandi, menonaktifkan, dan menghapus akun peserta maupun admin.':'Admin dapat membuat, mengedit, mereset sandi, dan menonaktifkan akun peserta. Penghapusan akun dan pengelolaan akun admin hanya dapat dilakukan master admin.'}</p>
 <div class="card" style="max-width:900px"><h3>Tambah akun</h3><div id="nuErr"></div>
 <form id="nuForm" class="grid3" style="gap:10px">
  <div class="field"><label>Nama lengkap</label><input class="inp" id="nuN" required></div>
  <div class="field"><label>Username</label><input class="inp" id="nuU" placeholder="huruf kecil/angka" required></div>
  <div class="field"><label>Kata sandi awal</label><input class="inp" id="nuP" placeholder="min. 6 karakter" required></div>
  <div class="field"><label>Instansi / asal</label><input class="inp" id="nuI"></div>
  <div class="field"><label>Peran</label><select class="inp" id="nuR"><option value="peserta">Peserta</option>${master?'<option value="admin">Admin</option>':''}</select></div>
  <div class="field" style="display:flex;align-items:flex-end"><button class="btn" type="submit" style="width:100%;justify-content:center">Tambah Akun</button></div>
 </form></div>
 <div class="toolbar"><input class="inp" id="uq" placeholder="Cari akun…"></div>
 <div class="tbl-wrap"><table id="utbl"><tr><th>Nama</th><th>Username</th><th>Instansi</th><th>Peran</th><th>Status</th><th>Login terakhir</th><th>Aksi</th></tr>
 ${list.map(u=>{const can=u.username!==USER.username&&(u.role==='peserta'||master);return `<tr data-s="${esc((u.nama+' '+u.username+' '+u.instansi).toLowerCase())}"><td><b>${esc(u.nama)}</b></td><td>@${esc(u.username)}</td><td>${esc(u.instansi||'-')}</td><td><span class="badge b-${u.role}">${roleLabel(u.role)}</span></td><td>${u.aktif?'<span class="ok-t">Aktif</span>':'<span class="bad-t">Nonaktif</span>'}</td><td style="font-size:12px">${dt(u.login)}</td>
 <td style="white-space:nowrap">${can?`<button class="mini-btn" onclick="editUser('${u.username}')">Edit</button> <button class="mini-btn" onclick="resetPw('${u.username}')">Reset sandi</button> <button class="mini-btn" onclick="toggleActive('${u.username}',${!u.aktif})">${u.aktif?'Nonaktifkan':'Aktifkan'}</button>${master?` <button class="mini-btn" style="color:var(--red)" onclick="deleteUser('${u.username}')">Hapus</button>`:''}`:'<span class="mut" style="font-size:12px">–</span>'}${u.role==='peserta'?` <button class="mini-btn" onclick="openPeserta('${u.username}')">Progres</button>`:''}</td></tr>`}).join('')}</table></div>`;
 $('#uq').oninput=e=>{const q=e.target.value.toLowerCase();app.querySelectorAll('#utbl tr[data-s]').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')};
 $('#nuForm').onsubmit=e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
  api('createUser',{nama:$('#nuN').value,username:$('#nuU').value,password:$('#nuP').value,instansi:$('#nuI').value,role:$('#nuR').value}).then(()=>{toast('Akun berhasil dibuat.');vAkun(app)}).catch(err=>{$('#nuErr').innerHTML=`<div class="err">${esc(err.message)}</div>`;b.disabled=false})};
}
function resetPw(u){
 modal(`<h3>Reset kata sandi</h3><p class="mut">Akun @${esc(u)}. Sampaikan kata sandi baru kepada pemilik akun.</p><div id="rpErr"></div><input class="inp" id="rpP" placeholder="Kata sandi baru (min. 6 karakter)" value="${Math.random().toString(36).slice(2,10)}"><div class="act"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" id="rpB">Simpan</button></div>`);
 $('#rpB').onclick=()=>{$('#rpB').disabled=true;api('resetPassword',u,$('#rpP').value).then(()=>{closeModal();toast('Kata sandi @'+u+' berhasil direset.')}).catch(e=>{$('#rpErr').innerHTML=`<div class="err">${esc(e.message)}</div>`;$('#rpB').disabled=false})};
}
function findU(u){return (USERS||[]).find(x=>x.username===u)||(ADM&&ADM.peserta.find(x=>x.username===u))||{username:u,nama:'',instansi:'',role:'peserta'}}
function afterUserChange(msg){toast(msg);if(VIEW==='akun')vAkun($('#app'));else if(VIEW==='peserta')vPeserta($('#app'));else if(VIEW==='admin')vAdmin($('#app'))}
function editUser(un){
 const u=findU(un),master=USER.role==='master',canRole=master&&u.role!=='master'&&un!==USER.username;
 modal(`<h3>Edit akun @${esc(un)}</h3><div id="euErr"></div>
 <div class="field"><label>Nama lengkap</label><input class="inp" id="euN" value="${esc(u.nama||'')}"></div>
 <div class="field"><label>Instansi / asal</label><input class="inp" id="euI" value="${esc(u.instansi&&u.instansi!=='-'?u.instansi:'')}"></div>
 ${canRole?`<div class="field"><label>Peran</label><select class="inp" id="euR"><option value="peserta" ${u.role==='peserta'?'selected':''}>Peserta</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></div>`:''}
 <div class="act"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" id="euB">Simpan</button></div>`);
 $('#euB').onclick=()=>{$('#euB').disabled=true;const o={nama:$('#euN').value,instansi:$('#euI').value};if(canRole)o.role=$('#euR').value;
  api('updateUser',un,o).then(()=>{closeModal();afterUserChange('Data akun berhasil diperbarui.')}).catch(e=>{$('#euErr').innerHTML=`<div class="err">${esc(e.message)}</div>`;$('#euB').disabled=false})};
}
function deleteUser(un){
 modal(`<h3>Hapus akun @${esc(un)}?</h3><p>Akun beserta <b>seluruh riwayat latihan dan simulasinya</b> akan dihapus permanen dari database. Jika hanya ingin memblokir akses, gunakan <b>Nonaktifkan</b>.</p><div id="duErr"></div>
 <div class="field"><label>Ketik <b>${esc(un)}</b> untuk konfirmasi</label><input class="inp" id="duC" autocomplete="off"></div>
 <div class="act"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn danger" id="duB">Hapus permanen</button></div>`);
 $('#duB').onclick=()=>{if($('#duC').value.trim()!==un){$('#duErr').innerHTML='<div class="err">Konfirmasi tidak sesuai.</div>';return}$('#duB').disabled=true;
  api('deleteUser',un).then(()=>{closeModal();if(VIEW==='peserta'){toast('Akun dihapus.');go('admin')}else afterUserChange('Akun dihapus.')}).catch(e=>{$('#duErr').innerHTML=`<div class="err">${esc(e.message)}</div>`;$('#duB').disabled=false})};
}
function toggleActive(u,a){api('setActive',u,a).then(()=>afterUserChange(a?'Akun diaktifkan.':'Akun dinonaktifkan.')).catch(e=>toast(e.message))}

/* ---------- Keyboard di CAT ---------- */
document.addEventListener('keydown',e=>{
 if($('#catRoot').classList.contains('hidden')||!$('#modal').classList.contains('hidden'))return;
 if(e.target.tagName==='INPUT')return;const D=REVIEW||EX;if(!D)return;
 const k=e.key.toUpperCase();
 if(!REVIEW&&'ABCDE'.includes(k)&&k.length===1){EX.ans[EX.cur]='ABCDE'.indexOf(k);saveEx();catRender()}
 else if(e.key==='ArrowRight')gotoQ(D.cur+1);else if(e.key==='ArrowLeft')gotoQ(D.cur-1);
});

/* ---------- Init ---------- */
(function(){
 buildNav();$('#app').innerHTML='<div class="loading">Memuat…</div>';
 api('info').then(i=>{INFO=i||INFO}).catch(()=>{}).finally(()=>{
  const ss=store.get('skd_session',null);
  if(!ss||!ss.token)return vLogin($('#app'));
  TOKEN=ss.token;USER=ss.user;
  api('me').then(u=>{USER=u;store.set('skd_session',{token:TOKEN,user:USER});afterLogin()}).catch(()=>{if(USER)forceLogout('Sesi Anda berakhir. Silakan masuk kembali.')});
 });
})();
</script>
