<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siap SKD CPNS — Materi, Latihan & Simulasi CAT</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d3b66'/%3E%3Cpath d='M32 13 6 25l26 12 20-9.2V42h4V25z' fill='%23f2b705'/%3E%3Cpath d='M17 33v9c0 4 7 8 15 8s15-4 15-8v-9l-15 7z' fill='%23fff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0d3b66">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d3b66;--navy2:#0a2e50;--blue:#1d6fd6;--bg:#eef2f7;--card:#fff;--ink:#1e293b;--mut:#64748b;--line:#dbe3ec;--green:#1f9d55;--green-bg:#e3f6ea;--yellow:#f2b705;--yellow-bg:#fff6d6;--red:#d93838;--red-bg:#fde8e8;--twk:#7c3aed;--tiu:#0891b2;--tkp:#ea580c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
/* App bar */
.appbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;box-shadow:0 2px 10px rgba(0,0,0,.15);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#f2b705,#f59e0b);color:var(--navy2);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
.brand b{display:block;font-size:16px}.brand small{opacity:.75;font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#cfe0f3;padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:#fff;color:var(--navy)}
main{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;background:var(--blue);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.warn{background:var(--yellow);color:#3b2c00}
.btn.danger{background:var(--red)}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.mut{color:var(--mut)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.p-hots{background:#fde8e8;color:#b91c1c}.p-TWK{background:#efe7ff;color:var(--twk)}.p-TIU{background:#dff5fa;color:var(--tiu)}.p-TKP{background:#ffeddf;color:var(--tkp)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;font-size:14px}
th{background:#f5f8fb;font-weight:700;color:#334155}
.hero{background:linear-gradient(120deg,var(--navy) 0%,#164e86 60%,#1d6fd6 100%);color:#fff;border-radius:18px;padding:28px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}
.hero p{opacity:.88;margin:.3em 0 1em}
.hero .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}.stat small{opacity:.8;font-size:12px}
.sub-card{border-left:5px solid;padding:16px 18px}
.sub-card.TWK{border-color:var(--twk)}.sub-card.TIU{border-color:var(--tiu)}.sub-card.TKP{border-color:var(--tkp)}
.sub-card .big{font-size:26px;font-weight:800}
.sec{margin-top:26px}
ul.tips{margin:.3em 0;padding-left:1.2em}ul.tips li{margin:.25em 0}
/* Materi */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font-weight:700;color:#334155}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.acc{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;overflow:hidden}
.acc>summary{list-style:none;padding:14px 18px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:after{content:'+';font-size:20px;color:var(--mut)}
.acc[open]>summary:after{content:'–'}
.acc .body{padding:4px 18px 18px;border-top:1px solid var(--line)}
.acc .body h4{margin-top:1.1em;color:var(--navy)}
.acc .body table{margin:.5em 0}
.note{background:#f1f7ff;border:1px solid #cfe2fb;border-radius:10px;padding:10px 14px;margin:.8em 0;font-size:14px}
/* Latihan */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;color:#334155}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.lbl{font-weight:700;margin:16px 0 8px;font-size:14px}
.qcard{max-width:860px;margin:0 auto}
.progress{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:10px 0 18px}
.progress i{display:block;height:100%;background:var(--blue)}
.qtext{font-size:16px;margin-bottom:14px}
.qtext p{margin:.3em 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font-size:inherit;color:inherit}
.opt:hover:not(:disabled){border-color:#9cc0ee;background:#f7fbff}
.opt .rd{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid #94a3b8;display:grid;place-items:center;font-weight:800;font-size:13px;color:#475569}
.opt .ot{padding-top:3px;flex:1}
.opt.sel{border-color:var(--blue);background:#eef5ff}.opt.sel .rd{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);background:var(--green-bg)}.opt.ok .rd{background:var(--green);border-color:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-bg)}.opt.bad .rd{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default}
.wbadge{margin-left:auto;font-weight:800;font-size:12px;padding:2px 8px;border-radius:6px;background:#f1f5f9;color:#475569;align-self:center}
.wbadge.w5{background:var(--green);color:#fff}
.pemb{margin-top:14px;background:#fffbea;border:1px solid #f5dc8a;border-radius:10px;padding:12px 14px;font-size:14px}
.pemb b{color:#7a5b00}
.figrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.figq{width:54px;height:54px;border:2px dashed #94a3b8;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#64748b}
.fig{display:block}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal .box{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .act{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
/* CAT */
.cat{min-height:100vh;display:flex;flex-direction:column;background:#e9eef4}
.cat-top{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 18px;flex-wrap:wrap;border-bottom:4px solid var(--yellow)}
.cat-brand{display:flex;align-items:center;gap:10px}
.cat-logo{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:12px;border:3px solid var(--yellow)}
.cat-brand b{display:block;font-size:15px;letter-spacing:.3px}.cat-brand small{opacity:.75;font-size:12px}
.cat-user{display:flex;gap:22px}
.cat-user small,.cat-timer small{display:block;opacity:.7;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.cat-user b{font-size:14px}
.cat-timer{background:#fff;color:var(--navy);border-radius:10px;padding:6px 16px;text-align:center;min-width:140px}
.cat-timer small{color:var(--mut);opacity:1}
.cat-timer b{font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:1px}
.cat-timer.low{background:var(--red);color:#fff}.cat-timer.low small{color:#fff}
.cat-menu{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
.cat-body{flex:1;display:grid;grid-template-columns:1fr 330px;gap:16px;padding:16px;max-width:1400px;width:100%;margin:0 auto}
.cat-main{background:#fff;border:1px solid #cdd7e3;border-radius:10px;display:flex;flex-direction:column;min-height:520px}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid #e2e8f0;background:#f7f9fc;border-radius:10px 10px 0 0;gap:10px;flex-wrap:wrap}
.qnum{font-weight:800;font-size:17px;color:var(--navy)}
.fontctl{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mut)}
.fontctl button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-weight:700;color:#334155}
.qbody{padding:20px 22px;flex:1;overflow:auto}
.qfoot{display:flex;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid #e2e8f0;background:#f7f9fc;border-radius:0 0 10px 10px;flex-wrap:wrap}
.qfoot .btn{min-width:150px;justify-content:center}
.btn.ragu{background:#fff;color:#7a5b00;border:2px solid var(--yellow)}
.btn.ragu.on{background:var(--yellow);color:#3b2c00}
.cat-side{background:#fff;border:1px solid #cdd7e3;border-radius:10px;padding:14px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.side-h{font-weight:800;color:var(--navy);margin-bottom:6px}
.sumrow{display:flex;gap:6px;margin:8px 0 12px;font-size:12px}
.sumrow div{flex:1;text-align:center;border-radius:8px;padding:6px 4px;background:#f1f5f9}
.sumrow b{display:block;font-size:16px}
.grp{font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 6px}
.ngrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.nb{border:1px solid #b8c4d3;background:#fff;border-radius:5px;height:32px;font-size:12px;font-weight:700;color:#334155;padding:0;position:relative}
.nb.ans{background:var(--green);border-color:var(--green);color:#fff}
.nb.rg{background:var(--yellow);border-color:#d39e00;color:#3b2c00}
.nb.cur{outline:3px solid var(--blue);outline-offset:1px}
.nb.wrong{background:var(--red);border-color:var(--red);color:#fff}
.nb.part{background:#86c99f;border-color:#86c99f;color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:11px;color:var(--mut);margin:12px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid #b8c4d3}
.finish{width:100%;justify-content:center;margin-top:6px}
.sidetoggle{display:none}
.rtable td,.rtable th{text-align:center}.rtable td:first-child,.rtable th:first-child{text-align:left}
.ok-t{color:var(--green);font-weight:800}.bad-t{color:var(--red);font-weight:800}
.verdict{border-radius:14px;padding:18px 20px;margin:14px 0;font-weight:800;font-size:18px;display:flex;align-items:center;gap:12px}
.verdict.ok{background:var(--green-bg);color:#126b39;border:1px solid #a6dfbd}
.verdict.bad{background:var(--red-bg);color:#9b1c1c;border:1px solid #f3b4b4}
.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
.disc{font-size:12px;color:var(--mut);margin-top:30px;text-align:center}
/* Auth & admin */
.userbox{display:flex;align-items:center;gap:8px}
.uchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:4px 12px 4px 4px;text-align:left}
.uchip .av{width:30px;height:30px;border-radius:50%;background:var(--yellow);color:var(--navy2);display:grid;place-items:center;font-weight:800}
.uchip b{display:block;font-size:13px;line-height:1.1}.uchip small{font-size:11px;opacity:.75}
.login-wrap{min-height:calc(100vh - 140px);display:grid;place-items:center}
.login{max-width:430px;width:100%}
.login .tabs{margin-bottom:12px}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.inp:focus{outline:2px solid #9cc0ee;border-color:var(--blue)}
.field{margin-bottom:12px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
.err{background:var(--red-bg);color:#9b1c1c;border:1px solid #f3b4b4;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.tile small{color:var(--mut);font-size:12px;display:block}.tile b{font-size:26px;font-weight:800}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.toolbar .inp{max-width:280px}
.tbl-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
.tbl-wrap table th{position:sticky;top:0}
.mini-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--navy)}
.mini-btn:hover{background:#f1f7ff}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:800}
.b-master{background:#1e293b;color:#fff}.b-admin{background:#dbeafe;color:#1e40af}.b-peserta{background:#f1f5f9;color:#475569}.b-off{background:var(--red-bg);color:var(--red)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.loading{padding:30px;text-align:center;color:var(--mut)}
.chk{color:var(--green);font-weight:800}
@media (max-width:900px){
 .hero{grid-template-columns:1fr}
 .cat-body{grid-template-columns:1fr;padding:10px}
 .cat-side{position:fixed;inset:auto 0 0 0;max-height:70vh;border-radius:16px 16px 0 0;z-index:50;box-shadow:0 -10px 30px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .25s;top:auto}
 .cat-side.open{transform:none}
 .sidetoggle{display:inline-flex}
 .qfoot .btn{min-width:0;flex:1;padding:10px 8px;font-size:13px}
 .cat-user{gap:12px}
 .ngrid{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:560px){main{padding:16px 12px 50px}.appbar{padding:10px 12px}nav button{padding:7px 10px;font-size:13px}.stats{grid-template-columns:repeat(3,1fr)}h1{font-size:23px}}
</style>
</head>
<body>
<header class="appbar" id="appbar">
  <div class="brand"><div class="logo">SKD</div><div><b>Siap SKD CPNS</b><small>Materi • Latihan • Simulasi CAT</small></div></div>
  <nav id="nav"></nav>
  <div class="userbox" id="userbox"></div>
</header>
<main id="app"></main>
<div id="catRoot" class="hidden"></div>
<div id="modal" class="modal hidden"></div>

<script>
/* ================== UTIL ================== */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Number(n).toLocaleString('id-ID');
const rp=n=>'Rp'+fmt(n);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const LET='ABCDE';
const PG={TWK:65,TIU:80,TKP:166},MAX={TWK:150,TIU:175,TKP:225};
const SNAME={TWK:'Tes Wawasan Kebangsaan',TIU:'Tes Intelegensia Umum',TKP:'Tes Karakteristik Pribadi'};
const TOPICS={
 TWK:{pancasila:'Pancasila & Pengamalannya',uud:'UUD 1945',pilar:'Pilar Negara & Integrasi Nasional',nasionalisme:'Nasionalisme',bhinneka:'Kebhinekaan & Wawasan Nusantara',sejarah:'Sejarah & NKRI',integritas:'Integritas & Nilai ASN',belanegara:'Bela Negara',bahasa:'Bahasa Negara'},
 TIU:{verbal:'Verbal (Sinonim, Antonim, Analogi)',logika:'Penalaran Logis',analitis:'Penalaran Analitis',numerik:'Numerik (Deret & Hitungan)',figural:'Figural'},
 TKP:{pelayanan:'Pelayanan Publik',jejaring:'Jejaring Kerja',sosbud:'Sosial Budaya',tik:'Teknologi Informasi & Komunikasi',profesional:'Profesionalisme',radikal:'Anti Radikalisme'}
};

/* ================== BANK SOAL ================== */
/* Format: [topik, soal, [opsi benar dulu, ...4 pengecoh], pembahasan]. Opsi diacak saat ditampilkan. */
const TWK=[
["pancasila","Sidang pertama BPUPKI yang membahas rumusan dasar negara berlangsung pada tanggal …",["29 Mei – 1 Juni 1945","10 – 17 Juli 1945","22 Juni 1945","18 Agustus 1945","7 – 9 Agustus 1945"],"Sidang I BPUPKI (29 Mei–1 Juni 1945) membahas dasar negara. Sidang II (10–17 Juli 1945) membahas rancangan UUD."],
["pancasila","Istilah “Pancasila” sebagai nama dasar negara pertama kali dikemukakan Ir. Soekarno dalam pidatonya pada tanggal …",["1 Juni 1945","29 Mei 1945","31 Mei 1945","22 Juni 1945","18 Agustus 1945"],"Pidato Soekarno 1 Juni 1945 memperkenalkan istilah Pancasila; tanggal ini ditetapkan sebagai Hari Lahir Pancasila."],
["pancasila","Rumusan dasar negara yang dihasilkan Panitia Sembilan pada 22 Juni 1945 dikenal dengan nama …",["Piagam Jakarta (Jakarta Charter)","Dekrit Presiden","Maklumat Wakil Presiden No. X","Deklarasi Djuanda","Naskah Rengasdengklok"],"Panitia Sembilan yang diketuai Soekarno merumuskan Piagam Jakarta pada 22 Juni 1945."],
["pancasila","Perubahan rumusan sila pertama Piagam Jakarta menjadi “Ketuhanan Yang Maha Esa” disahkan dalam sidang PPKI pada tanggal …",["18 Agustus 1945","17 Agustus 1945","22 Juni 1945","1 Juni 1945","19 Agustus 1945"],"Pada sidang PPKI 18 Agustus 1945, UUD 1945 disahkan, termasuk rumusan final Pancasila dalam Pembukaan."],
["pancasila","Lambang pohon beringin pada perisai Garuda Pancasila melambangkan sila ke- …",["Ketiga","Pertama","Kedua","Keempat","Kelima"],"Bintang = sila 1, rantai = sila 2, pohon beringin = sila 3, kepala banteng = sila 4, padi dan kapas = sila 5."],
["pancasila","Ketua BPUPKI adalah …",["dr. K.R.T. Radjiman Wedyodiningrat","Ir. Soekarno","Drs. Moh. Hatta","Prof. Mr. Soepomo","Mr. Muh. Yamin"],"BPUPKI diketuai dr. Radjiman Wedyodiningrat. PPKI diketuai Ir. Soekarno dengan wakil Drs. Moh. Hatta."],
["pancasila","Kedudukan Pancasila sebagai sumber segala sumber hukum negara ditegaskan dalam …",["Pasal 2 UU Nomor 12 Tahun 2011 tentang Pembentukan Peraturan Perundang-undangan","Pasal 1 ayat (1) UUD 1945","UU Nomor 24 Tahun 2009","Pasal 37 UUD 1945","UU Nomor 23 Tahun 2014"],"Pasal 2 UU 12/2011 (beserta perubahannya): “Pancasila merupakan sumber segala sumber hukum negara.”"],

const TWK_CASE=[{"s": "TWK", "t": "nasionalisme", "q": "Dalam masyarakat multikultural seperti Indonesia, nasionalisme dapat terancam apabila muncul sikap intoleransi antarumat beragama. Upaya paling efektif untuk menjaga nasionalisme dalam kondisi tersebut adalah...", "o": ["Membatasi aktivitas kelompok tertentu yang dianggap berpotensi menimbulkan konflik sosial", "Menekankan identitas nasional melalui pengurangan simbol keagamaan di ruang publik", "Menjadikan nilai agama mayoritas sebagai dasar utama kebijakan sosial nasional", "Mendorong dialog, toleransi, dan penghormatan terhadap kebebasan beragama sesuai konstitusi", "Menghindari pembahasan isu agama dalam kehidupan sosial demi menjaga stabilitas masyarakat"], "a": 3, "p": "Indonesia dibangun di atas prinsip keberagaman yang dijamin oleh konstitusi. Nasionalisme dalam masyarakat multikultural harus diwujudkan melalui sikap saling menghormati, toleransi, dan perlindungan hak setiap warga negara.<br>Opsi D paling tepat karena mendorong dialog dan penghormatan terhadap kebebasan beragama sesuai nilai Pancasila dan UUD 1945. Opsi A berpotensi diskriminatif. Opsi B tidak menyelesaikan akar intoleransi. Opsi C bertentangan dengan kesetaraan warga negara. Opsi E kurang tepat karena isu keberagaman justru perlu dikelola dengan dialog yang sehat.", "fx": 1, "src": 1}, {"s": "TWK", "t": "nasionalisme", "q": "Seorang mahasiswa aktif di media sosial dan sering melihat konten yang merendahkan kelompok suku tertentu. Beberapa temannya ikut menyebarkan konten tersebut dengan alasan hanya bercanda. Sikap yang paling mencerminkan nasionalisme adalah...", "o": ["Ikut membagikan konten tersebut agar tidak dianggap berbeda dari teman-temannya", "Diam saja karena candaan antarsuku merupakan hal biasa di media sosial", "Menegur dengan sopan dan mengingatkan bahwa merendahkan suku tertentu dapat merusak persatuan", "Membalas konten tersebut dengan hinaan kepada suku lain agar terlihat adil", "Melaporkan semua teman ke pihak berwajib tanpa lebih dulu memberi pemahaman"], "a": 2, "p": "Nasionalisme tidak hanya ditunjukkan lewat upacara atau simbol negara, tetapi juga lewat sikap menjaga persatuan dalam kehidupan sehari-hari, termasuk di media sosial.<br>Opsi C paling tepat karena menunjukkan keberanian menolak tindakan yang merendahkan kelompok tertentu, tetapi tetap dilakukan dengan cara yang sopan dan edukatif. Opsi A dan B menunjukkan pembiaran terhadap sikap diskriminatif. Opsi D memperparah konflik. Opsi E bisa dilakukan jika pelanggaran serius, tetapi dalam konteks ini pendekatan edukatif lebih tepat sebagai langkah awal.", "fx": 1, "src": 1}, {"s": "TWK", "t": "nasionalisme", "q": "Dalam sebuah diskusi kampus, muncul perdebatan tajam terkait perbedaan pilihan politik. Beberapa peserta mulai menyerang pribadi lawan diskusi dan membawa isu suku serta agama. Sikap yang paling tepat untuk menjaga nasionalisme adalah...", "o": ["Menghentikan diskusi karena perbedaan politik selalu menimbulkan konflik", "Mengarahkan diskusi kembali pada gagasan dan mengingatkan pentingnya menghormati perbedaan", "Membela kelompok yang memiliki pandangan politik sama agar terlihat solid", "Menyebarkan potongan video diskusi agar kelompok lawan mendapat tekanan publik", "Menghindari semua diskusi politik karena dapat melemahkan persatuan bangsa"], "a": 1, "p": "Dalam negara demokrasi, perbedaan pendapat adalah hal wajar. Nasionalisme tidak berarti semua warga harus memiliki pandangan politik yang sama, tetapi mampu menjaga persatuan meskipun berbeda pilihan.<br>Opsi B paling tepat karena tetap menghargai ruang diskusi, tetapi mengarahkannya agar tidak keluar dari nilai persatuan dan penghormatan terhadap sesama warga negara. Opsi A dan E terlalu menghindari masalah. Opsi C menunjukkan keberpihakan sempit. Opsi D berisiko memperkeruh keadaan.", "fx": 1, "src": 1}, {"s": "TWK", "t": "nasionalisme", "q": "Sebuah daerah mengalami konflik antara penduduk lokal dan pendatang karena isu persaingan ekonomi. Pemerintah daerah ingin mengambil langkah yang dapat menjaga persatuan tanpa mengabaikan keadilan sosial. Kebijakan yang paling tepat adalah...", "o": ["Membatasi pendatang agar tidak membuka usaha di wilayah tersebut", "Mengutamakan penduduk lokal dalam semua kesempatan ekonomi tanpa mempertimbangkan kompetensi", "Membuka forum dialog, memperkuat regulasi yang adil, dan menciptakan program ekonomi yang melibatkan kedua kelompok", "Meminta pendatang meninggalkan wilayah tersebut untuk sementara waktu", "Mengabaikan konflik karena persaingan ekonomi adalah hal biasa dalam masyarakat"], "a": 2, "p": "Nasionalisme dalam kehidupan sosial harus diwujudkan melalui keadilan, persatuan, dan penyelesaian masalah secara bijak. Konflik antara penduduk lokal dan pendatang tidak boleh diselesaikan dengan diskriminasi.<br>Opsi C paling tepat karena menggabungkan dialog, keadilan regulasi, dan solusi ekonomi yang inklusif. Opsi A, B, dan D berpotensi diskriminatif. Opsi E tidak tepat karena membiarkan konflik dapat memperburuk keadaan.", "fx": 1, "src": 1}, {"s": "TWK", "t": "nasionalisme", "q": "Seorang siswa mendapat beasiswa ke luar negeri. Di sana, ia sering ditanya tentang berbagai persoalan di Indonesia. Sikap yang paling menunjukkan nasionalisme dewasa adalah...", "o": ["Menyatakan bahwa Indonesia tidak memiliki masalah agar citra negara selalu terlihat baik", "Mengkritik Indonesia secara berlebihan agar dianggap objektif oleh teman-teman internasional", "Menjelaskan keunggulan dan tantangan Indonesia secara seimbang serta menunjukkan optimisme untuk perbaikan", "Menghindari semua pembicaraan tentang Indonesia karena takut salah bicara", "Membandingkan Indonesia secara negatif dengan negara lain agar terlihat kritis"], "a": 2, "p": "Nasionalisme bukan berarti menutup mata terhadap kekurangan negara. Sikap nasionalis yang dewasa adalah mampu mencintai bangsa sambil tetap objektif terhadap tantangan yang ada.<br>Opsi C paling tepat karena menunjukkan kebanggaan, kejujuran, dan optimisme. Opsi A tidak objektif. Opsi B dan E cenderung merendahkan bangsa sendiri. Opsi D menunjukkan sikap pasif dan tidak percaya diri.", "fx": 1, "src": 1}, {"s": "TWK", "t": "nasionalisme", "q": "Di sebuah perusahaan, beberapa karyawan dari daerah berbeda sering menggunakan bahasa daerah masing-masing saat rapat bersama. Akibatnya, sebagian peserta rapat merasa tidak dilibatkan. Sikap yang paling sesuai dengan semangat nasionalisme adalah...", "o": ["Melarang semua penggunaan bahasa daerah di lingkungan kerja", "Menggunakan bahasa Indonesia dalam forum bersama agar semua peserta dapat memahami pembahasan", "Membiarkan setiap kelompok menggunakan bahasa daerahnya masing-masing karena itu bagian dari budaya", "Meminta kelompok minoritas menyesuaikan diri dengan bahasa daerah mayoritas", "Menghindari rapat bersama agar tidak terjadi kesalahpahaman bahasa"], "a": 1, "p": "Bahasa Indonesia berfungsi sebagai bahasa persatuan. Dalam forum bersama yang melibatkan orang dari latar belakang berbeda, penggunaan bahasa Indonesia membantu menciptakan komunikasi yang setara dan inklusif.<br>Opsi B paling tepat karena tidak menghapus keberadaan bahasa daerah, tetapi menempatkan bahasa Indonesia sebagai alat pemersatu. Opsi A terlalu ekstrem. Opsi C dapat membuat sebagian orang tersisih. Opsi D diskriminatif. Opsi E tidak menyelesaikan masalah.", "fx": 1, "src": 1}, {"s": "TWK", "t": "nasionalisme", "q": "Sebuah kelompok masyarakat menolak pembangunan fasilitas umum karena menganggap manfaatnya lebih besar bagi warga dari kelompok lain. Padahal fasilitas tersebut dibutuhkan untuk pelayanan publik seluruh warga. Sikap pemerintah yang paling mencerminkan nasionalisme adalah...", "o": ["Mengabaikan penolakan masyarakat karena pembangunan harus terus berjalan", "Menghentikan pembangunan agar tidak memicu konflik sosial", "Menjelaskan manfaat fasilitas secara terbuka, membuka ruang dialog, dan memastikan akses yang adil bagi semua warga", "Memindahkan fasilitas ke wilayah kelompok yang mendukung pemerintah", "Memberi bantuan hanya kepada kelompok yang menyetujui pembangunan"], "a": 2, "p": "Nasionalisme dalam pelayanan publik harus mengutamakan kepentingan bersama, keadilan, dan persatuan. Pemerintah perlu memastikan kebijakan dipahami masyarakat dan tidak menimbulkan rasa dikucilkan.<br>Opsi C paling tepat karena menggabungkan transparansi, dialog, dan prinsip keadilan. Opsi A terlalu memaksa. Opsi B mengorbankan kepentingan publik. Opsi D dan E menunjukkan keberpihakan yang tidak adil.<br>Kalau kamu ingin belajar lebih terarah, buka juga materi belajar CPNS untuk memahami dasar TWK, TIU, dan TKP sebelum masuk ke latihan soal yang lebih menantang.", "fx": 1, "src": 1}, {"s": "TWK", "t": "nasionalisme", "q": "Seorang warga menemukan berita palsu yang menyebutkan bahwa kelompok tertentu ingin memisahkan diri dari Indonesia. Berita tersebut belum jelas sumbernya, tetapi sudah menyebar luas di grup keluarga. Sikap yang paling tepat adalah...", "o": ["Langsung menyebarkan berita tersebut agar masyarakat waspada", "Membalas dengan berita lain yang menyerang kelompok tersebut", "Mengecek kebenaran informasi melalui sumber resmi sebelum merespons atau membagikannya", "Menghapus semua anggota grup yang membagikan berita tersebut", "Mengabaikan berita itu karena hoaks tidak berdampak besar pada persatuan"], "a": 2, "p": "Hoaks dapat menjadi ancaman bagi persatuan bangsa. Sikap nasionalis di era digital adalah tidak mudah terprovokasi dan tidak ikut menyebarkan informasi yang belum terverifikasi.<br>Opsi C paling tepat karena mengutamakan kehati-hatian dan tanggung jawab digital. Opsi A dan B justru memperluas potensi konflik. Opsi D terlalu reaktif. Opsi E kurang tepat karena hoaks dapat memengaruhi opini publik dan merusak persatuan.", "fx": 1, "src": 1}, {"s": "TWK", "t": "nasionalisme", "q": "Dalam sebuah lomba internasional, seorang atlet Indonesia gagal meraih medali. Sebagian netizen menghina atlet tersebut karena dianggap mempermalukan negara. Sikap yang paling mencerminkan nasionalisme adalah...", "o": ["Ikut mengkritik atlet tersebut agar ia termotivasi untuk lebih keras berlatih", "Memberi dukungan secara wajar dan mendorong evaluasi tanpa merendahkan perjuangannya", "Menyalahkan pelatih dan pemerintah karena kegagalan atlet pasti berasal dari sistem", "Menganggap atlet tersebut tidak layak mewakili negara lagi", "Membandingkan atlet Indonesia dengan atlet negara lain secara merendahkan"], "a": 1, "p": "Nasionalisme juga tercermin dari cara menghargai warga negara yang berjuang membawa nama bangsa. Kritik boleh diberikan, tetapi harus tetap proporsional dan membangun.<br>Opsi B paling tepat karena mendukung evaluasi tanpa merendahkan martabat atlet. Opsi A, D, dan E cenderung menjatuhkan. Opsi C terlalu menyederhanakan masalah dengan menyalahkan pihak tertentu.", "fx": 1, "src": 1}, {"s": "TWK", "t": "nasionalisme", "q": "Sebuah komunitas anak muda ingin memperingati Hari Kemerdekaan dengan kegiatan yang relevan bagi generasi sekarang. Kegiatan yang paling mencerminkan nasionalisme aktif adalah...", "o": ["Mengadakan lomba hiburan tanpa pesan kebangsaan agar lebih ramai peserta", "Membuat kampanye digital tentang sejarah perjuangan bangsa dan aksi sosial untuk masyarakat sekitar", "Mengadakan acara tertutup hanya untuk anggota komunitas agar lebih mudah dikelola", "Memasang bendera sebanyak mungkin tanpa kegiatan edukatif", "Mengadakan debat politik yang menonjolkan keunggulan satu kelompok"], "a": 1, "p": "Nasionalisme aktif tidak hanya ditunjukkan lewat simbol, tetapi juga lewat kegiatan yang memberi manfaat dan memperkuat kesadaran kebangsaan.<br>Opsi B paling tepat karena menggabungkan edukasi sejarah, pemanfaatan teknologi, dan kepedulian sosial. Opsi A kurang memiliki nilai kebangsaan. Opsi C terlalu terbatas. Opsi D hanya simbolik. Opsi E berisiko memecah persatuan jika tidak dikelola dengan baik.", "fx": 1, "src": 1}, {"s": "TWK", "t": "integritas", "q": "Seorang pegawai menerima hadiah mahal dari rekanan setelah membantu mempercepat proses administrasi sebuah proyek. Rekanan tersebut mengatakan hadiah itu hanya bentuk terima kasih dan tidak perlu dilaporkan. Sikap yang paling menunjukkan integritas adalah...", "o": ["Menerima hadiah karena pekerjaan sudah selesai dan tidak memengaruhi keputusan berikutnya", "Menolak atau melaporkan hadiah tersebut sesuai aturan karena berpotensi menimbulkan konflik kepentingan", "Menerima hadiah asal tidak diketahui oleh atasan langsung", "Membagi hadiah dengan rekan kerja agar tidak dianggap menikmati sendiri", "Menunda penerimaan hadiah sampai proyek benar-benar selesai"], "a": 1, "p": "Integritas berarti menjaga kejujuran, tanggung jawab, dan kepatuhan terhadap aturan, terutama saat berhadapan dengan potensi konflik kepentingan.<br>Opsi B paling tepat karena hadiah dari rekanan dapat memengaruhi objektivitas atau menimbulkan kesan tidak netral. Opsi A, C, D, dan E tetap bermasalah karena tidak menghilangkan potensi pelanggaran etika.", "fx": 1, "src": 1}, {"s": "TWK", "t": "integritas", "q": "Walikota Rina dikenal sebagai pemimpin yang konsisten menolak suap dari pengembang properti dan tetap berpegang pada rencana tata kota, meski menghadapi tekanan dari berbagai pihak. Dalam konteks pemerintahan yang bersih, nilai integritas yang paling tepat diteladani dari sikap Walikota Rina adalah...", "o": ["Menunjukkan sikap keras dan tidak mau berunding dengan semua pihak untuk membuktikan ketegasan", "Membuat keputusan secara sepihak tanpa mempertimbangkan masukan dari berbagai pemangku kepentingan", "Menjaga prinsip dan kepentingan masyarakat dengan menolak godaan yang dapat merugikan publik", "Mengutamakan kepentingan kelompok tertentu untuk menjamin dukungan politik jangka panjang", "Bersikap konfrontatif dan agresif dalam menghadapi pihak yang berbeda pendapat"], "a": 2, "p": "Integritas dalam pemerintahan berarti konsisten memegang prinsip, menolak penyalahgunaan wewenang, dan mengutamakan kepentingan publik.<br>Opsi C paling tepat karena menunjukkan sikap jujur dan bertanggung jawab meskipun ada tekanan. Opsi A dan E terlalu menekankan sikap keras, bukan integritas. Opsi B mengabaikan partisipasi. Opsi D bertentangan dengan kepentingan publik.", "fx": 1, "src": 1}, {"s": "TWK", "t": "integritas", "q": "Seorang ASN mengetahui bahwa temannya sering pulang lebih cepat, tetapi tetap mengisi daftar hadir seolah bekerja penuh. Ketika ditegur, temannya meminta agar hal itu tidak dilaporkan karena mereka sudah lama berteman. Sikap yang paling tepat adalah...", "o": ["Membiarkan karena hubungan pertemanan lebih penting daripada masalah kecil", "Menasihati teman tersebut dan mendorongnya memperbaiki perilaku, serta melaporkan sesuai prosedur jika pelanggaran terus terjadi", "Langsung menyebarkan pelanggaran tersebut ke grup kantor agar menjadi pelajaran bagi semua pegawai", "Ikut melakukan hal yang sama karena aturan absensi ternyata mudah diakali", "Menutupi pelanggaran karena tidak merugikan masyarakat secara langsung"], "a": 1, "p": "Integritas menuntut seseorang untuk jujur dan tidak membiarkan pelanggaran, meskipun dilakukan oleh orang dekat. Namun, cara menanganinya tetap harus etis dan sesuai prosedur.<br>Opsi B paling tepat karena menggabungkan pendekatan pembinaan dan tanggung jawab terhadap aturan. Opsi A dan E menunjukkan pembiaran. Opsi C tidak etis karena mempermalukan tanpa prosedur. Opsi D jelas melanggar integritas.", "fx": 1, "src": 1}, {"s": "TWK", "t": "integritas", "q": "Dalam proses pengadaan barang, seorang pejabat mendapat tekanan dari atasannya untuk memenangkan perusahaan tertentu, meskipun perusahaan lain memiliki penawaran lebih baik dan memenuhi syarat. Sikap yang paling menunjukkan integritas adalah...", "o": ["Mengikuti arahan atasan karena loyalitas kepada pimpinan adalah hal utama", "Meminta perusahaan yang diarahkan atasan memperbaiki dokumen agar terlihat memenuhi syarat", "Tetap menjalankan proses sesuai aturan, mendokumentasikan tekanan yang terjadi, dan melaporkannya melalui mekanisme yang tepat", "Mengundurkan diri dari panitia tanpa memberi penjelasan agar tidak terlibat masalah", "Menunda proses pengadaan sampai tekanan dari atasan berkurang"], "a": 2, "p": "Integritas menuntut pejabat publik untuk menjalankan tugas secara objektif dan sesuai aturan, meskipun ada tekanan dari pihak tertentu.<br>Opsi C paling tepat karena menjaga prosedur, mendokumentasikan masalah, dan menggunakan mekanisme pelaporan yang benar. Opsi A dan B melanggar prinsip keadilan. Opsi D menghindari tanggung jawab. Opsi E tidak menyelesaikan akar persoalan.", "fx": 1, "src": 1}, {"s": "TWK", "t": "integritas", "q": "Seorang pegawai diminta membuat laporan capaian program. Ia menemukan bahwa beberapa data belum mencapai target, tetapi atasannya meminta agar angka tersebut “dibuat lebih baik” agar laporan terlihat sukses. Sikap yang paling tepat adalah...", "o": ["Mengubah angka sesuai arahan atasan karena laporan hanya untuk kepentingan internal", "Menolak memanipulasi data dan menyampaikan kondisi sebenarnya disertai analisis penyebab serta rekomendasi perbaikan", "Menghapus bagian data yang belum mencapai target agar laporan terlihat netral", "Membuat dua versi laporan, satu untuk atasan dan satu untuk arsip pribadi", "Menyalahkan tim pelaksana agar dirinya tidak dianggap bertanggung jawab"], "a": 1, "p": "Integritas berkaitan erat dengan kejujuran dalam menyajikan informasi. Data yang tidak sesuai target bukan alasan untuk dimanipulasi, tetapi harus dijadikan dasar evaluasi.<br>Opsi B paling tepat karena tetap jujur, objektif, dan menawarkan solusi. Opsi A, C, dan D adalah bentuk manipulasi data. Opsi E tidak bertanggung jawab.", "fx": 1, "src": 1}, {"s": "TWK", "t": "integritas", "q": "Seorang calon ASN memiliki kerabat yang bekerja di instansi tujuan. Kerabat tersebut menawarkan bantuan untuk “mempermudah” proses seleksi dengan meminta sejumlah uang kepada pihak tertentu. Sikap yang paling sesuai dengan integritas adalah...", "o": ["Menerima bantuan karena peluang menjadi ASN sangat sulit", "Menolak tawaran tersebut dan mengikuti seluruh proses seleksi secara jujur", "Menerima bantuan selama tidak ada bukti tertulis", "Menanyakan dulu apakah bantuan itu benar-benar menjamin kelulusan", "Mengajak teman lain ikut menggunakan jalur tersebut agar biaya lebih ringan"], "a": 1, "p": "Integritas dalam seleksi CPNS berarti mengikuti proses secara jujur, adil, dan tidak menggunakan jalur tidak sah. Tawaran “mempermudah” seleksi dengan uang merupakan bentuk penyimpangan.<br>Opsi B paling tepat karena menolak praktik yang bertentangan dengan kejujuran dan keadilan. Opsi A, C, D, dan E menunjukkan penerimaan terhadap praktik tidak etis.", "fx": 1, "src": 1}, {"s": "TWK", "t": "integritas", "q": "Seorang pegawai menemukan kesalahan dalam dokumen kebijakan yang sudah hampir ditandatangani pimpinan. Jika kesalahan itu dilaporkan, proses bisa tertunda. Namun jika dibiarkan, masyarakat dapat dirugikan. Sikap yang paling tepat adalah...", "o": ["Membiarkan karena dokumen sudah hampir selesai dan perubahan akan menghambat pekerjaan", "Melaporkan kesalahan tersebut kepada pihak terkait dan memberi alternatif perbaikan secepat mungkin", "Mengubah dokumen diam-diam tanpa memberi tahu siapa pun", "Menunggu sampai kebijakan diterapkan lalu mengevaluasi dampaknya", "Menyalahkan penyusun awal agar dirinya tidak dianggap ikut bertanggung jawab"], "a": 1, "p": "Integritas tidak hanya berarti jujur, tetapi juga berani menyampaikan masalah demi mencegah kerugian publik. Keterlambatan kecil lebih baik daripada kebijakan yang keliru dan merugikan masyarakat.<br>Opsi B paling tepat karena bertanggung jawab dan menawarkan solusi. Opsi A dan D berisiko merugikan publik. Opsi C tidak transparan. Opsi E tidak menunjukkan tanggung jawab.", "fx": 1, "src": 1}, {"s": "TWK", "t": "integritas", "q": "Seorang pegawai bertugas menyeleksi penerima bantuan sosial. Ia menemukan ada nama keluarganya dalam daftar calon penerima, padahal kondisi ekonomi keluarganya tidak memenuhi kriteria. Sikap yang paling menunjukkan integritas adalah...", "o": ["Membiarkan nama tersebut karena keluarganya juga warga negara yang berhak dibantu", "Menghapus semua nama keluarga dari daftar agar tidak dicurigai", "Melaporkan potensi konflik kepentingan dan memastikan proses seleksi dilakukan berdasarkan kriteria yang objektif", "Meminta anggota keluarga menerima bantuan lalu mengembalikannya secara pribadi", "Mengganti nama penerima dengan kerabat lain yang lebih membutuhkan tanpa prosedur resmi"], "a": 2, "p": "Konflik kepentingan harus dikelola secara terbuka dan sesuai prosedur. Integritas menuntut pegawai tidak menggunakan jabatan untuk menguntungkan keluarga atau kelompok dekat.<br>Opsi C paling tepat karena mengutamakan objektivitas dan transparansi. Opsi A menunjukkan pembiaran konflik kepentingan. Opsi B terlalu ekstrem jika tidak semua keluarga bermasalah. Opsi D dan E tetap tidak sesuai prosedur.", "fx": 1, "src": 1}, {"s": "TWK", "t": "integritas", "q": "Dalam rapat evaluasi, seorang staf mengetahui bahwa program yang ia kelola belum berjalan baik. Namun, ia takut menyampaikan masalah tersebut karena khawatir dianggap gagal oleh atasan. Sikap yang paling mencerminkan integritas adalah...", "o": ["Menyampaikan kondisi program secara jujur beserta penyebab dan rencana perbaikan", "Menyampaikan hanya bagian yang berhasil agar laporan tetap terlihat positif", "Menunggu atasan menemukan sendiri masalah tersebut", "Menyalahkan pihak luar agar tidak terlihat bertanggung jawab", "Menghindari rapat evaluasi agar tidak perlu memberi penjelasan"], "a": 0, "p": "Integritas berarti berani menyampaikan keadaan sebenarnya, termasuk ketika hasil belum sesuai harapan. Kejujuran dalam evaluasi diperlukan agar perbaikan bisa dilakukan.<br>Opsi A paling tepat karena tidak hanya jujur, tetapi juga bertanggung jawab dengan memberikan rencana perbaikan. Opsi B, C, D, dan E menghindari tanggung jawab dan dapat menghambat perbaikan program.", "fx": 1, "src": 1}, {"s": "TWK", "t": "integritas", "q": "Seorang pejabat publik selalu menyampaikan komitmen antikorupsi dalam pidato, tetapi dalam praktiknya ia memberi fasilitas khusus kepada kerabatnya dalam proyek pemerintah. Perilaku tersebut bertentangan dengan nilai integritas karena...", "o": ["Pejabat publik seharusnya tidak memiliki hubungan keluarga dengan pihak swasta", "Integritas menuntut kesesuaian antara ucapan, tindakan, dan kepatuhan pada aturan", "Komitmen antikorupsi cukup ditunjukkan melalui pidato kepada masyarakat", "Kerabat pejabat tidak boleh mengikuti proyek pemerintah dalam kondisi apa pun", "Pemberian fasilitas khusus boleh dilakukan jika proyek tetap selesai tepat waktu"], "a": 1, "p": "Integritas berarti adanya konsistensi antara nilai yang diucapkan dan tindakan yang dilakukan. Jika seseorang menyatakan antikorupsi tetapi memberi perlakuan khusus kepada kerabat, maka ia melanggar prinsip kejujuran, keadilan, dan profesionalisme.<br>Opsi B paling tepat karena menjelaskan inti integritas. Opsi A dan D terlalu mutlak. Opsi C keliru karena integritas harus dibuktikan lewat tindakan. Opsi E tetap membenarkan perlakuan tidak adil.", "fx": 1, "src": 1}, {"s": "TWK", "t": "belanegara", "q": "Media internasional memberitakan kebakaran hutan besar di beberapa wilayah Indonesia. Beberapa negara menyampaikan kritik tentang penanganan bencana yang dianggap lambat dan sistem pencegahan yang kurang memadai. Sebagai warga negara, sikap yang paling tepat dalam menanggapi situasi ini adalah...", "o": ["Menunjukkan bukti upaya pemadaman dan pencegahan yang telah dilakukan, sambil menerima masukan konstruktif dari negara lain untuk perbaikan sistem ke depan", "Membantah semua kritik karena negara lain tidak memahami kondisi geografis dan cuaca ekstrem di Indonesia", "Menyalahkan perusahaan asing yang beroperasi di Indonesia sebagai penyebab utama kebakaran hutan", "Mengabaikan pemberitaan media asing karena penanganan bencana adalah urusan internal negara", "Menganggap kebakaran hutan sebagai kejadian alami yang wajar terjadi di musim kemarau"], "a": 0, "p": "Bela negara tidak selalu berarti membela negara dengan cara menolak semua kritik. Dalam konteks modern, bela negara juga berarti menjaga martabat bangsa dengan sikap objektif, bertanggung jawab, dan terbuka terhadap perbaikan.<br>Opsi A paling tepat karena menunjukkan sikap membela negara secara dewasa: menjelaskan upaya yang sudah dilakukan, tetapi tetap menerima kritik yang membangun. Opsi B terlalu defensif. Opsi C menyalahkan pihak lain tanpa dasar. Opsi D mengabaikan tanggung jawab global. Opsi E menyederhanakan masalah.", "fx": 1, "src": 1}, {"s": "TWK", "t": "belanegara", "q": "Sebuah akun media sosial menyebarkan informasi palsu bahwa pemerintah akan menghapus salah satu hak dasar warga negara. Informasi tersebut memicu keresahan dan kemarahan publik. Sikap bela negara yang paling tepat dilakukan oleh warga adalah...", "o": ["Membagikan informasi tersebut agar semua orang ikut waspada", "Membuat unggahan tandingan yang menyerang kelompok penyebar informasi", "Memeriksa kebenaran informasi melalui sumber resmi sebelum menyebarkan atau menanggapinya", "Mengabaikan karena informasi di media sosial tidak berpengaruh pada stabilitas negara", "Menuduh semua pihak yang menyebarkan informasi sebagai musuh negara"], "a": 2, "p": "Hoaks dapat menjadi ancaman nonmiliter karena mampu memecah kepercayaan publik dan menimbulkan keresahan sosial. Sikap bela negara di era digital adalah tidak mudah terprovokasi dan tidak ikut memperluas informasi yang belum jelas kebenarannya. Opsi C paling tepat karena mengutamakan verifikasi. Opsi A memperluas hoaks. Opsi B memperkeruh konflik. Opsi D meremehkan dampak disinformasi. Opsi E terlalu reaktif dan tidak proporsional.", "fx": 1, "src": 1}, {"s": "TWK", "t": "belanegara", "q": "Seorang mahasiswa Indonesia yang belajar di luar negeri melihat temannya menyampaikan informasi keliru tentang kondisi sosial di Indonesia. Informasi tersebut membuat Indonesia terlihat buruk dan tidak sesuai fakta. Sikap paling tepat adalah...", "o": ["Membalas dengan emosi karena temannya telah menghina Indonesia", "Menjelaskan fakta secara sopan, menyampaikan konteks yang benar, dan tetap membuka ruang diskusi", "Menghindari pembicaraan agar tidak memperpanjang masalah", "Menyebarkan keburukan negara temannya sebagai balasan", "Melaporkan temannya kepada pihak kampus agar mendapat sanksi"], "a": 1, "p": "Bela negara dapat dilakukan dengan meluruskan informasi yang keliru secara santun dan berbasis fakta. Membela nama baik bangsa tidak harus dilakukan dengan kemarahan atau serangan balik. Opsi B paling tepat karena menunjukkan sikap percaya diri, objektif, dan tetap menghormati diskusi. Opsi A dan D emosional. Opsi C pasif. Opsi E terlalu berlebihan jika masalah masih bisa diselesaikan melalui dialog.", "fx": 1, "src": 1}, {"s": "TWK", "t": "belanegara", "q": "Di sebuah wilayah rawan banjir, sebagian warga masih membuang sampah ke sungai meskipun sudah sering terjadi banjir. Sikap yang paling mencerminkan bela negara dalam kehidupan sehari-hari adalah...", "o": ["Menunggu pemerintah membersihkan sungai karena itu tugas aparat", "Mengajak warga menjaga kebersihan lingkungan, mengikuti kerja bakti, dan mendukung aturan pengelolaan sampah", "Menyalahkan warga lain yang dianggap paling banyak membuang sampah", "Membiarkan karena banjir adalah urusan alam dan cuaca", "Memindahkan sampah ke wilayah lain agar lingkungan sendiri terlihat bersih"], "a": 1, "p": "Bela negara juga bisa diwujudkan melalui kepedulian terhadap lingkungan dan keselamatan masyarakat. Menjaga lingkungan berarti ikut menjaga ketahanan wilayah dari bencana. Opsi B paling tepat karena menunjukkan partisipasi aktif, tanggung jawab, dan kepedulian sosial. Opsi A terlalu pasif. Opsi C hanya menyalahkan. Opsi D mengabaikan peran manusia. Opsi E tidak bertanggung jawab.", "fx": 1, "src": 1}, {"s": "TWK", "t": "belanegara", "q": "Sebuah perusahaan teknologi asing menawarkan aplikasi gratis kepada masyarakat, tetapi aplikasi tersebut meminta akses data pribadi secara berlebihan. Sebagai warga negara yang sadar bela negara di era digital, sikap yang paling tepat adalah...", "o": ["Menggunakan aplikasi tersebut karena gratis dan populer", "Menolak semua teknologi asing karena pasti membahayakan negara", "Membaca kebijakan privasi, membatasi akses data, dan menggunakan layanan digital secara bijak", "Membagikan data palsu agar aplikasi tidak mendapat data asli", "Mengajak semua orang memboikot teknologi digital"], "a": 2, "p": "Bela negara di era digital berkaitan dengan kesadaran menjaga data pribadi dan keamanan informasi. Data warga dapat menjadi aset penting yang perlu dilindungi.<br>Opsi C paling tepat karena menunjukkan sikap kritis dan bijak. Opsi A terlalu mudah percaya. Opsi B dan E ekstrem. Opsi D bukan solusi yang etis dan tidak menyelesaikan masalah keamanan digital.", "fx": 1, "src": 1}, {"s": "TWK", "t": "belanegara", "q": "Ketika terjadi bencana gempa bumi di daerah lain, seorang warga ingin membantu tetapi tidak bisa datang langsung ke lokasi. Sikap bela negara yang paling tepat adalah...", "o": ["Tidak perlu membantu karena bantuan hanya berguna jika datang langsung ke lokasi", "Menyebarkan semua informasi donasi yang ditemukan agar bantuan cepat terkumpul", "Menyalurkan bantuan melalui lembaga terpercaya dan menyebarkan informasi yang sudah terverifikasi", "Mengkritik pemerintah karena bencana seharusnya bisa dicegah sepenuhnya", "Menunggu viral di media sosial sebelum memutuskan membantu"], "a": 2, "p": "Bela negara dapat diwujudkan melalui solidaritas terhadap sesama warga negara, termasuk saat bencana. Bantuan tidak harus selalu hadir langsung di lokasi, tetapi harus disalurkan dengan cara yang tepat. Opsi C paling tepat karena menggabungkan kepedulian dan kehati-hatian. Opsi A terlalu pasif. Opsi B berisiko menyebarkan informasi palsu. Opsi D tidak membantu korban secara langsung. Opsi E menunjukkan kepedulian yang bergantung pada tren.", "fx": 1, "src": 1}, {"s": "TWK", "t": "belanegara", "q": "Seorang warga mengetahui adanya ajakan di media sosial untuk menolak semua kebijakan pemerintah tanpa membaca isi kebijakan tersebut. Ajakan itu memakai narasi provokatif dan menyebut siapa pun yang berbeda pendapat sebagai pengkhianat. Sikap paling tepat adalah...", "o": ["Mengikuti ajakan tersebut karena kritik kepada pemerintah selalu benar", "Menolak semua kritik karena kritik dapat melemahkan negara", "Membaca isi kebijakan, menilai secara objektif, dan menyampaikan kritik secara bertanggung jawab jika diperlukan", "Membalas narasi provokatif dengan hinaan yang lebih keras", "Menghindari semua pembahasan kebijakan publik agar tidak terlibat konflik"], "a": 2, "p": "Bela negara tidak berarti selalu setuju dengan pemerintah, tetapi juga tidak berarti menolak semua kebijakan tanpa dasar. Kritik yang bertanggung jawab adalah bagian dari partisipasi warga negara. Opsi C paling tepat karena mengedepankan penilaian objektif dan cara menyampaikan kritik yang sehat. Opsi A dan B terlalu ekstrem. Opsi D memperkeruh situasi. Opsi E pasif terhadap kehidupan berbangsa.", "fx": 1, "src": 1}, {"s": "TWK", "t": "belanegara", "q": "Sebuah komunitas pemuda ingin berkontribusi dalam menjaga ketahanan pangan di wilayahnya. Program yang paling mencerminkan bela negara adalah...", "o": ["Membuat konten kritik tanpa menawarkan solusi nyata", "Mengadakan pelatihan urban farming, mengelola lahan kosong, dan bekerja sama dengan warga sekitar", "Menunggu bantuan pemerintah karena ketahanan pangan adalah urusan negara", "Membeli semua bahan pangan impor karena kualitasnya lebih baik", "Mengadakan kegiatan seremonial tanpa tindak lanjut"], "a": 1, "p": "Bela negara dapat dilakukan melalui kontribusi nyata dalam memperkuat ketahanan masyarakat, termasuk ketahanan pangan. Kegiatan produktif yang melibatkan warga menunjukkan kepedulian terhadap kepentingan bersama.<br>Opsi B paling tepat karena aktif, solutif, dan melibatkan masyarakat. Opsi A hanya kritik tanpa aksi. Opsi C pasif. Opsi D tidak relevan dengan penguatan ketahanan lokal. Opsi E hanya simbolik.", "fx": 1, "src": 1}, {"s": "TWK", "t": "belanegara", "q": "Seorang pegawai negeri menemukan adanya celah keamanan pada sistem layanan publik digital yang dapat membahayakan data masyarakat. Sikap bela negara yang paling tepat adalah...", "o": ["Mengabaikan karena bukan bagian dari tugas utamanya", "Menyebarkan celah tersebut di media sosial agar cepat diperbaiki", "Melaporkan temuan melalui jalur resmi dan membantu proses perbaikan sesuai kewenangan", "Memanfaatkan celah tersebut untuk membuktikan sistem lemah", "Menyalahkan tim teknologi informasi tanpa memberikan bukti"], "a": 2, "p": "Keamanan sistem layanan publik berkaitan dengan perlindungan data dan kepercayaan masyarakat. Bela negara dalam konteks ini berarti menjaga keamanan informasi negara dan warga.<br>Opsi C paling tepat karena mengikuti prosedur dan membantu perbaikan. Opsi A pasif. Opsi B berbahaya karena bisa membuka celah bagi pihak tidak bertanggung jawab. Opsi D melanggar etika. Opsi E tidak solutif.", "fx": 1, "src": 1}, {"s": "TWK", "t": "belanegara", "q": "Dalam sebuah diskusi publik, ada peserta yang menyatakan bahwa mencintai negara berarti tidak boleh mengkritik pemerintah. Pernyataan yang paling tepat untuk menanggapi pandangan tersebut adalah...", "o": ["Benar, karena kritik hanya akan melemahkan wibawa negara", "Salah, karena warga negara boleh mengkritik secara bertanggung jawab demi perbaikan kehidupan berbangsa", "Benar, karena pemerintah selalu mengetahui hal terbaik bagi rakyat", "Salah, karena warga negara sebaiknya menolak semua kebijakan pemerintah", "Benar, karena stabilitas lebih penting daripada kebebasan berpendapat"], "a": 1, "p": "Cinta tanah air tidak identik dengan sikap membenarkan semua kebijakan. Kritik yang disampaikan secara bertanggung jawab, berbasis fakta, dan sesuai hukum justru dapat menjadi bentuk kepedulian terhadap negara.<br>Opsi B paling tepat karena menempatkan kritik sebagai bagian dari partisipasi warga negara. Opsi A, C, dan E terlalu membatasi ruang demokrasi. Opsi D terlalu ekstrem karena menolak semua kebijakan tanpa penilaian objektif.", "fx": 1, "src": 1}, {"s": "TWK", "t": "pilar", "q": "Dalam menjalankan fungsinya sebagai panduan moral bangsa, Pancasila berperan sebagai landasan etis yang mengarahkan perilaku dan kebijakan nasional. Manakah di antara berikut yang paling mencerminkan penerapan Pancasila sebagai landasan etika berbangsa?", "o": ["Menegakkan aturan dan sanksi yang keras untuk memastikan kepatuhan masyarakat pada nilai-nilai nasional", "Memasukkan prinsip-prinsip Pancasila ke dalam setiap kebijakan pemerintahan untuk menjamin keadilan dan kemanusiaan", "Menerapkan nilai-nilai budaya leluhur secara kaku tanpa penyesuaian dengan perkembangan zaman", "Memberikan keleluasaan pada pemerintah untuk mengambil kebijakan praktis tanpa terikat pertimbangan moral", "Mengutamakan pencapaian target pembangunan meskipun harus mengompromikan beberapa nilai etika"], "a": 1, "p": "Pancasila sebagai landasan etika berbangsa berarti nilai-nilainya menjadi pedoman dalam membuat kebijakan dan bertindak sebagai warga negara. Kebijakan publik seharusnya mencerminkan kemanusiaan, keadilan, persatuan, musyawarah, dan ketuhanan.<br>Opsi B paling tepat karena menjadikan Pancasila sebagai pedoman moral dalam pemerintahan. Opsi A hanya menekankan sanksi. Opsi C terlalu kaku. Opsi D dan E justru mengabaikan pertimbangan etis.", "fx": 1, "src": 1}, {"s": "TWK", "t": "pilar", "q": "Sebuah kebijakan pembangunan jalan akan menggusur sebagian permukiman warga. Pemerintah tetap membutuhkan pembangunan tersebut, tetapi warga meminta kejelasan ganti rugi dan relokasi. Sikap yang paling sesuai dengan nilai Pancasila adalah...", "o": ["Melanjutkan pembangunan tanpa dialog karena kepentingan umum harus diutamakan", "Menghentikan seluruh pembangunan karena ada warga yang menolak", "Melakukan musyawarah, memberi informasi terbuka, dan memastikan ganti rugi serta relokasi dilakukan secara adil", "Meminta aparat membubarkan warga yang menolak agar proses cepat selesai", "Memberi ganti rugi hanya kepada warga yang mendukung kebijakan pemerintah"], "a": 2, "p": "Pancasila mengajarkan keseimbangan antara kepentingan umum dan keadilan bagi warga. Pembangunan tidak boleh mengabaikan hak masyarakat yang terdampak.<br>Opsi C paling tepat karena menggabungkan musyawarah, transparansi, dan keadilan sosial. Opsi A terlalu memaksa. Opsi B mengabaikan kebutuhan publik. Opsi D represif. Opsi E diskriminatif.", "fx": 1, "src": 1}, {"s": "TWK", "t": "pilar", "q": "Dalam sidang organisasi, terjadi perbedaan pendapat tajam antara dua kelompok. Ketua rapat ingin mengambil keputusan yang sesuai dengan prinsip demokrasi Pancasila. Langkah yang paling tepat adalah...", "o": ["Memilih pendapat kelompok mayoritas tanpa perlu mendengar kelompok lain", "Mengambil keputusan sendiri agar rapat cepat selesai", "Mengutamakan musyawarah untuk mencapai mufakat, lalu menggunakan pemungutan suara jika mufakat tidak tercapai", "Menunda semua keputusan sampai tidak ada lagi perbedaan pendapat", "Mengikuti pendapat kelompok yang paling berpengaruh dalam organisasi"], "a": 2, "p": "Demokrasi Pancasila menekankan musyawarah untuk mufakat. Namun, jika mufakat tidak tercapai, pemungutan suara dapat menjadi jalan yang sah selama dilakukan dengan adil dan menghormati semua pihak.<br>Opsi C paling tepat karena sesuai prinsip musyawarah dan demokrasi. Opsi A mengabaikan suara minoritas. Opsi B otoriter. Opsi D tidak menyelesaikan masalah. Opsi E tidak adil.<br>Kalau kamu masih sering bingung membedakan opsi yang “baik” dan yang “paling tepat”, pelajari dulu materi belajar CPNS agar dasar TWK, TIU, dan TKP kamu lebih kuat sebelum lanjut ke soal yang lebih sulit.", "fx": 1, "src": 1}, {"s": "TWK", "t": "pilar", "q": "Seorang pejabat daerah membuat kebijakan bantuan pendidikan hanya untuk kelompok tertentu yang mendukungnya saat pemilihan. Kebijakan tersebut bertentangan dengan Pancasila karena...", "o": ["Pendidikan seharusnya hanya diberikan kepada warga yang berprestasi", "Bantuan publik harus diberikan berdasarkan kedekatan politik", "Kebijakan publik harus mencerminkan keadilan sosial bagi seluruh rakyat, bukan kepentingan kelompok", "Kepala daerah bebas menentukan penerima bantuan sesuai kehendaknya", "Kelompok pendukung pemerintah harus lebih diutamakan agar stabilitas terjaga"], "a": 2, "p": "Sila kelima Pancasila menekankan keadilan sosial bagi seluruh rakyat Indonesia. Kebijakan publik tidak boleh digunakan untuk kepentingan politik kelompok tertentu.<br>Opsi C paling tepat karena menegaskan prinsip keadilan sosial. Opsi A terlalu sempit. Opsi B, D, dan E membenarkan diskriminasi dan penyalahgunaan kebijakan.", "fx": 1, "src": 1}, {"s": "TWK", "t": "pilar", "q": "Dalam kehidupan berbangsa, Bhinneka Tunggal Ika memiliki peran penting karena...", "o": ["Menyamakan seluruh budaya daerah agar tidak menimbulkan perbedaan", "Menghapus identitas lokal demi memperkuat identitas nasional", "Menyatukan keberagaman suku, agama, ras, dan budaya dalam satu kesatuan bangsa", "Mengutamakan budaya mayoritas sebagai simbol utama bangsa", "Membatasi ekspresi budaya daerah yang berbeda dari budaya nasional"], "a": 2, "p": "Bhinneka Tunggal Ika berarti berbeda-beda tetapi tetap satu. Semboyan ini tidak menghapus keberagaman, melainkan menyatukannya dalam identitas kebangsaan Indonesia.<br>Opsi C paling tepat karena menggambarkan makna persatuan dalam keberagaman. Opsi A, B, D, dan E bertentangan dengan semangat menghargai perbedaan.", "fx": 1, "src": 1}, {"s": "TWK", "t": "pilar", "q": "Seorang warga menolak menaati putusan pengadilan karena merasa putusan tersebut tidak sesuai dengan kepentingan kelompoknya. Sikap yang paling sesuai dengan prinsip negara hukum adalah...", "o": ["Membiarkan penolakan karena setiap kelompok berhak menentukan hukumnya sendiri", "Menghormati putusan hukum dan menempuh upaya hukum yang tersedia jika merasa dirugikan", "Mengabaikan pengadilan karena keadilan ditentukan oleh dukungan masyarakat", "Mengajak massa menekan aparat agar putusan diubah", "Menggunakan kekuatan kelompok untuk membatalkan keputusan secara langsung"], "a": 1, "p": "Indonesia adalah negara hukum. Artinya, penyelesaian masalah harus dilakukan melalui mekanisme hukum, bukan tekanan massa atau kehendak kelompok tertentu.<br>Opsi B paling tepat karena menghormati hukum sekaligus memberi ruang untuk menggunakan upaya hukum yang sah. Opsi A, C, D, dan E bertentangan dengan prinsip negara hukum.", "fx": 1, "src": 1}, {"s": "TWK", "t": "pilar", "q": "Sebuah sekolah memiliki siswa dari berbagai agama. Pihak sekolah ingin membuat aturan kegiatan keagamaan yang sesuai dengan prinsip Pancasila. Kebijakan yang paling tepat adalah...", "o": ["Mewajibkan semua siswa mengikuti kegiatan agama mayoritas agar tercipta kebersamaan", "Menghapus semua kegiatan keagamaan agar tidak ada perbedaan", "Memberikan ruang yang adil bagi setiap siswa untuk menjalankan ibadah sesuai agama dan keyakinannya", "Mengutamakan kegiatan agama tertentu karena jumlah pemeluknya paling banyak", "Melarang simbol keagamaan karena dianggap mengganggu persatuan"], "a": 2, "p": "Sila pertama Pancasila menjamin penghormatan terhadap kehidupan beragama. Dalam masyarakat majemuk, persatuan dibangun dengan saling menghormati, bukan dengan memaksakan keseragaman.<br>Opsi C paling tepat karena menjamin kebebasan beragama secara adil. Opsi A dan D diskriminatif. Opsi B dan E menghilangkan ruang ekspresi beragama secara tidak tepat.", "fx": 1, "src": 1}, {"s": "TWK", "t": "pilar", "q": "Pemerintah membuat program pembangunan ekonomi di wilayah terpencil agar akses pendidikan, kesehatan, dan infrastruktur masyarakat meningkat. Program tersebut paling mencerminkan sila Pancasila yang berbunyi...", "o": ["Ketuhanan Yang Maha Esa", "Kemanusiaan yang adil dan beradab", "Persatuan Indonesia", "Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan", "Keadilan sosial bagi seluruh rakyat Indonesia"], "a": 4, "p": "Program pembangunan yang bertujuan mengurangi kesenjangan dan meningkatkan akses masyarakat di wilayah terpencil mencerminkan keadilan sosial.<br>Opsi E paling tepat karena berhubungan langsung dengan pemerataan kesejahteraan. Opsi lain tetap nilai penting Pancasila, tetapi tidak paling spesifik terhadap konteks pemerataan pembangunan.", "fx": 1, "src": 1}, {"s": "TWK", "t": "pilar", "q": "Dalam sebuah kelompok kerja, keputusan penting diambil hanya oleh ketua tanpa melibatkan anggota. Akibatnya, banyak anggota merasa tidak dihargai. Jika dikaitkan dengan nilai Pancasila, tindakan ketua tersebut paling bertentangan dengan prinsip...", "o": ["Ketuhanan", "Musyawarah", "Persatuan wilayah", "Kemandirian ekonomi", "Kebebasan individu tanpa batas"], "a": 1, "p": "Pancasila menekankan pentingnya musyawarah dalam pengambilan keputusan bersama. Keputusan sepihak dapat mengabaikan aspirasi anggota dan melemahkan rasa kebersamaan.<br>Opsi B paling tepat karena konteks soal berkaitan langsung dengan pengambilan keputusan. Opsi lain tidak menjadi inti persoalan.", "fx": 1, "src": 1}, {"s": "TWK", "t": "pilar", "q": "Dalam konteks kehidupan bernegara, UUD 1945 memiliki kedudukan sebagai...", "o": ["Pedoman moral tidak tertulis yang dapat diubah sesuai keinginan pemerintah", "Hukum dasar tertulis yang menjadi landasan penyelenggaraan negara", "Peraturan teknis yang hanya berlaku bagi lembaga eksekutif", "Dokumen sejarah yang tidak lagi digunakan dalam pemerintahan modern", "Kesepakatan politik sementara yang dapat diabaikan jika tidak sesuai kondisi"], "a": 1, "p": "UUD 1945 merupakan hukum dasar tertulis negara Indonesia. Kedudukannya menjadi landasan utama dalam penyelenggaraan negara dan pembentukan peraturan perundang-undangan.<br>Opsi B paling tepat. Opsi A, C, D, dan E keliru karena merendahkan atau membatasi kedudukan UUD 1945 secara tidak tepat.", "fx": 1, "src": 1}, {"s": "TWK", "t": "pilar", "q": "Sebuah kelompok mengusulkan agar daerah tertentu memisahkan diri karena merasa memiliki budaya dan kepentingan ekonomi yang berbeda. Sikap yang paling sesuai dengan prinsip NKRI adalah...", "o": ["Mendukung pemisahan karena setiap daerah bebas menentukan nasib sendiri tanpa batas", "Menolak dialog dan langsung menganggap semua pihak sebagai musuh negara", "Menjaga keutuhan NKRI sambil membuka ruang dialog untuk menyelesaikan ketidakpuasan secara adil", "Membatasi semua budaya lokal agar tidak berkembang menjadi identitas politik", "Mengabaikan aspirasi daerah karena pemerintah pusat selalu paling tahu kebutuhan masyarakat"], "a": 2, "p": "Prinsip NKRI menekankan keutuhan wilayah Indonesia. Namun, menjaga keutuhan tidak berarti menutup ruang dialog terhadap masalah yang dirasakan masyarakat daerah.<br>Opsi C paling tepat karena menggabungkan komitmen terhadap NKRI dan penyelesaian masalah secara adil. Opsi A bertentangan dengan keutuhan negara. Opsi B terlalu represif. Opsi D menghambat budaya lokal. Opsi E mengabaikan aspirasi masyarakat.", "fx": 1, "src": 1}, {"s": "TWK", "t": "pilar", "q": "Dalam kehidupan sehari-hari, penerapan hak dan kewajiban warga negara yang seimbang ditunjukkan oleh tindakan...", "o": ["Menuntut pelayanan publik yang baik tanpa mau mematuhi aturan", "Membayar pajak tepat waktu dan menggunakan hak untuk mengawasi pelayanan publik", "Mengkritik pemerintah tanpa peduli pada kewajiban sebagai warga negara", "Menghindari kewajiban karena merasa belum mendapat manfaat dari negara", "Menggunakan hak pribadi tanpa mempertimbangkan kepentingan masyarakat"], "a": 1, "p": "Sebagai warga negara, hak dan kewajiban harus berjalan seimbang. Warga berhak mendapat pelayanan dan mengawasi pemerintah, tetapi juga wajib menaati aturan dan memenuhi kewajiban seperti pajak sesuai ketentuan.<br>Opsi B paling tepat karena menunjukkan keseimbangan hak dan kewajiban. Opsi A, C, D, dan E hanya menonjolkan hak atau kepentingan pribadi tanpa tanggung jawab.", "fx": 1, "src": 1}, {"s": "TWK", "t": "bahasa", "q": "Kepulauan Nusa Tenggara menyimpan kekayaan tradisi dari beragam etnis yang mendiaminya. Salah satu kelompok etnis yang hidup di wilayah tersebut ialah suku Sasak. Mereka berkomunikasi sehari-hari menggunakan bahasa Sasak yang unik. Di samping itu, terdapat pula suku Manggarai yang bermukim di bagian barat Pulau Flores dan menuturkan bahasa Manggarai. Meskipun demikian, seluruh warga negara Indonesia tetap menggunakan bahasa Indonesia sebagai bahasa pemersatu bangsa.<br>Manakah penulisan yang tepat sesuai kaidah EYD berdasarkan paragraf di atas?", "o": ["kepulauan nusa tenggara, suku sasak, bahasa sasak, suku manggarai, Pulau flores, bahasa manggarai, bahasa indonesia", "Kepulauan Nusa Tenggara, suku sasak, bahasa Sasak, suku Manggarai, Pulau Flores, bahasa manggarai, bahasa Indonesia", "Kepulauan Nusa Tenggara, suku Sasak, bahasa Sasak, suku Manggarai, Pulau Flores, bahasa Manggarai, bahasa Indonesia", "kepulauan Nusa Tenggara, suku Sasak, bahasa sasak, suku Manggarai, pulau Flores, bahasa Manggarai, Bahasa Indonesia", "Kepulauan nusa tenggara, Suku Sasak, Bahasa Sasak, Suku Manggarai, Pulau flores, Bahasa Manggarai, Bahasa Indonesia"], "a": 2, "p": "Nama geografi seperti Kepulauan Nusa Tenggara dan Pulau Flores ditulis dengan huruf kapital. Nama suku seperti Sasak dan Manggarai juga ditulis kapital. Nama bahasa yang berasal dari nama daerah atau suku, seperti bahasa Sasak dan bahasa Manggarai, menggunakan kapital pada nama bahasanya. Sementara itu, bahasa Indonesia ditulis dengan huruf kecil pada kata “bahasa” dan kapital pada “Indonesia”.<br>Opsi C paling tepat karena seluruh penulisannya sesuai kaidah.", "fx": 1, "src": 1}, {"s": "TWK", "t": "bahasa", "q": "Perhatikan kalimat berikut:<br>“Bahasa Indonesia berperan sebagai alat pemersatu bangsa karena digunakan oleh masyarakat dari berbagai suku dan daerah.”<br>Gagasan utama kalimat tersebut adalah...", "o": ["Bahasa Indonesia hanya digunakan dalam kegiatan resmi pemerintahan", "Bahasa Indonesia menjadi alat pemersatu bangsa", "Masyarakat Indonesia berasal dari satu suku yang sama", "Bahasa daerah tidak memiliki peran dalam kehidupan masyarakat", "Bahasa Indonesia menggantikan seluruh bahasa daerah"], "a": 1, "p": "Gagasan utama adalah inti informasi yang disampaikan kalimat. Kalimat tersebut menekankan peran bahasa Indonesia sebagai alat pemersatu bangsa.<br>Opsi B paling tepat. Opsi A terlalu sempit. Opsi C salah karena Indonesia terdiri dari berbagai suku. Opsi D dan E keliru karena bahasa Indonesia sebagai pemersatu tidak berarti menghapus bahasa daerah.", "fx": 1, "src": 1}, {"s": "TWK", "t": "bahasa", "q": "Perhatikan kalimat berikut:<br>“Para peserta seleksi CPNS harus mempersiapkan dokumen-dokumen yang diperlukan agar tidak mengalami kendala pada saat proses pendaftaran berlangsung.”<br>Kalimat tersebut dapat dibuat lebih efektif menjadi...", "o": ["Para peserta seleksi CPNS harus mempersiapkan dokumen yang diperlukan agar tidak mengalami kendala saat pendaftaran.", "Peserta-peserta seleksi CPNS harus mempersiapkan banyak dokumen-dokumen agar tidak mengalami kendala pada saat proses pendaftaran berlangsung.", "Para peserta seleksi CPNS semuanya harus mempersiapkan dokumen-dokumen yang diperlukan agar tidak terkendala pada saat proses pendaftaran berlangsung.", "Peserta seleksi CPNS harus mempersiapkan dokumen-dokumen yang banyak diperlukan agar proses pendaftaran tidak mengalami kendala berlangsung.", "Para peserta seleksi CPNS harus mempersiapkan segala macam dokumen-dokumen yang diperlukan agar tidak mengalami kendala dalam proses berlangsungnya pendaftaran."], "a": 0, "p": "Kalimat efektif harus ringkas, jelas, dan tidak boros kata. Frasa “dokumen-dokumen” cukup ditulis “dokumen” karena sudah bermakna umum. Frasa “pada saat proses pendaftaran berlangsung” dapat diringkas menjadi “saat pendaftaran”.<br>Opsi A paling tepat karena lebih hemat kata tanpa mengubah makna.", "fx": 1, "src": 1}, {"s": "TWK", "t": "bahasa", "q": "Perhatikan kalimat berikut:<br>“Setiap warga negara memiliki hak untuk memperoleh pendidikan, namun juga memiliki kewajiban untuk menaati peraturan yang berlaku.”<br>Kata penghubung yang lebih tepat untuk memperbaiki kalimat tersebut adalah...", "o": ["dan", "tetapi", "sehingga", "karena", "walaupun"], "a": 0, "p": "Kalimat tersebut tidak menunjukkan pertentangan, melainkan penambahan informasi tentang hak dan kewajiban warga negara. Karena itu, kata penghubung yang tepat adalah “dan”.<br>Opsi A paling tepat. Kata “namun” atau “tetapi” digunakan untuk pertentangan, sedangkan konteks kalimat ini menunjukkan dua hal yang sama-sama dimiliki warga negara.", "fx": 1, "src": 1}, {"s": "TWK", "t": "bahasa", "q": "Perhatikan paragraf berikut:<br>Indonesia memiliki banyak bahasa daerah yang menjadi bagian dari kekayaan budaya bangsa. Bahasa daerah perlu dilestarikan karena mencerminkan identitas masyarakat setempat. Namun, dalam komunikasi antarsuku dan antarwilayah, bahasa Indonesia tetap diperlukan agar masyarakat dapat saling memahami.<br>Simpulan yang tepat dari paragraf tersebut adalah...", "o": ["Bahasa daerah sebaiknya digantikan oleh bahasa Indonesia agar komunikasi lebih mudah", "Bahasa Indonesia dan bahasa daerah memiliki peran masing-masing dalam kehidupan bangsa", "Bahasa daerah hanya digunakan oleh masyarakat yang tidak memahami bahasa Indonesia", "Bahasa Indonesia tidak perlu digunakan jika masyarakat masih memiliki bahasa daerah", "Bahasa daerah menjadi penghambat utama persatuan bangsa"], "a": 1, "p": "Paragraf tersebut menjelaskan bahwa bahasa daerah penting sebagai identitas budaya, sedangkan bahasa Indonesia penting sebagai alat komunikasi antarsuku dan antarwilayah.<br>Opsi B paling tepat karena merangkum kedua peran tersebut secara seimbang. Opsi A, C, D, dan E bertentangan dengan isi paragraf.<br>Kalau ingin membiasakan diri mengerjakan soal TWK dengan pembahasan yang rapi, kamu bisa lanjut ke latihan soal CPNS agar pola berpikirmu makin terasah sebelum masuk tryout penuh.", "fx": 1, "src": 1}, {"s": "TWK", "t": "bahasa", "q": "Perhatikan penulisan berikut:<br>Undang-Undang Dasar 1945<br>pancasila<br>Negara Kesatuan Republik Indonesia<br>bhinneka tunggal ika<br>bahasa indonesia<br>Penulisan yang tepat sesuai kaidah huruf kapital adalah...", "o": ["Undang-Undang Dasar 1945, Pancasila, Negara Kesatuan Republik Indonesia, Bhinneka Tunggal Ika, bahasa Indonesia", "Undang-undang dasar 1945, Pancasila, negara kesatuan republik Indonesia, Bhinneka tunggal ika, Bahasa Indonesia", "Undang-Undang Dasar 1945, pancasila, Negara kesatuan Republik Indonesia, Bhinneka Tunggal ika, bahasa indonesia", "undang-undang Dasar 1945, Pancasila, Negara Kesatuan republik Indonesia, bhinneka Tunggal Ika, Bahasa indonesia", "Undang-Undang dasar 1945, Pancasila, negara Kesatuan Republik Indonesia, Bhinneka tunggal Ika, bahasa Indonesia"], "a": 0, "p": "Nama resmi seperti Undang-Undang Dasar 1945, Pancasila, Negara Kesatuan Republik Indonesia, dan Bhinneka Tunggal Ika ditulis dengan huruf kapital sesuai unsur nama resminya. Untuk “bahasa Indonesia”, kata “bahasa” ditulis huruf kecil, sedangkan “Indonesia” ditulis kapital.<br>Opsi A paling tepat karena mengikuti kaidah penulisan yang benar.", "fx": 1, "src": 1}, {"s": "TWK", "t": "bahasa", "q": "Perhatikan kalimat berikut:<br>“Sebagai generasi muda, kita harus menjaga persatuan bangsa, menghargai perbedaan, dan menggunakan bahasa Indonesia dengan baik dalam forum resmi.”<br>Makna utama kalimat tersebut adalah...", "o": ["Generasi muda harus meninggalkan bahasa daerah dalam semua kegiatan", "Persatuan bangsa dapat dijaga melalui penghargaan terhadap perbedaan dan penggunaan bahasa Indonesia yang tepat", "Bahasa Indonesia hanya diperlukan dalam kegiatan pemerintahan", "Perbedaan masyarakat Indonesia sebaiknya dikurangi agar persatuan lebih mudah terwujud", "Forum resmi tidak boleh membahas keberagaman budaya"], "a": 1, "p": "Kalimat tersebut menekankan pentingnya menjaga persatuan, menghargai perbedaan, dan menggunakan bahasa Indonesia dengan baik, terutama dalam forum resmi.<br>Opsi B paling tepat karena merangkum makna kalimat secara utuh. Opsi A, C, D, dan E menyimpang dari isi kalimat.", "fx": 1, "src": 1}, {"t": "belanegara", "q": "Seorang pembelajar berpendapat bahwa integrasi nilai-nilai Bela Negara dalam kurikulum sekolah dapat meningkatkan kohesi sosial dan solidaritas antarwarga negara. Bagaimana Anda menilai pernyataan ini?", "o": ["Kurikulum sekolah harus sepenuhnya didedikasikan untuk mengajarkan nilai-nilai Bela Negara demi menciptakan masyarakat yang lebih patuh terhadap pemerintah.", "Integrasi nilai-nilai Bela Negara dalam kurikulum sekolah dapat membantu membangun rasa persatuan dan gotong royong di antara warga negara.", "Pendekatan ini akan mengarah pada indoktrinasi dan pembatasan kebebasan berpikir, sehingga tidak sesuai dengan prinsip-prinsip demokrasi.", "Kurikulum sekolah seharusnya tidak mencampuri urusan politik atau ideologi, sehingga tidak perlu memasukkan nilai-nilai Bela Negara.", "Tidak bisa disimpulkan."], "a": 1, "p": "Nilai bela negara (cinta tanah air, sadar berbangsa dan bernegara, setia pada Pancasila, rela berkorban, kemampuan awal bela negara) yang diintegrasikan dalam pendidikan memperkuat persatuan dan gotong royong. Opsi B paling tepat. Opsi A ekstrem (“sepenuhnya” dan sekadar “patuh”). Opsi C dan D menolak pendidikan karakter kebangsaan. Opsi E tidak menjawab.", "s": "TWK", "fx": 1}, {"t": "integritas", "q": "Dalam birokrasi, budaya “Asal Bapak Senang” (ABS) masih sering terjadi. Bawahan memberikan laporan palsu yang bagus-bagus saja agar atasan tidak marah. Hal ini melanggar nilai integritas, yaitu …", "o": ["Kerja keras dan kegigihan", "Pola hidup yang sederhana", "Berani dan jujur", "Kedisiplinan waktu kerja", "Sikap mandiri dan otonom"], "a": 2, "p": "Laporan palsu adalah bentuk ketidakjujuran, dan takut menyampaikan kondisi sebenarnya kepada atasan menunjukkan tidak adanya keberanian. Keduanya termasuk sembilan nilai integritas KPK. Opsi C paling tepat.", "s": "TWK", "fx": 1}, {"t": "bahasa", "q": "Ketua Komite Ekonomi dan Industri Nasional (KEIN) mengemukakan bahwa ikut serta badan usaha hanyalah sebatas membuat, mengelola, dan merawat sistemnya, sedangkan mekanisme kerja yang berhubungan dengan data harus dilakukan oleh pemerintah untuk mengantisipasi bocornya data tersebut. Perbaikan kata bentukan yang salah pada kalimat tersebut adalah …", "o": ["membuat seharusnya membuatkan", "ikut serta seharusnya keikutsertaan", "berhubungan seharusnya berhubung", "mengemukakan seharusnya dikemukakan", "bocornya seharusnya dibocorkannya"], "a": 1, "p": "Frasa “ikut serta badan usaha” berfungsi sebagai subjek klausa, sehingga harus berupa nomina: <b>keikutsertaan</b> badan usaha (ke-an + ikut serta, ditulis serangkai). Kata lain sudah tepat.", "s": "TWK", "fx": 1}, {"t": "integritas", "q": "Seorang pegawai bernama Dian selalu menjunjung tinggi integritasnya sebagai pegawai pemerintah. Ia berkomitmen bertindak jujur, adil, dan transparan dalam setiap keputusan. Suatu hari, Dian mendapat tawaran menggiurkan dari pihak swasta untuk memberikan informasi rahasia mengenai proyek pemerintah yang sedang berjalan, tetapi Dian dengan tegas menolaknya. Integritas dalam administrasi pemerintahan pada cerita di atas mengacu pada …", "o": ["Adanya hak keistimewaan tertentu bagi pegawai pemerintah", "Kemampuan untuk mendapatkan keuntungan pribadi di luar tugas dan tanggung jawab", "Kualitas moral dan etika seorang pegawai pemerintah", "Kemampuan untuk melanggar hukum demi kepentingan pribadi", "Memiliki peluang besar untuk mengambil keuntungan lebih besar"], "a": 2, "p": "Integritas adalah kualitas moral dan etika: konsisten jujur, adil, dan taat aturan meskipun ada godaan keuntungan pribadi. Opsi lain justru menggambarkan penyalahgunaan jabatan.", "s": "TWK", "fx": 1}, {"t": "pilar", "q": "Asas pluralistik yang terkandung dalam semboyan Bhinneka Tunggal Ika mendukung berbagai nilai yang berhubungan dengan penerimaan dan penghargaan terhadap keberagaman. Namun, ada satu nilai yang bertentangan dengan asas pluralistik tersebut. Asas pluralistik Bhinneka Tunggal Ika mendukung nilai di bawah ini, kecuali …", "o": ["Inklusif", "Eksklusif", "Eksistensi", "Toleransi", "Kesetaraan"], "a": 1, "p": "Pluralisme menerima dan menghargai keberadaan (eksistensi) semua kelompok secara inklusif, toleran, dan setara. <b>Eksklusif</b> (menutup diri dan hanya mengakui kelompok sendiri) bertentangan dengan asas tersebut.", "s": "TWK", "fx": 1}];
