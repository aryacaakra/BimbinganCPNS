const TWK_H=[{"s": "TWK", "t": "pancasila", "q": "Pemerintah daerah membuat program beasiswa yang dibiayai APBD, tetapi hanya diberikan kepada siswa dari kelompok agama mayoritas karena gagasannya berasal dari tokoh agama tersebut. Ditinjau dari nilai Pancasila, kebijakan itu paling tepat dinilai …", "o": ["Bertentangan dengan sila kelima, karena dana publik harus didistribusikan secara adil tanpa diskriminasi agama", "Bertentangan dengan sila pertama, karena negara mencampuri urusan agama", "Sesuai dengan sila pertama, karena menghargai kontribusi tokoh agama", "Sesuai dengan sila ketiga selama kelompok lain tidak keberatan", "Bertentangan dengan sila keempat, karena tidak dimusyawarahkan dengan DPRD"], "p": "APBD adalah dana publik, sehingga pembagiannya berdasarkan agama melanggar keadilan sosial. Pengecoh sila pertama keliru karena masalahnya bukan campur tangan negara dalam agama, melainkan ketidakadilan distribusi. Pengecoh sila keempat keliru karena meskipun dimusyawarahkan, kebijakan diskriminatif tetap tidak sah.", "lv": 3}, {"s": "TWK", "t": "pancasila", "q": "Pernyataan yang paling tepat menggambarkan hubungan antarsila Pancasila adalah …", "o": ["Sila-sila merupakan satu kesatuan hierarkis piramidal; sila pertama menjiwai sila-sila berikutnya, dan sila kelima dijiwai oleh keempat sila sebelumnya", "Setiap sila berdiri sendiri dan dapat diamalkan terpisah selama tidak bertentangan dengan UUD 1945", "Sila-sila bersifat hierarkis sehingga sila pertama lebih penting dan boleh mengesampingkan sila kelima", "Sila kelima merupakan dasar yang menjiwai sila-sila sebelumnya", "Kedudukan setiap sila sejajar sehingga urutannya dapat dipertukarkan sesuai kebutuhan"], "p": "Hierarkis piramidal berarti saling menjiwai dan tidak terpisahkan, bukan berarti satu sila boleh mengesampingkan sila lain. Arah penjiwaan berjalan dari sila pertama ke sila kelima, bukan sebaliknya.", "lv": 3}, {"s": "TWK", "t": "pancasila", "q": "Pemerintah merevisi undang-undang pemilu agar sesuai dengan perkembangan teknologi digital tanpa mengubah prinsip kedaulatan rakyat. Dalam konsep Pancasila sebagai ideologi terbuka, revisi tersebut merupakan dinamika nilai …", "o": ["Instrumental", "Dasar", "Praksis", "Ideal", "Fundamental"], "p": "Undang-undang dan kebijakan adalah nilai instrumental yang boleh menyesuaikan zaman. Nilai praksis adalah perilaku nyata sehari-hari (pengecoh terdekat). Nilai dasar/fundamental (sila-sila) bersifat tetap.", "lv": 3}, {"s": "TWK", "t": "pancasila", "q": "Warga sebuah kompleks menolak pendirian rumah ibadah kelompok minoritas yang izinnya sudah sah, dengan alasan mayoritas warga tidak setuju dalam musyawarah RT. Sikap yang paling sesuai dengan Pancasila dan UUD 1945 adalah …", "o": ["Menghormati izin yang sah karena musyawarah tidak boleh meniadakan hak konstitusional untuk beribadah, sambil memfasilitasi dialog antarwarga", "Mengikuti hasil musyawarah karena sila keempat mengutamakan keputusan bersama", "Meminta kelompok minoritas beribadah di tempat lain agar suasana tetap harmonis", "Membatalkan izin untuk mencegah konflik sosial", "Menyerahkan sepenuhnya penyelesaian kepada aparat keamanan"], "p": "Musyawarah (sila keempat) dibatasi oleh hak konstitusional (Pasal 29 ayat 2) dan keadilan. Suara mayoritas tidak boleh meniadakan hak minoritas. Pengecoh “ikut musyawarah” tampak demokratis, tetapi mengabaikan perlindungan hak.", "lv": 3}, {"s": "TWK", "t": "uud", "q": "Seorang warga merasa dirugikan oleh sebuah Peraturan Menteri yang dinilainya bertentangan dengan undang-undang. Upaya hukum yang paling tepat adalah mengajukan …", "o": ["Permohonan uji materiil ke Mahkamah Agung", "Permohonan uji materiil ke Mahkamah Konstitusi", "Gugatan ke Pengadilan Tata Usaha Negara", "Pengaduan ke Ombudsman RI", "Permohonan legislative review kepada DPR"], "p": "Pasal 24A: MA menguji peraturan di bawah undang-undang terhadap undang-undang. MK (pengecoh terdekat) hanya menguji UU terhadap UUD. PTUN mengadili keputusan (beschikking) yang konkret dan individual, bukan peraturan.", "lv": 3}, {"s": "TWK", "t": "uud", "q": "Presiden hendak membubarkan DPR karena dianggap menghambat program pemerintah. Menurut UUD 1945 hasil perubahan, tindakan tersebut …", "o": ["Tidak dapat dilakukan, karena Presiden tidak dapat membekukan dan/atau membubarkan DPR", "Dapat dilakukan dengan persetujuan MPR", "Dapat dilakukan setelah mendapat pertimbangan Mahkamah Konstitusi", "Dapat dilakukan dalam keadaan darurat melalui Perppu", "Dapat dilakukan bila DPR terbukti melanggar hukum"], "p": "Pasal 7C UUD 1945 menegaskan Presiden tidak dapat membekukan dan/atau membubarkan DPR, dalam keadaan apa pun, sebagai ciri sistem presidensial.", "lv": 3}, {"s": "TWK", "t": "uud", "q": "Urutan proses pemberhentian Presiden dalam masa jabatannya menurut UUD 1945 yang benar adalah …", "o": ["DPR mengajukan permintaan kepada MK → MK memeriksa dan memutus pendapat DPR → DPR mengusulkan pemberhentian kepada MPR → MPR memutuskan dalam rapat paripurna", "DPR mengusulkan kepada MPR → MPR meminta putusan MK → MK memberhentikan Presiden", "MK memeriksa Presiden → DPR memutuskan pemberhentian → MPR melantik pengganti", "DPR memutus pelanggaran → MPR memeriksa → MK memberhentikan Presiden", "MPR mengajukan permohonan kepada MK → MK memutus → DPR memberhentikan Presiden"], "p": "Pasal 7A dan 7B: yang memberhentikan adalah MPR, bukan MK. MK hanya memutus pendapat DPR. Jalurnya DPR → MK → DPR → MPR.", "lv": 3}, {"s": "TWK", "t": "uud", "q": "Hak DPR untuk meminta keterangan kepada pemerintah mengenai kebijakan penting dan strategis yang berdampak luas pada kehidupan masyarakat disebut hak …", "o": ["Interpelasi", "Angket", "Menyatakan pendapat", "Imunitas", "Petisi"], "p": "Interpelasi = meminta keterangan. Angket (pengecoh terdekat) = menyelidiki pelaksanaan UU/kebijakan yang diduga bertentangan dengan peraturan.", "lv": 3}, {"s": "TWK", "t": "pilar", "q": "Sebuah pemerintah daerah menerbitkan peraturan yang melarang warga pendatang dari provinsi lain membuka usaha di wilayahnya demi melindungi masyarakat lokal. Ditinjau dari prinsip NKRI, peraturan tersebut …", "o": ["Bertentangan dengan prinsip NKRI, karena otonomi daerah tidak boleh membatasi hak warga negara yang dijamin secara nasional", "Sesuai prinsip otonomi seluas-luasnya yang dijamin Pasal 18 UUD 1945", "Sesuai Bhinneka Tunggal Ika karena melindungi kekhasan daerah", "Dapat dibenarkan selama disetujui DPRD dan gubernur", "Bertentangan dengan sila keempat karena tidak melalui musyawarah warga"], "p": "Otonomi daerah dijalankan dalam bingkai NKRI. Setiap warga negara berhak atas pekerjaan dan penghidupan yang layak (Pasal 27 ayat 2) di seluruh wilayah. Pengecoh “otonomi seluas-luasnya” mengabaikan batasan tersebut.", "lv": 3}, {"s": "TWK", "t": "pilar", "q": "Pemerintah membuka kanal pengaduan daring dan forum konsultasi publik sebelum menetapkan tarif angkutan umum. Upaya tersebut paling tepat merupakan bentuk …", "o": ["Integrasi vertikal, yaitu menjembatani hubungan pemerintah dengan rakyat", "Integrasi horizontal, yaitu mempersatukan antarkelompok masyarakat", "Integrasi normatif, yaitu penyatuan melalui norma yang sama", "Asimilasi kebijakan antara pusat dan daerah", "Akulturasi budaya birokrasi dan budaya masyarakat"], "p": "Hubungan pemerintah dan rakyat adalah integrasi vertikal. Horizontal menyangkut antarkelompok masyarakat, misalnya antarsuku atau antaragama.", "lv": 3}, {"s": "TWK", "t": "pilar", "q": "Panitia festival budaya menampilkan kesenian berbagai suku, tetapi mewajibkan seluruh pengisi acara memakai satu jenis pakaian adat milik suku mayoritas agar terlihat seragam. Praktik tersebut paling tepat dinilai …", "o": ["Kurang sesuai, karena persatuan dalam Bhinneka Tunggal Ika tidak berarti penyeragaman identitas budaya", "Sesuai, karena keseragaman pakaian memperkuat rasa persatuan", "Sesuai, karena mengikuti mayoritas adalah wujud musyawarah", "Kurang sesuai, karena festival seharusnya hanya menampilkan satu suku", "Tidak relevan dengan Bhinneka Tunggal Ika karena hanya acara hiburan"], "p": "Bhinneka Tunggal Ika berarti bersatu dalam keberagaman, bukan peleburan atau penyeragaman. Pengecoh “keseragaman memperkuat persatuan” adalah jebakan klasik.", "lv": 3}, {"s": "TWK", "t": "nasionalisme", "q": "Seorang pengusaha muda memakai sebagian bahan baku impor yang lebih murah sehingga produknya mampu bersaing di pasar ekspor dan menyerap banyak tenaga kerja lokal. Ditinjau dari nasionalisme, sikap tersebut …", "o": ["Tetap mencerminkan nasionalisme karena berkontribusi pada daya saing dan kesejahteraan bangsa, meski perlu terus mengupayakan bahan baku lokal", "Tidak mencerminkan nasionalisme karena tidak sepenuhnya memakai produk dalam negeri", "Mencerminkan kosmopolitanisme karena lebih mengutamakan pasar global", "Mencerminkan chauvinisme ekonomi karena ingin mengungguli negara lain", "Netral, karena kegiatan ekonomi tidak berkaitan dengan nasionalisme"], "p": "Nasionalisme modern dinilai dari kontribusi nyata bagi bangsa (lapangan kerja, ekspor, daya saing), bukan semata simbol atau penggunaan produk lokal 100%. Kata “tetap … meski perlu” menunjukkan jawaban yang seimbang.", "lv": 3}, {"s": "TWK", "t": "nasionalisme", "q": "Pernyataan yang paling tepat mencerminkan sikap chauvinisme adalah …", "o": ["“Bangsa kita paling unggul; budaya bangsa lain tidak layak dipelajari.”", "“Budaya daerah saya adalah yang terbaik dibandingkan budaya daerah lain.”", "“Saya bangga dengan batik dan ingin memperkenalkannya ke dunia.”", "“Kita perlu belajar teknologi dari negara maju untuk membangun bangsa.”", "“Produk lokal harus terus ditingkatkan kualitasnya agar mampu bersaing.”"], "p": "Chauvinisme adalah fanatisme berlebihan terhadap bangsa sendiri yang disertai sikap merendahkan bangsa lain. Mengagungkan budaya daerah sendiri (pengecoh terdekat) adalah etnosentrisme atau primordialisme, bukan chauvinisme.", "lv": 3}, {"s": "TWK", "t": "nasionalisme", "q": "Sebuah negara tetangga mengklaim tarian tradisional dari Indonesia sebagai budayanya. Langkah yang paling mencerminkan nasionalisme yang rasional adalah …", "o": ["Mendukung pendokumentasian dan pencatatan warisan budaya secara resmi sambil terus melestarikan tarian tersebut di masyarakat", "Menyerukan boikot produk negara tetangga di media sosial", "Menggelar unjuk rasa di depan kedutaan negara tersebut", "Mengunggah konten yang merendahkan negara tetangga", "Mengabaikannya karena budaya adalah milik bersama umat manusia"], "p": "Nasionalisme rasional menempuh jalur resmi (pencatatan warisan budaya) dan pelestarian nyata, bukan reaksi emosional atau sikap acuh.", "lv": 3}, {"s": "TWK", "t": "bhinneka", "q": "Asas dalam Bhinneka Tunggal Ika yang menekankan bahwa perbedaan tidak dipertajam, melainkan dicari titik temunya, adalah …", "o": ["Konvergen", "Divergen", "Asimilatif", "Sektarian", "Formalistis"], "p": "Konvergen berarti mempertemukan perbedaan pada titik kesamaan. Asimilatif (pengecoh terdekat) berarti melebur hingga identitas asal hilang, sehingga bukan semangat Bhinneka.", "lv": 3}, {"s": "TWK", "t": "bhinneka", "q": "Program BBM Satu Harga, yang menyamakan harga BBM di wilayah terpencil dengan wilayah lain, paling tepat mencerminkan perwujudan kepulauan nusantara sebagai satu kesatuan …", "o": ["Ekonomi", "Politik", "Sosial budaya", "Pertahanan dan keamanan", "Ideologi"], "p": "Kesatuan ekonomi berarti potensi dan kekayaan wilayah adalah milik bersama dan tingkat kemajuan ekonomi harus merata di seluruh wilayah. Pemerataan harga energi adalah wujud langsungnya.", "lv": 3}, {"s": "TWK", "t": "sejarah", "q": "Perubahan rumusan sila pertama pada 18 Agustus 1945 paling tepat dimaknai sebagai teladan …", "o": ["Kesediaan mendahulukan persatuan bangsa di atas kepentingan golongan", "Kemenangan golongan kebangsaan atas golongan agama", "Pemisahan urusan agama dari negara", "Penolakan nilai-nilai agama dalam dasar negara", "Kompromi sementara yang dapat diubah kembali sesuai kebutuhan"], "p": "Perubahan itu disepakati demi keutuhan bangsa, dan nilai ketuhanan tetap menjadi sila pertama. Karena itu, perubahan ini bukan pemisahan agama dari negara atau kemenangan satu golongan.", "lv": 3}, {"s": "TWK", "t": "sejarah", "q": "Makna Dekrit Presiden 5 Juli 1959 dalam sejarah ketatanegaraan Indonesia yang paling tepat adalah …", "o": ["Mengakhiri kebuntuan Konstituante dalam menyusun UUD baru dengan memberlakukan kembali UUD 1945", "Membentuk negara serikat untuk mengakomodasi kepentingan daerah", "Mengesahkan Pancasila sebagai dasar negara untuk pertama kalinya", "Memulai sistem pemerintahan parlementer", "Mengembalikan kedudukan MPR melalui pemilihan umum"], "p": "Konstituante gagal menyepakati UUD baru, sehingga Dekrit memberlakukan kembali UUD 1945 dan mengakhiri masa UUDS 1950 serta demokrasi parlementer.", "lv": 3}, {"s": "TWK", "t": "sejarah", "q": "Hubungan antara Deklarasi Djuanda 1957 dan UNCLOS 1982 yang paling tepat adalah …", "o": ["UNCLOS 1982 memberikan pengakuan internasional atas konsep negara kepulauan yang dicetuskan Deklarasi Djuanda", "Deklarasi Djuanda merupakan pelaksanaan dari UNCLOS 1982", "UNCLOS 1982 membatalkan Deklarasi Djuanda dan menggantinya dengan konsep ZEE", "Keduanya mengatur batas wilayah udara Indonesia", "Deklarasi Djuanda menolak hasil UNCLOS 1982"], "p": "Perhatikan urutan waktu: Djuanda (1957) lebih dahulu, kemudian UNCLOS (1982) mengakui konsep negara kepulauan. Pengecoh kedua membalik hubungan sebab-akibatnya.", "lv": 3}, {"s": "TWK", "t": "integritas", "q": "Anda anggota panitia seleksi pegawai kontrak. Salah satu pelamar ternyata adik ipar Anda, dan nilainya memenuhi syarat. Tindakan yang paling tepat adalah …", "o": ["Menyatakan adanya konflik kepentingan kepada ketua panitia dan tidak ikut menilai pelamar tersebut", "Tetap menilai secara objektif karena nilainya memang memenuhi syarat", "Meminta adik ipar mengundurkan diri agar tidak timbul fitnah", "Menilai lebih ketat agar tidak dianggap memihak", "Merahasiakan hubungan keluarga karena tidak ada aturan yang dilanggar"], "p": "Konflik kepentingan dikelola dengan cara diungkapkan lalu mundur dari proses penilaian. Niat untuk tetap objektif (pengecoh terdekat) tidak menghapus konflik kepentingan. Menilai lebih ketat justru tidak adil bagi pelamar.", "lv": 3}, {"s": "TWK", "t": "integritas", "q": "Seorang pejabat ditawari tiket pesawat kelas bisnis oleh rekanan untuk menghadiri seminar yang diselenggarakan rekanan tersebut. Sikap yang paling tepat adalah …", "o": ["Menolak, atau jika telanjur diterima, melaporkannya sesuai ketentuan pelaporan gratifikasi", "Menerima karena seminar menambah wawasan untuk pekerjaan", "Menerima asalkan mendapat izin lisan dari atasan", "Menerima, lalu mengganti biaya tiket kepada rekanan setelah seminar", "Menerima karena tiket tidak berbentuk uang tunai"], "p": "Gratifikasi mencakup tiket perjalanan, bukan hanya uang. Izin lisan atasan tidak menghapus kewajiban menolak atau melapor, dan mengganti biaya secara pribadi tidak sesuai mekanisme.", "lv": 3}, {"s": "TWK", "t": "integritas", "q": "Atasan meminta Anda menandatangani daftar hadir kegiatan yang tidak Anda ikuti agar laporan pertanggungjawaban anggaran lengkap. Atasan menjamin Anda tidak menerima uang apa pun. Sikap yang paling tepat adalah …", "o": ["Menolak dengan sopan dan menyarankan laporan disusun sesuai kehadiran sebenarnya", "Menandatangani karena Anda tidak menerima uang sehingga tidak merugikan negara", "Menandatangani, tetapi mencatat keberatan secara pribadi", "Meminta rekan yang hadir menandatangani atas nama Anda", "Menandatangani sekali ini, lalu melaporkan atasan ke inspektorat"], "p": "Tanda tangan palsu pada dokumen pertanggungjawaban adalah pemalsuan data, terlepas dari ada atau tidaknya uang yang diterima. Pengecoh “tidak merugikan negara” mengalihkan fokus dari kejujuran dokumen.", "lv": 3}, {"s": "TWK", "t": "integritas", "q": "Perilaku ASN berikut yang paling tepat mencerminkan nilai “Akuntabel” dalam BerAKHLAK adalah …", "o": ["Menggunakan kendaraan dinas hanya untuk keperluan dinas dan mempertanggungjawabkan penggunaannya", "Ramah dan cepat dalam melayani masyarakat", "Terus belajar mengembangkan kompetensi digital", "Menghargai rekan kerja yang berbeda latar belakang", "Terbuka bekerja sama lintas unit"], "p": "Akuntabel berarti bertanggung jawab atas kepercayaan dan menggunakan kekayaan negara secara bertanggung jawab. Pilihan lain mencerminkan nilai Berorientasi pelayanan, Kompeten, Harmonis, dan Kolaboratif.", "lv": 3}, {"s": "TWK", "t": "belanegara", "q": "Ancaman yang paling tepat digolongkan sebagai ancaman nonmiliter berdimensi teknologi adalah …", "o": ["Peretasan terhadap sistem data kependudukan nasional", "Pelanggaran wilayah udara oleh pesawat tempur asing", "Penyelundupan senjata oleh kelompok separatis", "Penyebaran paham yang menolak Pancasila", "Krisis moneter akibat anjloknya nilai tukar"], "p": "Paham anti-Pancasila adalah ancaman nonmiliter berdimensi ideologi, krisis moneter berdimensi ekonomi, sedangkan pelanggaran wilayah dan penyelundupan senjata termasuk ancaman militer.", "lv": 3}, {"s": "TWK", "t": "belanegara", "q": "Upaya bela negara yang paling relevan bagi seorang ASN analis anggaran adalah …", "o": ["Menyusun analisis anggaran yang akurat dan menolak setiap upaya penyimpangan penggunaan anggaran", "Mengikuti pelatihan dasar kemiliteran setiap tahun", "Wajib menjadi anggota komponen cadangan", "Aktif membagikan konten nasionalisme di media sosial pada jam kerja", "Mengikuti upacara bendera sebagai satu-satunya bentuk bela negara"], "p": "Bela negara yang paling relevan diwujudkan sesuai profesi. Keikutsertaan dalam komponen cadangan bersifat sukarela, bukan wajib.", "lv": 3}, {"s": "TWK", "t": "belanegara", "q": "Pegawai yang rutin berolahraga, menjaga kesehatan mental, dan terus meningkatkan keterampilan kerja paling tepat mencerminkan nilai dasar bela negara …", "o": ["Kemampuan awal bela negara", "Rela berkorban untuk bangsa dan negara", "Cinta tanah air", "Sadar berbangsa dan bernegara", "Setia pada Pancasila sebagai ideologi negara"], "p": "Kemampuan awal bela negara mencakup kesiapan fisik, mental, dan kompetensi. Tidak ada unsur pengorbanan untuk kepentingan umum di sini, sehingga “rela berkorban” kurang tepat.", "lv": 3}, {"s": "TWK", "t": "bahasa", "q": "Kalimat yang paling efektif adalah …", "o": ["Peserta wajib membawa kartu ujian dan alat tulis.", "Bagi peserta wajib membawa kartu ujian dan alat tulis.", "Para peserta-peserta wajib membawa kartu ujian dan alat tulis.", "Peserta diwajibkan untuk membawa kartu ujian serta juga alat tulis.", "Kepada peserta diwajibkan membawa kartu ujian dan alat tulis."], "p": "Kata depan “bagi” dan “kepada” menghilangkan subjek. “Para … -peserta” bermakna jamak ganda. “Serta juga” dan “untuk” setelah “diwajibkan” adalah pemborosan.", "lv": 3}, {"s": "TWK", "t": "bahasa", "q": "Penggunaan huruf kapital yang tepat terdapat pada kalimat …", "o": ["Kami menghadiri rapat di Kantor Gubernur Jawa Barat pada hari Senin.", "Kami menghadiri rapat di kantor gubernur Jawa Barat pada Hari Senin.", "Kami menghadiri rapat di Kantor gubernur jawa barat pada hari senin.", "kami menghadiri Rapat di Kantor Gubernur Jawa Barat pada Hari Senin.", "Kami menghadiri rapat di kantor Gubernur Jawa barat pada hari Senin."], "p": "Nama gedung atau instansi resmi (Kantor Gubernur Jawa Barat) serta nama hari ditulis kapital. Kata “hari” sebelum nama hari ditulis kecil.", "lv": 3}, {"s": "TWK", "t": "bahasa", "q": "Kata penghubung yang tepat untuk melengkapi teks berikut adalah …<br>“Pemerintah telah menaikkan anggaran pendidikan. …, kualitas pendidikan di daerah terpencil belum merata.”", "o": ["Namun", "Tetapi", "Oleh karena itu", "Bahkan", "Sehingga"], "p": "Kedua kalimat bertentangan, dan konjungsinya menghubungkan dua kalimat (antarkalimat), sehingga yang tepat adalah “Namun,”. “Tetapi” adalah konjungsi intrakalimat (pengecoh terdekat).", "lv": 3}, {"s": "TWK", "t": "bahasa", "q": "Kelompok kata bentukan yang semuanya baku adalah …", "o": ["mengesampingkan, diberhentikan, pertanggungjawaban", "mengenyampingkan, diberhentikan, pertanggungjawaban", "mengesampingkan, diperhentikan, pertanggung jawaban", "mengenyampingkan, diperhentikan, pertanggungjawaban", "mengesampingkan, diberhentikan, pertanggung jawaban"], "p": "Bentuk baku menurut KBBI adalah mengesampingkan, diberhentikan, dan pertanggungjawaban (ditulis serangkai karena mendapat awalan dan akhiran sekaligus). Setiap pengecoh hanya berbeda satu kata.", "lv": 3}];

const TIU_HOTS=[{"s": "TIU", "t": "verbal", "q": "SEMINAR : PESERTA : NARASUMBER = …", "o": ["Pertandingan : Penonton : Pemain", "Konser : Penyanyi : Penonton", "Kelas : Guru : Murid", "Rapat : Notulis : Pimpinan", "Pengadilan : Hakim : Terdakwa"], "p": "Polanya adalah acara : yang menyimak : yang tampil atau menyampaikan. “Konser : Penyanyi : Penonton” urutannya terbalik, begitu pula “Kelas : Guru : Murid”.", "lv": 3}, {"s": "TIU", "t": "verbal", "q": "PANAS : TERMOMETER = GEMPA : …", "o": ["Seismograf", "Richter", "Barometer", "Anemometer", "Tsunami"], "p": "Hubungan besaran dengan alat ukurnya. Richter adalah skala atau satuan, bukan alat ukur (jebakan utama).", "lv": 3}, {"s": "TIU", "t": "verbal", "q": "PENGARANG : NOVEL = …", "o": ["Komponis : Lagu", "Penyanyi : Lagu", "Penerbit : Buku", "Wartawan : Koran", "Pembaca : Cerpen"], "p": "Hubungan pencipta dengan karya ciptaannya. Penyanyi membawakan lagu, bukan menciptakannya. Wartawan menulis berita, sedangkan koran adalah medianya.", "lv": 3}, {"s": "TIU", "t": "verbal", "q": "KAPAL : NAKHODA = …", "o": ["Pesawat : Pilot", "Mobil : Penumpang", "Kereta : Rel", "Rumah : Arsitek", "Sekolah : Murid"], "p": "Hubungan kendaraan dengan pemimpin atau pengemudinya. Arsitek merancang rumah, bukan memimpin atau mengoperasikannya.", "lv": 3}, {"s": "TIU", "t": "verbal", "q": "HAUS : MINUM = LELAH : …", "o": ["Istirahat", "Tidur", "Berkeringat", "Bekerja", "Lemas"], "p": "Hubungan kondisi dengan cara umum mengatasinya. Tidur hanya salah satu bentuk istirahat dan tidak setara dengan “minum” sebagai cara umum.", "lv": 3}, {"s": "TIU", "t": "logika", "q": "Jika harga BBM naik, biaya transportasi naik. Jika biaya transportasi naik, harga sembako naik. Ternyata harga sembako tidak naik. Kesimpulan yang tepat adalah …", "o": ["Harga BBM tidak naik", "Biaya transportasi naik", "Harga BBM naik, tetapi biaya transportasi tidak naik", "Harga sembako tidak naik karena faktor lain", "Tidak dapat ditarik kesimpulan"], "p": "p → q dan q → r memberi p → r. Karena ~r, maka ~q dan ~p. Harga BBM tidak naik.", "lv": 3}, {"s": "TIU", "t": "logika", "q": "Semua peserta yang lulus SKD mengikuti SKB. Sebagian peserta dari Bangka lulus SKD. Andi tidak mengikuti SKB. Kesimpulan yang pasti benar adalah …", "o": ["Andi tidak lulus SKD", "Andi bukan peserta dari Bangka", "Sebagian peserta dari Bangka tidak mengikuti SKB", "Andi lulus SKD tetapi berhalangan hadir SKB", "Semua peserta dari Bangka mengikuti SKB"], "p": "Modus tollens: lulus SKD → ikut SKB; Andi tidak ikut SKB, sehingga Andi tidak lulus SKD. Asal daerah Andi tidak dapat dipastikan.", "lv": 3}, {"s": "TIU", "t": "logika", "q": "Pernyataan yang ekuivalen dengan “Jika rapat dimulai, maka semua peserta mematikan ponsel” adalah …", "o": ["Jika ada peserta yang tidak mematikan ponsel, maka rapat belum dimulai", "Jika rapat belum dimulai, maka ada peserta yang tidak mematikan ponsel", "Jika semua peserta mematikan ponsel, maka rapat dimulai", "Rapat dimulai dan ada peserta yang tidak mematikan ponsel", "Jika ada peserta yang tidak mematikan ponsel, maka rapat dimulai"], "p": "Kontraposisi p → q ≡ ~q → ~p. Ingkaran dari “semua peserta mematikan ponsel” adalah “ada peserta yang tidak mematikan ponsel”. Pilihan yang memuat “dan …” adalah ingkaran, bukan ekuivalen.", "lv": 3}, {"s": "TIU", "t": "logika", "q": "Tidak ada atlet yang merokok. Sebagian mahasiswa adalah atlet. Semua mahasiswa memiliki kartu perpustakaan. Kesimpulan yang pasti benar adalah …", "o": ["Sebagian pemilik kartu perpustakaan tidak merokok", "Semua mahasiswa tidak merokok", "Sebagian mahasiswa merokok", "Semua atlet memiliki kartu perpustakaan", "Tidak ada pemilik kartu perpustakaan yang merokok"], "p": "Mahasiswa yang atlet tidak merokok dan memiliki kartu, sehingga sebagian pemilik kartu tidak merokok. “Semua atlet memiliki kartu” tidak pasti, karena hanya atlet yang juga mahasiswa yang pasti memilikinya.", "lv": 3}, {"s": "TIU", "t": "logika", "q": "Ingkaran dari pernyataan “Semua pegawai hadir dan sebagian rapat ditunda” adalah …", "o": ["Ada pegawai yang tidak hadir atau semua rapat tidak ditunda", "Ada pegawai yang tidak hadir dan semua rapat tidak ditunda", "Semua pegawai tidak hadir atau sebagian rapat tidak ditunda", "Ada pegawai yang tidak hadir atau sebagian rapat tidak ditunda", "Semua pegawai tidak hadir dan semua rapat ditunda"], "p": "~(p ∧ q) ≡ ~p ∨ ~q. Ingkaran “semua hadir” adalah “ada yang tidak hadir”, dan ingkaran “sebagian ditunda” adalah “semua tidak ditunda”.", "lv": 3}, {"s": "TIU", "t": "logika", "q": "Jika Dina lulus, ia mendapat beasiswa. Jika Dina tidak lulus, ia mengulang. Ternyata Dina tidak mengulang. Kesimpulan yang tepat adalah …", "o": ["Dina mendapat beasiswa", "Dina tidak lulus", "Dina tidak mendapat beasiswa", "Dina mengulang dan mendapat beasiswa", "Tidak dapat ditarik kesimpulan"], "p": "Dari ~lulus → mengulang dan fakta tidak mengulang, diperoleh Dina lulus (modus tollens). Dari lulus → beasiswa, Dina mendapat beasiswa (modus ponens).", "lv": 3}, {"s": "TIU", "t": "analitis", "q": "Enam pegawai (P, Q, R, S, T, U) presentasi pada Senin–Sabtu, satu orang per hari. Q presentasi sehari setelah P. R presentasi hari Rabu. S presentasi sebelum P. U tidak presentasi pada hari Senin maupun Sabtu. T presentasi setelah Q. Siapa yang presentasi hari Sabtu?", "o": ["T", "U", "Q", "P", "S"], "p": "R = Rabu. Pasangan P–Q berurutan dan S harus sebelum P, sehingga P–Q = Kamis–Jumat. T setelah Q, jadi T = Sabtu. Sisa Senin–Selasa untuk S dan U; karena U bukan Senin, maka U = Selasa dan S = Senin.", "lv": 3}, {"s": "TIU", "t": "analitis", "q": "Dalam suatu antrean, Rudi berada di urutan ke-7 dari depan dan ke-12 dari belakang. Jumlah orang dalam antrean adalah …", "o": ["18", "19", "17", "20", "16"], "p": "7 + 12 − 1 = 18. Rudi terhitung dua kali, sehingga dikurangi 1.", "lv": 3}, {"s": "TIU", "t": "analitis", "q": "Jika 1 Januari 2027 jatuh pada hari Jumat, maka 1 Maret 2027 jatuh pada hari …", "o": ["Senin", "Selasa", "Minggu", "Sabtu", "Rabu"], "p": "Januari 31 hari (31 mod 7 = 3) membuat 1 Februari jatuh pada Senin. Tahun 2027 bukan kabisat, sehingga Februari 28 hari (28 mod 7 = 0) dan 1 Maret juga Senin. Selasa adalah jebakan jika Februari dihitung 29 hari.", "lv": 3}, {"s": "TIU", "t": "analitis", "q": "Empat kotak berisi bola merah, biru, hijau, dan kuning (satu warna per kotak). Kotak 1 tidak berisi merah maupun biru. Kotak 2 berisi hijau. Kotak 4 tidak berisi biru. Kotak yang berisi bola biru adalah …", "o": ["Kotak 3", "Kotak 1", "Kotak 2", "Kotak 4", "Tidak dapat ditentukan"], "p": "Kotak 2 hijau. Kotak 1 bukan merah, biru, atau hijau, jadi kuning. Kotak 4 bukan biru, jadi merah. Tersisa kotak 3 berisi biru.", "lv": 3}, {"s": "TIU", "t": "numerik", "q": "Harga suatu barang dinaikkan 20%, kemudian diturunkan 20%. Dibandingkan harga awal, harga akhirnya …", "o": ["Turun 4%", "Tetap", "Naik 4%", "Turun 2%", "Naik 2%"], "p": "1,2 × 0,8 = 0,96, sehingga harga turun 4%. Jebakannya adalah mengira kenaikan dan penurunan dengan persen yang sama saling menghapus.", "lv": 3}, {"s": "TIU", "t": "numerik", "q": "Sebuah mobil berangkat dari A ke B dengan kecepatan 60 km/jam dan kembali dengan kecepatan 40 km/jam. Kecepatan rata-rata perjalanan pulang-pergi adalah …", "o": ["48 km/jam", "50 km/jam", "45 km/jam", "52 km/jam", "24 km/jam"], "p": "Jarak sama, sehingga v rata-rata = 2 × 60 × 40 ÷ (60 + 40) = 48 km/jam (rata-rata harmonik), bukan (60 + 40) ÷ 2 = 50.", "lv": 3}, {"s": "TIU", "t": "numerik", "q": "A dapat menyelesaikan pekerjaan dalam 10 hari dan B dalam 15 hari. Mereka bekerja bersama selama 4 hari, kemudian A berhenti. Sisa pekerjaan diselesaikan B dalam …", "o": ["5 hari", "6 hari", "4 hari", "7,5 hari", "3 hari"], "p": "Kecepatan bersama 1/10 + 1/15 = 1/6 per hari. Dalam 4 hari selesai 4/6 = 2/3, sisa 1/3. B menyelesaikan sisa dalam 1/3 × 15 = 5 hari.", "lv": 3}, {"s": "TIU", "t": "numerik", "q": "Seorang pedagang menjual barang seharga Rp138.000 dan memperoleh untung 15%. Harga beli barang tersebut adalah …", "o": ["Rp120.000", "Rp117.300", "Rp123.000", "Rp115.000", "Rp118.000"], "p": "Harga beli = 138.000 ÷ 1,15 = 120.000. Jebakannya: 138.000 × 85% = 117.300, karena persen untung dihitung dari harga beli, bukan dari harga jual.", "lv": 3}, {"s": "TIU", "t": "numerik", "q": "Larutan 40 liter mengandung 25% gula. Banyak air yang harus ditambahkan agar kadar gula menjadi 20% adalah …", "o": ["10 liter", "8 liter", "12 liter", "5 liter", "15 liter"], "p": "Gula = 10 liter dan jumlahnya tetap. Agar kadarnya 20%, volume total harus 50 liter, sehingga air yang ditambahkan 10 liter.", "lv": 3}, {"s": "TIU", "t": "numerik", "q": "Rata-rata nilai 30 siswa laki-laki adalah 70, dan rata-rata 20 siswa perempuan adalah 80. Rata-rata nilai seluruh siswa adalah …", "o": ["74", "75", "72", "76", "73"], "p": "(30 × 70 + 20 × 80) ÷ 50 = 3.700 ÷ 50 = 74. Angka 75 adalah jebakan rata-rata biasa yang mengabaikan jumlah siswa.", "lv": 3}, {"s": "TIU", "t": "numerik", "q": "Jika x : y = 3 : 4 dan y : z = 2 : 5, maka x : z adalah …", "o": ["3 : 10", "3 : 5", "6 : 5", "8 : 15", "5 : 3"], "p": "Samakan nilai y: x : y = 3 : 4, sedangkan y : z = 2 : 5 = 4 : 10. Jadi x : y : z = 3 : 4 : 10, sehingga x : z = 3 : 10.", "lv": 3}, {"s": "TIU", "t": "numerik", "q": "Nilai dari (2,5% × 480) + (12,5% × 96) adalah …", "o": ["24", "22", "26", "20", "28"], "p": "2,5% × 480 = 12 dan 12,5% × 96 = 1/8 × 96 = 12. Jumlahnya 24.", "lv": 3}];

["sosbud","Informasi bernuansa SARA yang memojokkan kelompok tertentu beredar di grup kantor. Sikap Anda …",["Mengingatkan anggota grup agar tidak menyebarkannya dan meluruskan dengan informasi yang benar","Menyampaikannya kepada admin grup","Tidak ikut menyebarkan","Membaca tanpa menanggapi","Ikut menyebarkan karena menarik"]],
["sosbud","Warga dari kelompok masyarakat adat meminta layanan dengan bahasa yang tidak Anda pahami. Sikap Anda …",["Berusaha memahami dengan sabar, mencari penerjemah atau pendamping bila perlu, dan tetap melayaninya","Meminta bantuan rekan yang memahami bahasanya","Berkomunikasi dengan isyarat seadanya","Meminta ia datang lain kali dengan pendamping","Menolak karena tidak dapat berkomunikasi"]],
["sosbud","Dalam musyawarah warga, usulan Anda berbeda dengan usulan tokoh masyarakat setempat. Sikap Anda …",["Menyampaikan usulan dengan santun dan menghormati hasil musyawarah","Menyampaikan usulan lalu mengikuti keputusan","Menyimpan usulan agar tidak terjadi perdebatan","Menyampaikan keberatan di luar forum","Tidak menghadiri musyawarah berikutnya"]],
["sosbud","Rekan kerja baru dari daerah lain kesulitan beradaptasi dengan lingkungan kantor. Sikap Anda …",["Mengajaknya berinteraksi dan memperkenalkannya pada budaya kerja serta lingkungan sekitar","Membantu bila ia bertanya","Mengenalkannya kepada beberapa rekan","Membiarkannya beradaptasi sendiri","Menganggapnya kurang pandai bergaul"]],
["tik","Instansi Anda mulai menggunakan aplikasi persuratan elektronik, tetapi Anda belum menguasainya. Sikap Anda …",["Segera mempelajari panduan, mengikuti pelatihan, dan mempraktikkannya dalam pekerjaan","Mempelajarinya ketika ada surat yang harus diproses","Meminta rekan memproses surat Anda","Tetap memakai cara manual selama masih diperbolehkan","Menolak karena cara lama lebih mudah"]],
["tik","Anda menerima surel yang mengatasnamakan pimpinan dan meminta kata sandi akun dinas Anda. Sikap Anda …",["Tidak memberikan kata sandi, memverifikasi langsung ke pimpinan, dan melaporkannya ke unit TI","Tidak memberikan kata sandi dan menghapus surel tersebut","Membalas surel untuk menanyakan keperluannya","Memberikan kata sandi lalu segera menggantinya","Memberikan kata sandi karena diminta pimpinan"]],
["tik","Pekerjaan rutin pengolahan data di unit Anda masih manual dan memakan waktu. Sikap Anda …",["Mengusulkan dan merancang otomatisasi sederhana dengan aplikasi yang tersedia","Mencari cara untuk mempercepat pekerjaan pribadi saja","Lembur agar pekerjaan selesai tepat waktu","Tetap mengerjakannya secara manual seperti biasa","Meminta tambahan pegawai"]],
["tik","Seorang rekan ingin meminjam akun aplikasi dinas Anda karena akunnya terkunci. Sikap Anda …",["Menolak dengan sopan dan membantunya menghubungi admin untuk membuka akunnya","Menyarankan ia segera menghubungi admin","Meminjamkan akun sambil Anda awasi","Meminjamkan karena hanya sebentar","Memberikan kata sandi Anda kepadanya"]],
["tik","Anda menemukan informasi di media sosial tentang kebijakan instansi yang sumbernya belum jelas. Sikap Anda …",["Memeriksa kebenarannya melalui kanal resmi sebelum menanggapi atau membagikannya","Menunggu klarifikasi resmi tanpa membagikannya","Menanyakannya kepada rekan kerja","Membagikannya dengan catatan “belum tentu benar”","Langsung membagikannya agar rekan tahu"]],
["tik","Atasan meminta Anda menyajikan data tahunan agar mudah dipahami pimpinan. Sikap Anda …",["Mengolah data dan menyajikannya dalam dasbor atau grafik yang ringkas dan informatif","Menyajikan tabel lengkap beserta keterangannya","Mengirim data mentah disertai penjelasan lisan","Meminta rekan yang ahli membuatnya","Menyampaikan bahwa Anda tidak menguasai pengolahan data"]],
["tik","Data pribadi masyarakat yang Anda kelola diminta oleh pihak luar tanpa dasar yang jelas. Sikap Anda …",["Menolak dan menjelaskan bahwa data pribadi hanya dapat diberikan sesuai ketentuan pelindungan data pribadi","Meminta surat permohonan resmi terlebih dahulu","Menanyakannya kepada atasan","Memberikan sebagian data yang dianggap tidak penting","Memberikannya karena diminta dengan sopan"]],
["tik","Muncul aplikasi kecerdasan buatan yang berpotensi membantu pekerjaan Anda. Sikap Anda …",["Mempelajari dan memanfaatkannya secara bertanggung jawab dengan tetap menjaga kerahasiaan data instansi","Mencobanya untuk keperluan pribadi terlebih dahulu","Menunggu kebijakan resmi instansi","Mengabaikannya karena belum dibutuhkan","Mengunggah dokumen rahasia agar hasilnya lebih akurat"]],
["profesional","Anda diberi tugas mendesak saat pekerjaan lain belum selesai. Sikap Anda …",["Menyusun prioritas berdasarkan tenggat dan dampak, lalu mengomunikasikannya kepada atasan","Mengerjakan tugas mendesak terlebih dahulu","Lembur untuk menyelesaikan keduanya","Meminta rekan mengerjakan salah satunya","Menolak tugas mendesak tersebut"]],
["profesional","Hasil kerja Anda dikritik atasan di depan rekan-rekan. Sikap Anda …",["Menerima kritik sebagai masukan dan segera memperbaiki hasil kerja","Menerima kritik lalu menanyakan rinciannya setelah rapat","Diam dan mengerjakan ulang","Merasa kecewa dan kurang bersemangat","Membantah karena merasa sudah benar"]],
["profesional","Anda melakukan kesalahan input data yang berpotensi memengaruhi laporan. Sikap Anda …",["Segera mengakui, memperbaiki, dan melaporkannya kepada atasan beserta langkah pencegahannya","Memperbaiki kesalahan tanpa memberi tahu siapa pun","Menunggu sampai ada yang menyadarinya","Menyalahkan sistem aplikasi","Menutupi kesalahan tersebut"]],
["profesional","Anda ditawari pelatihan yang bermanfaat, tetapi diadakan pada akhir pekan. Sikap Anda …",["Mengikutinya dengan antusias untuk meningkatkan kompetensi","Mengikutinya karena diminta atasan","Mengikuti sebagian sesi","Menanyakan apakah ada pelatihan pada hari kerja","Menolak karena akhir pekan adalah waktu istirahat"]],
["profesional","Pekerjaan Anda selesai lebih cepat dari jadwal. Sikap Anda …",["Memeriksa ulang kualitasnya, lalu menawarkan bantuan atau mengerjakan tugas lain yang relevan","Menyerahkan hasil dan menunggu tugas berikutnya","Memeriksa ulang hasil pekerjaan","Beristirahat sampai jam pulang","Pulang lebih awal"]],
["profesional","Target kinerja tahun ini dinaikkan cukup tinggi oleh pimpinan. Sikap Anda …",["Menyusun rencana kerja yang terukur dan bekerja keras untuk mencapainya","Berusaha mencapainya semampu Anda","Menunggu arahan teknis dari atasan","Mengeluhkan target kepada rekan","Menganggap target tidak realistis dan bekerja seperti biasa"]],
["profesional","Anda diminta menyusun laporan berdasarkan aturan yang belum Anda pahami. Sikap Anda …",["Mempelajari aturan tersebut secara mendalam dan berdiskusi dengan pihak yang berkompeten","Mempelajari bagian yang diperlukan saja","Meniru laporan tahun sebelumnya","Meminta rekan yang paham menyusunnya","Menyusunnya berdasarkan perkiraan sendiri"]],
["profesional","Anda dipindahkan ke unit baru dengan bidang pekerjaan yang sangat berbeda. Sikap Anda …",["Menerimanya sebagai kesempatan berkembang dan segera mempelajari tugas baru","Menerima dan menyesuaikan diri perlahan","Menerima tetapi berharap segera kembali","Meminta pimpinan mempertimbangkan ulang","Menolak pemindahan tersebut"]],
["radikal","Seorang teman mengajak Anda bergabung dalam kelompok kajian yang ingin mengganti Pancasila dengan ideologi lain. Sikap Anda …",["Menolak, mengingatkannya tentang Pancasila sebagai dasar negara, dan melapor kepada pihak berwenang bila mengarah pada tindakan","Menolak dan menasihatinya","Menolak dengan halus","Ikut sekali untuk mengetahui isinya","Bergabung karena penasaran"]],
["radikal","Anda menemukan konten media sosial yang mengajak melakukan kekerasan atas nama agama. Sikap Anda …",["Melaporkan konten ke platform dan kanal aduan resmi serta tidak menyebarkannya","Tidak menyebarkan dan memblokir akun tersebut","Mengabaikan konten tersebut","Menanggapinya dengan komentar emosional","Membagikannya agar orang lain tahu"]],
["radikal","Rekan kerja sering menyampaikan pandangan intoleran yang merendahkan kelompok lain. Sikap Anda …",["Mengajaknya berdialog dengan bijak tentang pentingnya toleransi dan kebinekaan","Menyampaikan ketidaksetujuan secara singkat","Menghindari obrolan dengannya","Mendengarkan tanpa menanggapi","Membenarkannya agar tidak terjadi konflik"]],
["radikal","Di lingkungan tempat tinggal Anda ada penghuni baru yang sangat tertutup dan menyimpan barang mencurigakan. Sikap Anda …",["Berkoordinasi dengan RT/RW untuk memastikan identitasnya sesuai prosedur tanpa main hakim sendiri","Mengamati sambil menunggu perkembangan","Membicarakannya dengan tetangga","Tidak peduli","Menggerebeknya bersama warga"]],
["radikal","Ada ajakan aksi yang bertujuan menggulingkan pemerintahan yang sah dengan kekerasan. Sikap Anda …",["Menolak ikut, menjelaskan bahayanya kepada orang sekitar, dan melapor kepada pihak berwenang","Menolak ikut dan menasihati teman","Tidak ikut dan diam saja","Menonton dari jauh","Ikut karena kecewa dengan pemerintah"]],
["radikal","Anggota keluarga Anda mulai terpapar konten radikal di internet. Sikap Anda …",["Mendampingi, mengajak berdialog, dan memberi pemahaman moderat serta konten alternatif yang positif","Membatasi penggunaan internetnya","Menasihatinya sekali","Memarahinya","Membiarkannya karena nanti akan sadar sendiri"]],
["radikal","Dalam diskusi kantor, ada yang berpendapat bahwa demokrasi bertentangan dengan agama. Sikap Anda …",["Menanggapi dengan argumen santun bahwa nilai Pancasila dan demokrasi sejalan dengan nilai agama","Menyampaikan ketidaksetujuan","Mengalihkan topik pembicaraan","Diam karena takut berdebat","Menyetujui pendapat tersebut"]],
["radikal","Sebagai ASN, Anda diajak menandatangani petisi daring yang menolak Pancasila. Sikap Anda …",["Menolak dan menegaskan kesetiaan pada Pancasila, UUD 1945, NKRI, dan pemerintahan yang sah","Menolak menandatangani","Mengabaikan ajakan tersebut","Menandatangani tanpa membaca isinya","Menandatangani dan menyebarkannya"]]
].map(([t,q,o])=>({s:'TKP',t,q,o}));
const TKP_CASE=[{"s": "TKP", "t": "profesional", "q": "Anda adalah pegawai di Dinas Kehutanan dan Lingkungan Hidup. Anda menemukan fakta bahwa beberapa rekan kerja diam-diam membantu perusahaan swasta mendapatkan izin penebangan hutan di kawasan lindung secara tidak sah. Bagaimana sikap Anda?", "o": ["Langsung melaporkan temuan tersebut kepada atasan atau lembaga pengawas terkait agar segera ditindaklanjuti, demi melindungi kawasan hutan lindung dan menegakkan aturan", "Mengumpulkan data dan bukti terkait kegiatan penebangan tidak sah tersebut, kemudian menyampaikannya secara rahasia kepada pihak berwenang agar identitas Anda tetap terlindungi", "Menemui rekan-rekan yang terlibat secara personal, lalu mengingatkan mereka agar berhenti karena bisa merugikan institusi dan lingkungan", "Memilih untuk tidak ikut campur dan hanya menjalankan tugas seperti biasa, karena takut akan konsekuensi jika melaporkan rekan sendiri", "Menganggap hal tersebut bukan urusan Anda dan tidak melakukan tindakan apa pun"], "p": "Pelanggaran serius yang menyangkut aturan dan kepentingan publik → <b>mekanisme resmi</b>. Melapor langsung ke atasan/lembaga pengawas = 5. Melapor secara rahasia tetap baik, tetapi fokus perlindungan diri lebih dominan = 4. Menegur personal terlalu informal untuk pelanggaran serius = 3. Diam karena takut = 2. Mengabaikan sepenuhnya = 1."}, {"s": "TKP", "t": "pelayanan", "q": "Anda bekerja pada unit pelayanan administrasi. Seorang warga lansia kebingungan karena tidak memahami prosedur pengajuan dokumen secara digital, sementara antrean di belakangnya mulai panjang. Apa yang Anda lakukan?", "o": ["Membantu menjelaskan langkah-langkah secara singkat, lalu mengarahkan warga ke petugas pendamping agar proses tetap berjalan tanpa menghambat antrean", "Mengambil alih seluruh proses tanpa menjelaskan apa pun agar lebih cepat", "Meminta warga tersebut membaca petunjuk yang sudah tersedia agar antrean tidak semakin lama", "Meminta warga menunggu sampai antrean lebih sepi", "Meminta warga datang kembali bersama anggota keluarga yang lebih memahami teknologi"], "p": "Pelayanan publik = <b>ramah + solutif + efisien</b>. Menjelaskan singkat dan mengarahkan ke pendamping melayani warga sekaligus menjaga antrean = 5. Mengambil alih menyelesaikan cepat, tetapi warga tidak memahami prosesnya = 4. Hanya menyuruh membaca petunjuk = 3. Menunda layanan = 2. Membebankan masalah kembali kepada warga = 1."}, {"s": "TKP", "t": "jejaring", "q": "Anda menyusun laporan bersama tim lintas unit. Salah satu unit terlambat mengirimkan data sehingga pekerjaan tim Anda ikut tertunda. Apa yang sebaiknya dilakukan?", "o": ["Menghubungi unit terkait, menanyakan kendala, lalu menyepakati waktu pengiriman data agar pekerjaan bersama tetap berjalan", "Menyampaikan keluhan kepada atasan agar unit tersebut segera ditegur", "Mengambil data dari sumber lain tanpa berkoordinasi agar pekerjaan cepat selesai", "Menunggu sampai mereka mengirimkan data karena itu tanggung jawab mereka", "Menghapus bagian yang membutuhkan data tersebut dari laporan"], "p": "Komunikasi langsung, mencari kendala, lalu menyepakati waktu adalah kolaborasi yang menyelesaikan masalah = 5. Mengeluh ke atasan masih berupaya, tetapi terlalu cepat eskalasi = 4. Mengambil data lain tanpa koordinasi memang aktif, tetapi datanya berisiko tidak sinkron = 3. Menunggu = 2. Menghapus bagian laporan mengorbankan kualitas = 1."}, {"s": "TKP", "t": "sosbud", "q": "Anda baru ditempatkan di daerah dengan kebiasaan masyarakat yang berbeda dari lingkungan sebelumnya. Beberapa cara komunikasi lokal terasa asing bagi Anda. Apa yang Anda lakukan?", "o": ["Mempelajari kebiasaan komunikasi setempat dan menyesuaikan pendekatan tanpa mengabaikan aturan kerja", "Meminta rekan lokal menangani seluruh komunikasi dengan masyarakat", "Menghindari banyak interaksi sampai benar-benar memahami budaya mereka", "Tetap menggunakan cara sendiri karena yang penting pekerjaan selesai", "Meminta masyarakat mengikuti cara komunikasi yang biasa Anda gunakan"], "p": "Adaptif sambil tetap profesional = 5. Melibatkan rekan lokal adalah kolaborasi, tetapi terlalu bergantung = 4. Menghindari interaksi terlalu pasif = 3. Bertahan dengan cara sendiri kurang adaptif = 2. Memaksakan kebiasaan pribadi = 1."}, {"s": "TKP", "t": "tik", "q": "Anda menerima email yang mengatasnamakan bagian IT dan meminta Anda segera memasukkan username serta password melalui tautan tertentu agar akun tidak diblokir. Apa yang Anda lakukan?", "o": ["Memeriksa alamat pengirim dan mengonfirmasi permintaan tersebut melalui saluran resmi IT sebelum melakukan tindakan", "Mengabaikan email tanpa memberi tahu siapa pun", "Meneruskan email ke rekan untuk menanyakan apakah mereka juga menerimanya", "Membalas email untuk meminta penjelasan lebih lanjut", "Segera memasukkan data agar akun tetap aktif"], "p": "TIK = <b>manfaatkan → verifikasi → jaga keamanan</b>. Verifikasi lewat saluran resmi = 5. Mengabaikan relatif aman, tetapi ancaman tidak dilaporkan = 4. Meneruskan ke rekan justru menyebarkan pesan = 3. Membalas berarti berinteraksi dengan sumber tak terpercaya = 2. Memasukkan kata sandi paling berisiko = 1."}, {"s": "TKP", "t": "radikal", "q": "Anda menemukan rekan kerja membagikan konten berisi ajakan kebencian terhadap kelompok tertentu di grup internal kantor. Apa yang Anda lakukan?", "o": ["Mengingatkan secara baik, menyimpan bukti, dan menggunakan mekanisme pelaporan internal jika kontennya mengarah pada ujaran kebencian atau radikalisme", "Membalas dengan emosi agar ia sadar tindakannya salah", "Keluar dari grup agar tidak terlibat", "Membiarkannya karena itu pendapat pribadi", "Menyebarkan tangkapan layar ke grup lain agar semua orang tahu"], "p": "Pencegahan + bukti + jalur pelaporan yang tepat = 5. Menolak tetapi emosional = 4. Menjauh tanpa menyelesaikan = 3. Membiarkan terlalu pasif = 2. Menyebarkan tangkapan layar justru memperluas konten bermasalah = 1."}, {"s": "TKP", "t": "jejaring", "q": "Rekan Anda meminta bantuan menyelesaikan laporannya, padahal Anda harus mengirim dokumen penting dalam satu jam. Sikap Anda …", "o": ["Menjelaskan kondisi tenggat Anda, membantu bagian yang bisa diselesaikan cepat, atau mengatur waktu bantuan setelah tugas prioritas selesai", "Menyarankan rekan menyerahkan pekerjaannya kepada orang lain", "Mengambil seluruh pekerjaan rekan supaya ia terbantu", "Mengabaikan permintaan sampai pekerjaan Anda selesai", "Menolak mentah-mentah karena pekerjaan sendiri lebih penting"], "p": "Kolaboratif ≠ mengambil alih. Respons terbaik menggabungkan empati, komunikasi, bantuan, dan tetap menjaga prioritas. Mengambil alih seluruh pekerjaan berisiko menelantarkan tugas sendiri, sedangkan mengabaikan atau menolak mentah-mentah tidak kolaboratif. (Urutan skor latihan.)"}, {"s": "TKP", "t": "profesional", "q": "Anda mengetahui seorang rekan sengaja mengubah data penerima bantuan agar kerabatnya masuk daftar penerima. Anda sudah memastikan data tersebut tidak sesuai kondisi sebenarnya. Sikap Anda …", "o": ["Melaporkan temuan melalui mekanisme resmi yang tersedia disertai informasi yang dapat dipertanggungjawabkan", "Mengingatkan rekan secara pribadi dan menganggap persoalan selesai jika ia berjanji memperbaiki", "Memperbaiki data sendiri tanpa memberi tahu siapa pun", "Membicarakannya dengan rekan lain untuk memastikan mereka juga mengetahui kejadian tersebut", "Membiarkannya karena tidak ingin merusak hubungan kerja"], "p": "Ada manipulasi, kepentingan pribadi, dan data publik, sehingga masalahnya serius → <b>mekanisme resmi</b>. Nasihat pribadi terlalu lemah untuk pelanggaran serius. Memperbaiki diam-diam tidak transparan dan di luar prosedur. Membicarakan dengan rekan lain menyebarkan gosip. Membiarkan = pembiaran. (Urutan skor latihan.)"}, {"s": "TKP", "t": "pelayanan", "q": "Anda bertugas di loket. Seorang warga datang lima menit sebelum layanan ditutup dengan dokumen belum lengkap. Ia harus segera menyelesaikan pengurusan karena besok akan ke luar kota. Sikap Anda …", "o": ["Menjelaskan kekurangan dokumen, memeriksa apakah ada solusi resmi yang memungkinkan, lalu membantu warga menentukan langkah berikutnya", "Meminta warga kembali besok karena prosedur tetap harus dijalankan", "Meminta rekan memutuskan karena Anda tidak ingin salah", "Menerima semua dokumen meski belum lengkap agar warga tidak kecewa", "Menolak karena jam pelayanan hampir selesai"], "p": "Dengan 5P, opsi terbaik memenuhi semuanya: ada <b>penyelesaian</b>, sesuai <b>peran</b>, tetap <b>profesional</b> (tidak menerima dokumen tidak lengkap sembarangan), <b>proporsional</b> (tidak menolak mentah-mentah atau melanggar aturan), dan <b>pengaruhnya</b> baik karena warga mendapat kepastian. (Urutan skor latihan.)"}];

const TKP_H=[{"s": "TKP", "t": "pelayanan", "q": "Sistem antrean daring mengalami gangguan sehingga banyak warga yang sudah mendaftar tidak tercatat. Anda petugas loket. Sikap Anda …", "o": ["Mencatat data warga terdampak secara manual sesuai prosedur darurat, menyampaikan kendala secara terbuka, dan berkoordinasi dengan tim TI agar data tersinkron setelah sistem pulih", "Meminta maaf, menjelaskan gangguan, dan melayani warga berdasarkan urutan kedatangan sambil menunggu sistem pulih", "Melaporkan gangguan kepada tim TI dan meminta warga menunggu informasi selanjutnya", "Meminta warga mendaftar ulang setelah sistem kembali normal", "Menutup layanan sementara sampai sistem diperbaiki"], "p": "Skor 5 dan 4 sama-sama tetap melayani. Skor 5 menambahkan pencatatan sesuai prosedur dan koordinasi agar data tidak hilang, sehingga lebih tuntas.", "lv": 3}, {"s": "TKP", "t": "pelayanan", "q": "Seorang pemohon meminta berkasnya diproses lebih dahulu karena mengaku kenal dengan pimpinan Anda. Sikap Anda …", "o": ["Menjelaskan dengan ramah bahwa semua berkas diproses sesuai urutan dan standar waktu layanan, lalu memberi informasi perkiraan waktu penyelesaian", "Menolak dengan sopan dan meminta pemohon menunggu gilirannya", "Mengonfirmasi terlebih dahulu kepada pimpinan apakah permintaan tersebut benar", "Memproses lebih dahulu jika berkasnya sederhana dan tidak mengganggu antrean", "Langsung memproses lebih dahulu demi menjaga hubungan baik dengan pimpinan"], "p": "Skor 4 sudah adil tetapi minim informasi. Skor 5 adil dan memberi kepastian waktu. Mengonfirmasi ke pimpinan justru membuka peluang perlakuan khusus.", "lv": 3}, {"s": "TKP", "t": "pelayanan", "q": "Seorang warga tunarungu kesulitan menyampaikan kebutuhannya di loket, dan tidak ada petugas yang menguasai bahasa isyarat. Sikap Anda …", "o": ["Berkomunikasi melalui tulisan atau aplikasi teks dengan sabar hingga kebutuhannya terlayani, lalu mengusulkan penyediaan layanan juru bahasa isyarat di unit", "Berkomunikasi melalui tulisan dengan sabar hingga kebutuhannya terlayani", "Meminta pendamping warga tersebut menjelaskan kebutuhannya", "Meminta warga datang kembali bersama keluarga yang dapat membantu berkomunikasi", "Mengarahkan warga ke loket lain agar ditangani petugas lain"], "p": "Skor 4 menyelesaikan kasus saat itu. Skor 5 juga memperbaiki sistem agar layanan inklusif ke depannya.", "lv": 3}, {"s": "TKP", "t": "pelayanan", "q": "Seorang warga marah dan merekam Anda dengan ponsel sambil menuduh pelayanan lambat, padahal keterlambatan disebabkan persyaratan dari instansi lain yang belum terbit. Sikap Anda …", "o": ["Tetap tenang, menjelaskan duduk persoalan dan dasar aturannya, lalu membantu menghubungi instansi terkait untuk menanyakan status persyaratan tersebut", "Tetap tenang dan menjelaskan bahwa keterlambatan berasal dari instansi lain beserta dasar aturannya", "Meminta warga menghentikan rekaman sebelum Anda memberi penjelasan", "Memanggil petugas keamanan agar warga tidak membuat keributan", "Balik merekam warga tersebut sebagai bukti"], "p": "Skor 4 berhenti pada penjelasan, sedangkan skor 5 ikut membantu menuntaskan masalah warga. Pola: empati dan penjelasan, ditambah tindakan.", "lv": 3}, {"s": "TKP", "t": "pelayanan", "q": "Formulir layanan yang berlaku membingungkan banyak warga sehingga sering terjadi kesalahan pengisian. Sikap Anda …", "o": ["Mengumpulkan contoh kesalahan yang sering terjadi, lalu mengusulkan penyederhanaan formulir dan panduan pengisian kepada atasan", "Membuat contoh pengisian formulir dan memasangnya di area layanan", "Membantu setiap warga yang kesulitan mengisi formulir", "Menyarankan warga bertanya kepada petugas jika bingung", "Mengembalikan formulir yang salah agar warga mengisi ulang"], "p": "Skor 4 adalah solusi jangka pendek yang bagus. Skor 5 menyelesaikan akar masalah berbasis data melalui jalur yang sesuai kewenangan.", "lv": 3}, {"s": "TKP", "t": "jejaring", "q": "Unit lain meminta data terbatas dari unit Anda untuk analisis bersama, tetapi permintaannya hanya disampaikan melalui pesan pribadi. Sikap Anda …", "o": ["Menyambut baik kerja sama tersebut, lalu meminta permintaan disampaikan melalui surat atau kanal resmi agar data dapat dibagikan sesuai ketentuan", "Berkonsultasi dengan atasan sebelum memberikan data", "Memberikan data yang tidak bersifat terbatas saja", "Menolak karena permintaan tidak resmi", "Mengirimkan data karena untuk kepentingan instansi"], "p": "Skor 5 menggabungkan sikap kolaboratif dengan kepatuhan prosedur. Skor 4 aman tetapi kurang proaktif membangun kerja sama.", "lv": 3}, {"s": "TKP", "t": "jejaring", "q": "Dalam tim lintas instansi, perwakilan sebuah instansi jarang hadir rapat sehingga keputusan sering tertunda. Sikap Anda …", "o": ["Menghubunginya langsung untuk memahami kendalanya, lalu menyepakati mekanisme koordinasi yang lebih fleksibel seperti rapat daring atau pembaruan tertulis", "Mengirimkan notulen dan meminta tanggapannya secara tertulis setelah setiap rapat", "Melaporkan ketidakhadirannya kepada pimpinan tim", "Tetap mengambil keputusan tanpa menunggu kehadirannya", "Mengusulkan agar instansinya dikeluarkan dari tim"], "p": "Skor 5 mencari akar masalah dan menyepakati solusi bersama. Skor 4 sudah komunikatif tetapi hanya satu arah.", "lv": 3}, {"s": "TKP", "t": "jejaring", "q": "Rekan setim mempresentasikan ide Anda di depan pimpinan seolah-olah idenya sendiri. Sikap Anda …", "o": ["Membicarakannya secara pribadi dan profesional dengan rekan tersebut, lalu menyepakati cara menyampaikan kontribusi bersama dalam tindak lanjut ide", "Menyampaikan kepada pimpinan disertai bukti bahwa ide tersebut berasal dari Anda", "Membiarkannya selama ide tersebut bermanfaat bagi organisasi", "Lebih berhati-hati dan tidak lagi berbagi ide dengan rekan tersebut", "Mengklarifikasi di depan forum bahwa itu ide Anda"], "p": "Untuk konflik antarrekan: komunikasi langsung dulu, baru eskalasi bila tidak selesai. Mengklarifikasi di depan forum mempermalukan rekan.", "lv": 3}, {"s": "TKP", "t": "jejaring", "q": "Anda koordinator kegiatan lintas unit. Dua unit saling mengklaim tugas yang sama dan saling menyalahkan. Sikap Anda …", "o": ["Mempertemukan kedua unit untuk memetakan tugas berdasarkan tugas pokok masing-masing dan menuangkan pembagian peran secara tertulis", "Membagi tugas kepada kedua unit sesuai penilaian Anda", "Meminta pimpinan masing-masing unit menyelesaikan persoalan", "Mengambil alih tugas tersebut agar kegiatan tidak terhambat", "Membiarkan kedua unit menyelesaikan masalahnya sendiri"], "p": "Skor 5 bersifat partisipatif, berdasar aturan, dan terdokumentasi. Skor 4 tegas tetapi sepihak, sehingga berpotensi menyisakan ketidakpuasan.", "lv": 3}, {"s": "TKP", "t": "jejaring", "q": "Mitra dari pemerintah daerah meminta Anda mempercepat proses rekomendasi teknis sambil menawarkan dukungan fasilitas untuk kegiatan instansi Anda. Sikap Anda …", "o": ["Menjelaskan bahwa proses berjalan sesuai standar waktu tanpa imbalan apa pun, sambil membantu memastikan kelengkapan dokumennya agar tidak tertunda", "Menolak tawaran fasilitas dan memproses sesuai antrean", "Meminta mitra berkomunikasi langsung dengan pimpinan", "Mempercepat proses karena mitra adalah instansi pemerintah", "Menerima tawaran untuk kegiatan instansi karena bukan untuk pribadi"], "p": "Skor 5 tegas menolak imbalan sekaligus membantu secara sah. Menerima fasilitas, meskipun untuk instansi, terkait langsung dengan percepatan layanan sehingga paling rendah.", "lv": 3}, {"s": "TKP", "t": "sosbud", "q": "Anda ditugaskan di daerah yang masyarakatnya terbiasa menyelesaikan urusan secara kekeluargaan, termasuk meminta layanan diproses tanpa melengkapi persyaratan. Sikap Anda …", "o": ["Menghormati pendekatan kekeluargaan dalam berkomunikasi sambil menjelaskan dengan bahasa yang mudah dipahami bahwa persyaratan tetap diperlukan, dan membantu warga melengkapinya", "Meminta tokoh masyarakat membantu menjelaskan aturan kepada warga", "Menjelaskan secara tegas bahwa persyaratan wajib dipenuhi tanpa pengecualian", "Memberikan kelonggaran untuk warga tertentu agar diterima masyarakat", "Mengikuti kebiasaan setempat agar tidak terjadi konflik"], "p": "Rumus sosial budaya: hargai, adaptasi, tetap profesional. Skor 5 memadukan ketiganya. Melibatkan tokoh masyarakat (skor 4) adaptif, tetapi tanggung jawab penjelasan dialihkan.", "lv": 3}, {"s": "TKP", "t": "sosbud", "q": "Rekan kerja sering bercanda dengan stereotip suku yang membuat rekan lain tampak tidak nyaman, meskipun rekan sasaran ikut tertawa. Sikap Anda …", "o": ["Mengajak pelaku bicara secara pribadi tentang dampak candaannya dan menunjukkan dukungan kepada rekan yang menjadi sasaran", "Menegur pelaku secara halus saat candaan itu terjadi", "Mengalihkan pembicaraan setiap kali candaan muncul", "Diam saja karena rekan sasaran juga ikut tertawa", "Ikut tertawa agar suasana tetap akrab"], "p": "Ikut tertawa tidak berarti nyaman. Skor 5 menyelesaikan akar masalah tanpa mempermalukan siapa pun. Teguran di tempat (skor 4) baik, tetapi berisiko canggung di depan umum.", "lv": 3}, {"s": "TKP", "t": "sosbud", "q": "Dalam rapat, seorang pegawai senior bersikeras berbicara dalam bahasa daerah, padahal beberapa peserta tidak memahaminya. Sikap Anda …", "o": ["Dengan sopan meminta izin merangkum pembahasan dalam bahasa Indonesia agar seluruh peserta dapat mengikuti, tanpa merendahkan bahasa daerah", "Menerjemahkan secara diam-diam kepada peserta yang tidak memahami", "Meminta pimpinan rapat menegur pegawai senior tersebut", "Membiarkannya karena menghormati senioritas", "Menegur pegawai senior di depan forum"], "p": "Bahasa Indonesia berperan sebagai pemersatu di forum bersama. Skor 5 inklusif dan tetap santun kepada senior. Menerjemahkan diam-diam hanya membantu sebagian peserta.", "lv": 3}, {"s": "TKP", "t": "sosbud", "q": "Masyarakat di wilayah tugas Anda menolak program vaksinasi karena keyakinan adat tertentu. Sikap Anda …", "o": ["Melibatkan tokoh adat dan tenaga kesehatan untuk berdialog, memahami kekhawatiran warga, dan menyampaikan informasi dengan pendekatan yang menghormati adat", "Mengadakan penyuluhan kesehatan yang jelas dan berulang kepada warga", "Meminta aparat desa mewajibkan warga mengikuti program", "Melaporkan penolakan kepada atasan dan menunggu arahan", "Membatalkan program di wilayah tersebut"], "p": "Skor 4 informatif, tetapi bersifat satu arah. Skor 5 dialogis dan melibatkan tokoh kunci, sehingga lebih efektif di masyarakat adat.", "lv": 3}, {"s": "TKP", "t": "sosbud", "q": "Anda panitia acara kantor. Sebagian pegawai mengusulkan menu tanpa mempertimbangkan pegawai yang memiliki pantangan makanan karena keyakinan agama. Sikap Anda …", "o": ["Menyusun menu yang dapat dinikmati semua peserta dan mengonfirmasi kebutuhan khusus peserta sebelum acara", "Menyediakan menu terpisah bagi pegawai yang memiliki pantangan", "Menyerahkan pilihan menu kepada penyedia katering", "Mengikuti usulan mayoritas dan meminta pegawai lain membawa makanan sendiri", "Mengikuti usulan mayoritas karena acara bersifat informal"], "p": "Menu terpisah (skor 4) sudah akomodatif, tetapi masih memisahkan. Menu bersama yang inklusif lebih mencerminkan kebersamaan.", "lv": 3}, {"s": "TKP", "t": "tik", "q": "Anda harus segera mengirim berkas berisi data pribadi masyarakat ke unit lain, sementara aplikasi resmi sedang lambat. Sikap Anda …", "o": ["Tetap menggunakan kanal resmi yang tersedia atau mengamankan berkas sesuai ketentuan keamanan informasi instansi, lalu mengonfirmasi penerimaannya", "Menunggu aplikasi resmi normal kembali, lalu segera mengirimkannya", "Mengirim melalui surel dinas tanpa pengamanan tambahan", "Mengirim melalui aplikasi pesan pribadi agar cepat sampai", "Mengunggah berkas ke penyimpanan awan publik dan membagikan tautannya"], "p": "Prinsip TIK: efisien tetapi aman. Skor 5 tetap aman sekaligus tetap bergerak. Skor 4 aman tetapi pasif menunggu.", "lv": 3}, {"s": "TKP", "t": "tik", "q": "Instansi menerapkan aplikasi baru, tetapi rekan-rekan senior enggan beralih karena merasa cara manual lebih mudah. Sikap Anda …", "o": ["Mendampingi rekan senior mempraktikkan aplikasi secara langsung dan menunjukkan manfaatnya bagi pekerjaan mereka", "Membuat panduan tertulis penggunaan aplikasi dan membagikannya", "Mengusulkan pelatihan resmi kepada atasan", "Mengerjakan input aplikasi untuk rekan senior agar target tercapai", "Membiarkannya karena itu pilihan masing-masing"], "p": "Pendampingan langsung lebih efektif untuk mengubah kebiasaan daripada panduan tertulis. Mengambil alih input membuat rekan tidak pernah belajar.", "lv": 3}, {"s": "TKP", "t": "tik", "q": "Anda menemukan celah keamanan pada aplikasi layanan instansi yang membuat data pengguna lain dapat terlihat. Sikap Anda …", "o": ["Segera melaporkan temuan beserta langkah reproduksinya kepada tim TI atau pengelola aplikasi melalui kanal resmi, tanpa mengakses data lebih jauh", "Melaporkan kepada atasan langsung agar diteruskan ke tim TI", "Mencatat temuan dan menyampaikannya pada rapat evaluasi berikutnya", "Menguji celah tersebut lebih jauh untuk memastikan seberapa besar dampaknya", "Membagikan temuan di grup kantor agar semua waspada"], "p": "Skor 5 cepat, tepat sasaran, dan tidak menyalahgunakan akses. Skor 4 benar tetapi lebih lambat. Menguji celah lebih jauh berarti mengakses data tanpa hak.", "lv": 3}, {"s": "TKP", "t": "tik", "q": "Atasan meminta Anda memakai aplikasi kecerdasan buatan publik untuk merangkum dokumen kebijakan yang belum dipublikasikan. Sikap Anda …", "o": ["Menyampaikan risiko kebocoran data kepada atasan dan mengusulkan penggunaan alat yang disetujui instansi, atau merangkum tanpa mengunggah isi yang rahasia", "Menghapus bagian yang sensitif sebelum mengunggah dokumen", "Merangkum dokumen secara manual tanpa menjelaskan alasannya", "Mengunggah dokumen karena sudah diperintahkan atasan", "Mengunggah dokumen ke beberapa aplikasi AI agar hasilnya lebih akurat"], "p": "Skor 5 komunikatif, sadar risiko, dan tetap menyelesaikan tugas. Skor 4 mengurangi risiko, tetapi dokumen yang belum dipublikasikan tetap terunggah.", "lv": 3}, {"s": "TKP", "t": "tik", "q": "Rekan kerja menyimpan kata sandi semua aplikasi dinas pada catatan yang ditempel di monitor. Sikap Anda …", "o": ["Mengingatkannya tentang risiko keamanan dan membantunya menyimpan kata sandi dengan cara yang aman sesuai kebijakan instansi", "Mengingatkannya agar segera melepas catatan tersebut", "Melaporkannya kepada tim TI", "Mencatat kata sandi tersebut untuk berjaga-jaga jika ia berhalangan", "Membiarkannya karena itu tanggung jawab pribadinya"], "p": "Masalahnya ringan dan bisa diselesaikan langsung, sehingga tindakan proporsional dan solutif mendapat skor 5. Langsung melapor ke tim TI terlalu cepat eskalasi.", "lv": 3}, {"s": "TKP", "t": "profesional", "q": "Menjelang tenggat, Anda menyadari laporan tim berisi kesalahan perhitungan yang signifikan, tetapi perbaikannya akan membuat laporan terlambat sehari. Sikap Anda …", "o": ["Segera menginformasikan kesalahan dan dampaknya kepada atasan, mengusulkan perbaikan, dan menyepakati tenggat baru atau penyerahan dengan catatan koreksi", "Memperbaiki kesalahan meski laporan terlambat, lalu menjelaskan alasannya saat menyerahkan", "Menyerahkan laporan tepat waktu, lalu mengirim revisi keesokan harinya tanpa pemberitahuan", "Menyerahkan laporan apa adanya karena tenggat lebih penting", "Menghapus bagian perhitungan yang salah agar laporan tetap tepat waktu"], "p": "Skor 4 jujur, tetapi atasan baru tahu setelah terlambat. Skor 5 transparan sejak awal sehingga atasan dapat mengambil keputusan.", "lv": 3}, {"s": "TKP", "t": "profesional", "q": "Anda menerima dua perintah yang bertentangan dari dua atasan berbeda dengan tenggat yang sama. Sikap Anda …", "o": ["Menyampaikan kondisi tersebut kepada kedua atasan dan meminta kesepakatan prioritas, sambil menyiapkan bagian pekerjaan yang dapat dikerjakan paralel", "Mengerjakan perintah dari atasan yang jabatannya lebih tinggi terlebih dahulu", "Mengerjakan /* ---------- Impor teks ---------- */
function parseSoalText(txt,s){
 const lines=txt.replace(/\r/g,'').split('\n').filter(l=>!/tes-cpns\.com|tryout gratis/i.test(l));
 const blocks=[];let cur=null;
 for(const ln of lines){if(/^\s*Soal\s+\d+\s*[.:]?\s*$/i.test(ln)){if(cur)blocks.push(cur);cur=[]}else if(cur)cur.push(ln)}
 if(cur)blocks.push(cur);
 return blocks.map(b=>{const q=[],o=[],p=[];let st='q',a=null,w={};
  for(const raw of b){const l=raw.trim();if(!l)continue;let m;
   if(st!=='p'&&(m=l.match(/^([A-E])[.)]\s*(.+)$/))&&o.length<5&&'ABCDE'[o.length]===m[1]){o.push(m[2]);st='o';continue}
   if((m=l.match(/^(?:Jawaban|Kunci)\s*[:：]\s*([A-E])/i))){a='ABCDE'.indexOf(m[1].toUpperCase());st='j';continue}
   if(s==='TKP'&&st!=='p'){const ms=[...l.matchAll(/\b([A-E])\s*[=:]\s*([1-5])\b/g)];if(ms.length){ms.forEach(x=>w[x[1]]=+x[2]);st='j';continue}}
   if(/^Pembahasan\s*[:：]?/i.test(l)){st='p';const r=l.replace(/^Pembahasan\s*[:：]?\s*/i,'');if(r)p.push(r);continue}
   if(/^Urutan skor/i.test(l))continue;
   if(st==='q')q.push(l);else if(st==='p')p.push(l);else if(st==='o'&&o.length)o[o.length-1]+=' '+l;
  }
  return {q:q.join('\n'),o,a,w:s==='TKP'?'ABCDE'.split('').map(k=>w[k]||0):[],p:p.join('\n')};
 });
}

/* ================== GENERATOR SOAL TIU ================== */
function mkOpts(ans,step){step=Math.max(1,Math.round(Math.abs(step)));const set=new Set([ans]);for(const k of shuffle([-2,-1,1,2,3,-3])){if(set.size>=5)break;const v=ans+k*step;if(v>0)set.add(v)}let k=4;while(set.size<5)set.add(ans+step*k++);return [...set]}
function genDeret(){
 const type=rnd(1,7);let t=[],ans,p,step;
 if(type===1){const a=rnd(2,40),d=rnd(3,13);for(let i=0;i<6;i++)t.push(a+i*d);ans=a+6*d;step=d;p=`Deret aritmetika: setiap suku bertambah ${d}. Suku berikutnya ${t[5]} + ${d} = ${ans}.`}
 else if(type===2){const a=rnd(1,15),d=rnd(1,5),c=rnd(1,4);let x=a,df=d;const ds=[];for(let i=0;i<6;i++){t.push(x);ds.push(df);x+=df;df+=c}ans=x;step=c+1;p=`Deret bertingkat: selisih antarsuku ${ds.slice(0,5).join(', ')} (selisihnya bertambah ${c}). Selisih berikutnya ${ds[5]}, sehingga ${t[5]} + ${ds[5]} = ${ans}.`}
 else if(type===3){const a=rnd(1,20),d1=rnd(2,9),b=rnd(45,90),d2=rnd(2,7);t=[a,b,a+d1,b-d2,a+2*d1,b-2*d2];ans=a+3*d1;step=d1;p=`Deret selang-seling. Suku ganjil: ${a}, ${a+d1}, ${a+2*d1} (+${d1}). Suku genap: ${b}, ${b-d2}, ${b-2*d2} (−${d2}). Suku ke-7 adalah suku ganjil: ${a+2*d1} + ${d1} = ${ans}.`}
 else if(type===4){const a=rnd(1,5),r=rnd(2,3);for(let i=0;i<5;i++)t.push(a*r**i);ans=a*r**5;step=Math.round(ans/(r*3));p=`Deret geometri: setiap suku dikali ${r}. Suku berikutnya ${t[4]} × ${r} = ${ans}.`}
 else if(type===6){const b=rnd(2,9);for(let i=0;i<5;i++)t.push((b+i)**2);ans=(b+5)**2;step=2*b+11;p=`Deret bilangan kuadrat: ${b}², ${b+1}², …, ${b+4}². Berikutnya ${b+5}² = ${ans}. (Bisa juga dilihat dari selisihnya yang naik 2.)`}
 else if(type===7){const a=rnd(2,7),k=rnd(1,4);let x=a;for(let i=0;i<6;i++){t.push(x);x=i%2===0?x*2:x+k}ans=x;step=k+2;p=`Dua operasi bergantian: ×2, +${k}, ×2, +${k}, … Langkah berikutnya ×2: ${t[5]} × 2 = ${ans}.`}
 else {const k=pick([1,2,3,-1]);const a=k<0?rnd(2,6):rnd(1,6);let x=a;for(let i=0;i<5;i++){t.push(x);x=2*x+k}ans=x;step=Math.max(2,Math.round(ans/12));p=`Pola: suku sebelumnya × 2 ${k>0?'+ '+k:'− '+(-k)}. Jadi ${t[4]} × 2 ${k>0?'+ '+k:'− '+(-k)} = ${ans}.`}
 return {s:'TIU',t:'numerik',q:`Bilangan yang tepat untuk melanjutkan deret <b>${t.join(', ')}, …</b> adalah …`,o:mkOpts(ans,step).map(fmt),p};
}
function genHitung(){
 const type=rnd(1,5);
 if(type===1){const p=pick([5,10,15,20,25,30,35,40,45]),y=rnd(2,40)*20,ans=p*y/100;return {s:'TIU',t:'numerik',q:`Nilai dari ${p}% × ${fmt(y)} adalah …`,o:mkOpts(ans,Math.max(1,Math.round(ans*0.1))).map(fmt),p:`${p}% × ${fmt(y)} = ${p}/100 × ${fmt(y)} = ${fmt(ans)}.`}}
 if(type===2){const v=rnd(4,12)*10,tt=pick([1.5,2,2.5,3,4]),s=v*tt;const tl=tt%1?`${Math.floor(tt)} jam 30 menit`:`${tt} jam`;return {s:'TIU',t:'numerik',q:`Sebuah kendaraan menempuh jarak ${fmt(s)} km dalam waktu ${tl}. Kecepatan rata-ratanya adalah …`,o:mkOpts(v,5).map(x=>fmt(x)+' km/jam'),p:`v = s ÷ t = ${fmt(s)} ÷ ${String(tt).replace('.',',')} = ${v} km/jam.`}}
 if(type===3){const b=pick([3,4,5,6,8]),a=rnd(1,b-1),k=rnd(3,25),N=b*k,ans=a*k;return {s:'TIU',t:'numerik',q:`Sebuah kantor memiliki ${N} pegawai. Sebanyak ${a}/${b} dari pegawai tersebut telah mengikuti pelatihan. Banyak pegawai yang belum mengikuti pelatihan adalah …`,o:mkOpts(N-ans,Math.max(1,k)).map(x=>fmt(x)+' orang'),p:`Yang sudah: ${a}/${b} × ${N} = ${ans}. Yang belum: ${N} − ${ans} = ${N-ans} orang.`}}
 if(type===4){const M=rnd(2,20)*1e6,r=pick([6,8,10,12]),n=pick([6,9,12,18,24]),b=M*r*n/1200;return {s:'TIU',t:'numerik',q:`Uang sebesar ${rp(M)} ditabung dengan bunga tunggal ${r}% per tahun. Besar bunga yang diperoleh setelah ${n} bulan adalah …`,o:mkOpts(b,Math.max(1000,Math.round(b*0.15/1000)*1000)).map(rp),p:`Bunga = ${rp(M)} × ${r}% × ${n}/12 = ${rp(b)}.`}}
 const a=rnd(2,7),c=rnd(2,9);if(a===c)return genHitung();const k=rnd(2,15)*5000,T=(a+c)*k;return {s:'TIU',t:'numerik',q:`Uang ${rp(T)} dibagikan kepada Rudi dan Sinta dengan perbandingan ${a} : ${c}. Bagian Rudi adalah …`,o:mkOpts(a*k,k).map(rp),p:`Total bagian = ${a+c}. Bagian Rudi = ${a}/${a+c} × ${rp(T)} = ${rp(a*k)}.`};
}
const nrm=x=>((x%360)+360)%360;
function arrowSVG(a,sz=54){return `<svg class="fig" viewBox="0 0 60 60" width="${sz}" height="${sz}"><rect x="2" y="2" width="56" height="56" rx="6" fill="#fff" stroke="#94a3b8"/><g transform="rotate(${a} 30 30)"><path d="M30 9 L43 25 H34.5 V51 H25.5 V25 H17 Z" fill="#0d3b66"/><circle cx="30" cy="45" r="2.6" fill="#f2b705"/></g></svg>`}
function genArrow(){
 const a0=rnd(0,7)*45,st=pick([45,90,135,-45,-90]);const fr=[0,1,2,3].map(i=>nrm(a0+i*st));const ans=nrm(a0+4*st);
 const wrong=shuffle([45,90,135,180,225,270,315]).slice(0,4).map(d=>nrm(ans+d));
 return {s:'TIU',t:'figural',q:`<p>Perhatikan pola gambar berikut. Gambar yang tepat untuk menggantikan tanda tanya adalah …</p><div class="figrow">${fr.map(x=>arrowSVG(x)).join('')}<div class="figq">?</div></div>`,o:[ans,...wrong].map(x=>arrowSVG(x,48)),p:`Panah berputar ${Math.abs(st)}° ${st>0?'searah':'berlawanan arah'} jarum jam pada setiap langkah. Gambar berikutnya adalah gambar ke-4 diputar ${Math.abs(st)}° lagi.`};
}
function quadSVG(sh,dot,sz=54){const pos=[[2,2],[30,2],[30,30],[2,30]],dp=[[16,16],[44,16],[44,44],[16,44]];return `<svg class="fig" viewBox="0 0 60 60" width="${sz}" height="${sz}"><rect x="2" y="2" width="56" height="56" fill="#fff" stroke="#475569"/><rect x="${pos[sh][0]}" y="${pos[sh][1]}" width="28" height="28" fill="#0d3b66"/><line x1="30" y1="2" x2="30" y2="58" stroke="#475569"/><line x1="2" y1="30" x2="58" y2="30" stroke="#475569"/><circle cx="${dp[dot][0]}" cy="${dp[dot][1]}" r="6" fill="#f2b705" stroke="${dot===sh?'#fff':'#0d3b66'}" stroke-width="1.5"/></svg>`}
function genQuad(){
 const m=x=>((x%4)+4)%4,s0=rnd(0,3),d0=rnd(0,3),ss=pick([1,-1]),ds=pick([1,-1,2]);
 const fr=[0,1,2,3].map(i=>[m(s0+i*ss),m(d0+i*ds)]),ans=[m(s0+4*ss),m(d0+4*ds)];
 const all=[];for(let a=0;a<4;a++)for(let b=0;b<4;b++)if(a!==ans[0]||b!==ans[1])all.push([a,b]);
 const opts=[ans,...shuffle(all).slice(0,4)];
 const dir=k=>k===2?'2 petak (melompat ke seberang)':`1 petak ${k>0?'searah':'berlawanan arah'} jarum jam`;
 return {s:'TIU',t:'figural',q:`<p>Perhatikan pola gambar berikut. Gambar yang tepat untuk menggantikan tanda tanya adalah …</p><div class="figrow">${fr.map(x=>quadSVG(x[0],x[1])).join('')}<div class="figq">?</div></div>`,o:opts.map(x=>quadSVG(x[0],x[1],48)),p:`Ada dua unsur yang bergerak terpisah. Kotak arsir berpindah ${dir(ss)}; lingkaran kuning berpindah ${dir(ds)}. Terapkan kedua pola ke gambar ke-4.`};
}

{id:'pancasila',h:`<h4>Kronologi perumusan</h4><table><tr><th>Waktu</th><th>Peristiwa</th></tr>

<div class="note"><b>Cara memakai tabel ini di soal:</b> jika soal meminta “pengamalan sila ke-…”, cocokkan kata kunci perilaku: <i>ibadah/toleransi</i> → sila 1, <i>HAM/menolong/martabat</i> → sila 2, <i>persatuan/cinta tanah air/produk dalam negeri</i> → sila 3, <i>musyawarah/pemilu/rapat</i> → sila 4, <i>adil/pajak/gotong royong/hidup sederhana</i> → sila 5.</div>
<p class="mut" style="font-size:13px">Hari Lahir Pancasila: 1 Juni. Hari Kesaktian Pancasila: 1 Oktober.</p>`},
